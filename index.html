<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고척초등학교 기버데이 인생네컷</title>
  
  <style>
    /* 1. 코트라 희망체 웹폰트 */
    @font-face {
      font-family: 'KotraHope';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2110@1.0/KOTRAHOPE.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    /* 2. 카페24 슈퍼매직 웹폰트 */
    @font-face {
      font-family: 'Cafe24Supermagic';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2307-2@1.0/Cafe24Supermagic-Bold-v1.0.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --current-font: 'KotraHope', 'Cafe24Supermagic', sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 10px 0;
      background-color: #1a1a24;
      color: #ffffff;
      font-family: var(--current-font) !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      font-size: 32px;
      margin-bottom: 8px;
      color: #ffde59;
      text-shadow: 0 3px 10px rgba(0,0,0,0.6);
      font-family: var(--current-font) !important;
      letter-spacing: 0.5px;
    }

    .top-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      background: #282838;
      padding: 10px 24px;
      border-radius: 40px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }

    .chip-group {
      display: flex;
      gap: 6px;
    }

    button, .chip-btn, .btn-main, .btn-sub, .btn-modal {
      font-family: var(--current-font) !important;
    }

    .chip-btn {
      border: 2px solid transparent;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .chip-btn.active {
      border-color: #ffde59;
      transform: scale(1.06);
      box-shadow: 0 0 10px rgba(255, 222, 89, 0.7);
    }

    .theme-ribbon   { background: #e3f2fd; color: #1971c2; }
    .theme-festival { background: #fff3bf; color: #e67700; }
    .theme-heart    { background: #ffe3ec; color: #d6336c; }
    .theme-animals  { background: #f3d9fa; color: #862e9c; }

    .font-btn { background: #3e3e52; color: #e2e8f0; }

    input[type=range] {
      width: 85px;
      accent-color: #ffde59;
      cursor: pointer;
    }

    .booth-container {
      position: relative;
      width: 440px;
      height: 600px;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,0.8);
      border: 5px solid #3c3c52;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      transition: filter 0.1s;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .cut-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #38d9a9;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 20px;
      display: none;
    }

    .countdown-text {
      font-size: 150px;
      color: #ff2a5f;
      text-shadow: 0 0 30px rgba(0,0,0,0.9);
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.25s ease-out;
    }

    .countdown-text.show {
      opacity: 1;
      transform: scale(1.15);
    }

    .flash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
    }

    .btn-main {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 13px 45px;
      font-size: 22px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(3, 105, 161, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-main:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.7);
    }

    .btn-main:disabled {
      background: #555;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-sub {
      background: #475569;
      color: white;
      border: none;
      padding: 13px 22px;
      font-size: 17px;
      border-radius: 40px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-sub:hover { background: #64748b; }

    /* 결과 모달 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.92);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    .modal-content {
      background: #252533;
      padding: 20px 26px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }

    #previewCanvas {
      width: 320px;
      height: 480px;
      background: white;
      border-radius: 6px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-modal {
      border: none;
      padding: 10px 22px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      color: white;
    }

    .btn-print { background: #0284c7; }
    .btn-print:hover { background: #0369a1; }
    .btn-download { background: #475569; }
    .btn-download:hover { background: #334155; }
    .btn-close { background: #e11d48; }
    .btn-close:hover { background: #be123c; }

    /* 인쇄 대기 팝업 */
    .loading-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.94);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      flex-direction: column;
    }

    .loading-card {
      background: white;
      color: #111;
      padding: 40px 50px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.7);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .loading-card h2 {
      font-size: 34px;
      margin: 0 0 14px 0;
      color: #0284c7;
      font-family: var(--current-font) !important;
    }

    .loading-card p {
      font-size: 22px;
      color: #475569;
      margin: 6px 0;
      font-family: var(--current-font) !important;
    }

    .spinner {
      margin: 24px auto 14px;
      width: 60px;
      height: 60px;
      border: 6px solid #f1f5f9;
      border-top: 6px solid #0284c7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    @page { size: 4in 6in; margin: 0; }
    @media print {
      body * { visibility: hidden; }
      .print-image, .print-image * { visibility: visible; }
      .print-image {
        position: absolute; left: 0; top: 0;
        width: 100vw; height: 100vh; display: block !important;
      }
    }
    .print-image { display: none; width: 100%; height: 100%; object-fit: fill; }
  </style>
</head>
<body>

  <header>★ 고척초등학교 기버데이 포토부스 ★</header>

  <div class="top-panel">
    <!-- 프레임 선택 -->
    <div class="option-group">
      <span>🎨 프레임:</span>
      <div class="chip-group" id="themeChips">
        <button class="chip-btn theme-ribbon active" data-theme="ribbon">🎀 하늘리본</button>
        <button class="chip-btn theme-festival" data-theme="festival">🎉 손그림 축제</button>
        <button class="chip-btn theme-heart" data-theme="heart">💖 몽글 하트</button>
        <button class="chip-btn theme-animals" data-theme="animals">🐾 동물 친구</button>
      </div>
    </div>

    <!-- 1번 요구사항: 폰트 2종으로 압축 (코트라희망체, 카페24슈퍼매직) -->
    <div class="option-group">
      <span>✍️ 글씨체:</span>
      <div class="chip-group" id="fontChips">
        <button class="chip-btn font-btn active" data-font="kotrahope">코트라 희망체</button>
        <button class="chip-btn font-btn" data-font="supermagic">카페24 슈퍼매직</button>
      </div>
    </div>

    <!-- 뽀샤시 -->
    <div class="option-group">
      <span>☀️ 뽀샤시:</span>
      <input type="range" id="brightnessRange" min="100" max="150" value="118">
      <span id="brightnessVal">118%</span>
    </div>
  </div>

  <div class="booth-container">
    <video id="webcam" autoplay playsinline></video>
    <div class="overlay">
      <div id="cutBadge" class="cut-badge">CUT 1 / 4</div>
      <div id="countdown" class="countdown-text">5</div>
    </div>
    <div id="flash" class="flash-screen"></div>
  </div>

  <div class="controls">
    <button id="btnStart" class="btn-main">📸 촬영 시작 (Space)</button>
    <button id="btnPreview" class="btn-sub">🔍 프레임 미리보기</button>
  </div>

  <!-- 결과 팝업 -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <div class="chip-group" id="modalThemeChips">
        <button class="chip-btn theme-ribbon" data-theme="ribbon">🎀 하늘리본</button>
        <button class="chip-btn theme-festival" data-theme="festival">🎉 손그림 축제</button>
        <button class="chip-btn theme-heart" data-theme="heart">💖 몽글 하트</button>
        <button class="chip-btn theme-animals" data-theme="animals">🐾 동물 친구</button>
      </div>

      <canvas id="previewCanvas" width="1200" height="1800"></canvas>

      <div class="modal-buttons">
        <button id="btnPrint" class="btn-modal btn-print">🖨️ 바로 인쇄</button>
        <button id="btnDownload" class="btn-modal btn-download">💾 사진 저장</button>
        <button id="btnClose" class="btn-modal btn-close">닫기</button>
      </div>
    </div>
  </div>

  <!-- 인쇄 대기 팝업 -->
  <div id="loadingModal" class="loading-modal">
    <div class="loading-card">
      <div class="spinner"></div>
      <h2>🖨️ 예쁘게 인쇄하고 있어요!</h2>
      <p>포토프린터에서 사진이 나올 때까지</p>
      <p style="color: #0284c7; font-size: 26px;">잠시만 자리에서 기다려주세요! 💖</p>
      <p id="printCountdown" style="font-size: 16px; color: #94a3b8; margin-top: 15px;">(약 12초 후 다음 촬영이 가능합니다)</p>
    </div>
  </div>

  <img id="printTarget" class="print-image" />

  <script>
    const CONFIG = {
      canvasWidth: 1200,
      canvasHeight: 1800,
      photoWidth: 485,
      photoHeight: 655,
      marginLeft: 95,
      marginTop: 90,
      gapX: 40,
      gapY: 40,
      countdownSec: 5
    };

    // 1번 요구사항: 폰트 매핑 (2종)
    const FONT_MAP = {
      kotrahope: "'KotraHope', sans-serif",
      supermagic: "'Cafe24Supermagic', sans-serif"
    };

    let currentTheme = 'ribbon';
    let currentFontKey = 'kotrahope';
    let brightnessMultiplier = 1.18;

    const video = document.getElementById('webcam');
    const btnStart = document.getElementById('btnStart');
    const btnPreview = document.getElementById('btnPreview');
    const cutBadge = document.getElementById('cutBadge');
    const countdownEl = document.getElementById('countdown');
    const flash = document.getElementById('flash');
    const modal = document.getElementById('resultModal');
    const loadingModal = document.getElementById('loadingModal');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const printTarget = document.getElementById('printTarget');
    const brightnessRange = document.getElementById('brightnessRange');
    const brightnessVal = document.getElementById('brightnessVal');

    let audioCtx = null;
    let capturedFrames = [];
    let isRunning = false;

    function applyFontToUIAndCanvas(fontKey) {
      currentFontKey = fontKey;
      const fontValue = FONT_MAP[fontKey];

      document.documentElement.style.setProperty('--current-font', fontValue);
      document.body.style.fontFamily = fontValue;

      drawPhotoStrip();
    }

    document.getElementById('fontChips').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip-btn');
      if (!btn) return;

      document.querySelectorAll('#fontChips .chip-btn').forEach(b => {
        b.classList.toggle('active', b === btn);
      });

      applyFontToUIAndCanvas(btn.dataset.font);
    });

    function updateVideoFilter() {
      video.style.filter = `brightness(${brightnessMultiplier}) contrast(1.05) saturate(1.05)`;
    }
    brightnessRange.addEventListener('input', (e) => {
      const val = e.target.value;
      brightnessMultiplier = val / 100;
      brightnessVal.innerText = `${val}%`;
      updateVideoFilter();
      drawPhotoStrip();
    });

    function syncThemeButtons() {
      document.querySelectorAll('#themeChips .chip-btn, #modalThemeChips .chip-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.theme === currentTheme);
      });
    }

    [document.getElementById('themeChips'), document.getElementById('modalThemeChips')].forEach(container => {
      container.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip-btn');
        if (!btn) return;
        currentTheme = btn.dataset.theme;
        syncThemeButtons();
        drawPhotoStrip();
      });
    });

    btnPreview.addEventListener('click', () => {
      drawPhotoStrip();
      modal.style.display = 'flex';
    });

    function playBeep(freq, duration) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        updateVideoFilter();
      } catch (err) {
        alert("카메라 연결 실패: " + err.message);
      }
    }

    async function startCaptureSequence() {
      if (isRunning) return;
      isRunning = true;
      btnStart.disabled = true;
      capturedFrames = [];
      cutBadge.style.display = 'block';

      for (let cut = 1; cut <= 4; cut++) {
        cutBadge.innerText = `CUT ${cut} / 4`;
        
        for (let sec = CONFIG.countdownSec; sec > 0; sec--) {
          countdownEl.innerText = sec;
          countdownEl.classList.add('show');
          playBeep(sec === 1 ? 950 : 800, 0.15);
          await wait(1000);
          countdownEl.classList.remove('show');
        }

        playBeep(1800, 0.35);
        triggerFlash();
        captureCurrentFrame();
        await wait(600);
      }

      cutBadge.style.display = 'none';
      drawPhotoStrip();
      modal.style.display = 'flex';
      isRunning = false;
      btnStart.disabled = false;
    }

    function captureCurrentFrame() {
      const tempCanvas = document.createElement('canvas');
      const vW = video.videoWidth || 1280;
      const vH = video.videoHeight || 720;

      const targetRatio = CONFIG.photoWidth / CONFIG.photoHeight;
      let sW = vH * targetRatio;
      let sH = vH;
      let sX = (vW - sW) / 2;
      let sY = 0;

      tempCanvas.width = CONFIG.photoWidth;
      tempCanvas.height = CONFIG.photoHeight;
      const tCtx = tempCanvas.getContext('2d');

      tCtx.translate(CONFIG.photoWidth, 0);
      tCtx.scale(-1, 1);
      tCtx.drawImage(video, sX, sY, sW, sH, 0, 0, CONFIG.photoWidth, CONFIG.photoHeight);

      capturedFrames.push(tempCanvas);
    }

    function triggerFlash() {
      flash.style.opacity = '0.95';
      flash.style.transition = 'none';
      setTimeout(() => {
        flash.style.transition = 'opacity 0.4s ease-out';
        flash.style.opacity = '0';
      }, 50);
    }

    // ==========================================
    // 손그림 드로잉 함수 (중심점 0,0 기준 대칭 보정)
    // ==========================================
    function drawDoodleRibbon(ctx, x, y, scale = 0.65, angle = 0, color = "#94c2ec") {
      ctx.save();
      ctx.translate(x, y - 5);
      ctx.rotate(angle * Math.PI / 180);
      ctx.scale(scale, scale);
      ctx.strokeStyle = color;
      ctx.lineWidth = 5.0;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-18, -30, -52, -16, -46, 8);
      ctx.bezierCurveTo(-40, 24, -16, 13, 0, 0);
      ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(18, -30, 52, -16, 46, 8);
      ctx.bezierCurveTo(40, 24, 16, 13, 0, 0);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-4, 5);
      ctx.bezierCurveTo(-13, 23, -22, 42, -32, 58);
      ctx.lineTo(-22, 48);
      ctx.lineTo(-16, 59);
      ctx.bezierCurveTo(-10, 42, -3, 23, 0, 5);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(4, 5);
      ctx.bezierCurveTo(13, 23, 22, 42, 32, 58);
      ctx.lineTo(22, 48);
      ctx.lineTo(16, 59);
      ctx.bezierCurveTo(10, 42, 3, 23, 0, 5);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 1, 8, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    // 3번 요구사항: 하트의 중심(0,0)을 정확히 기준점으로 잡아 위로 쏠림 방지
    function drawDoodleHeart(ctx, x, y, size = 38, angle = 0, color = "#ff7597") {
      ctx.save();
      ctx.translate(x, y - (size * 0.45));
      ctx.rotate(angle * Math.PI / 180);
      ctx.strokeStyle = color;
      ctx.fillStyle = "rgba(255, 240, 245, 0.65)";
      ctx.lineWidth = 4.8;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();
      const topCurveHeight = size * 0.32;
      ctx.moveTo(0, topCurveHeight);
      ctx.bezierCurveTo(0, -2, -size / 1.8, -2, -size / 1.8, topCurveHeight);
      ctx.bezierCurveTo(-size / 1.8, (size + topCurveHeight) / 1.8, 0, (size + topCurveHeight) / 1.4, 0, size);
      ctx.bezierCurveTo(0, (size + topCurveHeight) / 1.4, size / 1.8, (size + topCurveHeight) / 1.8, size / 1.8, topCurveHeight);
      ctx.bezierCurveTo(size / 1.8, -2, 0, -2, 0, topCurveHeight);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = "rgba(255, 117, 151, 0.5)";
      ctx.lineWidth = 2.5;
      ctx.arc(-size*0.2, topCurveHeight*0.8, 4, 0, Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    // 3번 요구사항: 축제 아이템 기준점 중심 정렬
    function drawDoodlePartyItem(ctx, x, y, type, color, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.strokeStyle = color;
      ctx.lineWidth = 4.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (type === 'hat') {
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        ctx.beginPath();
        ctx.moveTo(0, -28);
        ctx.lineTo(-18, 18);
        ctx.quadraticCurveTo(0, 24, 18, 18);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, -31, 5.5, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-9, -4); ctx.lineTo(9, -1);
        ctx.moveTo(-13, 10); ctx.lineTo(13, 12);
        ctx.stroke();

      } else if (type === 'balloon') {
        ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
        ctx.beginPath();
        ctx.ellipse(0, -6, 17, 22, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-3, 16); ctx.lineTo(3, 16); ctx.lineTo(0, 19); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, 19);
        ctx.bezierCurveTo(-7, 27, 7, 35, -2, 43);
        ctx.stroke();

      } else if (type === 'star') {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.quadraticCurveTo(0, 0, 20, 0);
        ctx.quadraticCurveTo(0, 0, 0, 20);
        ctx.quadraticCurveTo(0, 0, -20, 0);
        ctx.quadraticCurveTo(0, 0, 0, -20);
        ctx.fill();
      }
      ctx.restore();
    }

    // 3번 요구사항: 동물 중심 정렬
    function drawDoodleAnimal(ctx, x, y, type, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.strokeStyle = "#7c5335";
      ctx.lineWidth = 4.2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.fillStyle = "#ffffff";

      if (type === 'bear') {
        ctx.beginPath(); ctx.arc(-19, -16, 9.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(19, -16, 9.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 2, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#7c5335";
        ctx.beginPath(); ctx.arc(-8, 0, 2.8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, 0, 2.8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, 8, 4.5, 3.5, 0, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = "#ffb3c1";
        ctx.beginPath(); ctx.arc(-14, 8, 3.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(14, 8, 3.5, 0, Math.PI*2); ctx.fill();

      } else if (type === 'bunny') {
        ctx.beginPath(); ctx.ellipse(-9, -20, 6.5, 17, -0.15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(9, -20, 6.5, 17, 0.15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 4, 22, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#7c5335";
        ctx.beginPath(); ctx.arc(-7, 2, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(7, 2, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#ff85a2";
        ctx.beginPath(); ctx.arc(0, 8, 2.8, 0, Math.PI*2); ctx.fill();

      } else if (type === 'flower') {
        ctx.fillStyle = "#ffde59";
        for (let i = 0; i < 5; i++) {
          const a = (i * 72) * Math.PI / 180;
          ctx.beginPath();
          ctx.arc(Math.cos(a)*14, Math.sin(a)*14, 7.5, 0, Math.PI*2);
          ctx.fillStyle = "#ffffff";
          ctx.fill(); ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, Math.PI*2); ctx.fillStyle = "#ffc048"; ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }

    // ==========================================
    // 캔버스 렌더링
    // ==========================================
    function drawPhotoStrip() {
      ctx.filter = "none";

      // ★ 3번 요구사항: 상하좌우 완벽 대칭 좌표 (y=900 정중앙 대칭, 상단 여백 80px = 하단 여백 80px)
      const symRowA = [85, 340, 600, 860, 1115];
      const symRowB = [210, 470, 730, 990];
      const yPositions = [80, 240, 390, 540, 690, 840, 960, 1110, 1260, 1410, 1560, 1720];

      if (currentTheme === 'ribbon') {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        yPositions.forEach((y, rowIdx) => {
          const cols = (rowIdx % 2 === 0) ? symRowA : symRowB;
          cols.forEach((x, cIdx) => {
            const rot = ((x * 3 + y * 7) % 32) - 16;
            const scale = 0.62 + ((cIdx + rowIdx) % 3) * 0.03;
            drawDoodleRibbon(ctx, x, y, scale, rot, "#95c2eb");
          });
        });

      } else if (currentTheme === 'festival') {
        ctx.fillStyle = "#fffef7";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        const items = ['hat', 'balloon', 'star'];
        const colors = ['#ff7675', '#fdcb6e', '#74b9ff', '#55efc4', '#a29bfe'];
        let idx = 0;

        yPositions.forEach((y, rowIdx) => {
          const cols = (rowIdx % 2 === 0) ? symRowA : symRowB;
          cols.forEach((x) => {
            const item = items[idx % items.length];
            const col = colors[idx % colors.length];
            const rot = ((x * 4 + y * 6) % 30) - 15;
            drawDoodlePartyItem(ctx, x, y, item, col, rot);
            idx++;
          });
        });

      } else if (currentTheme === 'heart') {
        ctx.fillStyle = "#fff9fb";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        const heartColors = ['#ff7597', '#ff8fab', '#ffa2b8', '#ff5c8a'];
        let cIdx = 0;

        yPositions.forEach((y, rowIdx) => {
          const cols = (rowIdx % 2 === 0) ? symRowA : symRowB;
          cols.forEach((x) => {
            const rot = ((x * 5 + y * 3) % 36) - 18;
            const size = 36 + ((x * y) % 6);
            drawDoodleHeart(ctx, x, y, size, rot, heartColors[cIdx % heartColors.length]);
            cIdx++;
          });
        });

      } else if (currentTheme === 'animals') {
        ctx.fillStyle = "#fcfaf7";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        const animals = ['bear', 'bunny', 'flower'];
        let aIdx = 0;

        yPositions.forEach((y, rowIdx) => {
          const cols = (rowIdx % 2 === 0) ? symRowA : symRowB;
          cols.forEach((x) => {
            const type = animals[aIdx % animals.length];
            const rot = ((x * 2 + y * 7) % 26) - 13;
            drawDoodleAnimal(ctx, x, y, type, rot);
            aIdx++;
          });
        });
      }

      // ★ 2번 요구사항: 둥근 모서리 없이 깔끔한 '직각 사각형'으로 4컷 사진 렌더링
      const col2X = CONFIG.marginLeft + CONFIG.photoWidth + CONFIG.gapX;
      const row2Y = CONFIG.marginTop + CONFIG.photoHeight + CONFIG.gapY;
      const positions = [
        { x: CONFIG.marginLeft, y: CONFIG.marginTop },
        { x: col2X,             y: CONFIG.marginTop },
        { x: CONFIG.marginLeft, y: row2Y },
        { x: col2X,             y: row2Y }
      ];

      const hasRealPhotos = capturedFrames.length === 4;

      positions.forEach((pos, index) => {
        ctx.save();
        ctx.shadowColor = "rgba(0, 0, 0, 0.12)";
        ctx.shadowBlur = 12;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 4;

        // 사각형 바탕 흰색 판
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
        ctx.restore();

        // 사각형 사진 영역 클리핑
        ctx.save();
        ctx.beginPath();
        ctx.rect(pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
        ctx.clip();

        if (hasRealPhotos) {
          ctx.filter = `brightness(${brightnessMultiplier}) contrast(1.06) saturate(1.05)`;
          ctx.drawImage(capturedFrames[index], pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
        } else {
          ctx.fillStyle = "#f6f8fb";
          ctx.fillRect(pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
          ctx.fillStyle = "#94a3b8";
          ctx.font = `34px ${FONT_MAP[currentFontKey]}`;
          ctx.textAlign = "center";
          ctx.fillText(`사진 ${index + 1} 들어가는 곳`, pos.x + CONFIG.photoWidth / 2, pos.y + CONFIG.photoHeight / 2);
        }
        ctx.restore();

        // 사각형 화이트 테두리 선
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 8;
        ctx.strokeRect(pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
      });

      // 하단 문구
      const bannerTop = row2Y + CONFIG.photoHeight + 35;
      const bannerCenterY = bannerTop + ((CONFIG.canvasHeight - bannerTop) / 2) - 8;
      const selectedFont = FONT_MAP[currentFontKey];

      ctx.textAlign = "center";

      let mainTextColor = "#0284c7";
      let subTextColor  = "#38bdf8";

      if (currentTheme === 'festival') {
        mainTextColor = "#d9480f";
        subTextColor  = "#f76707";
      } else if (currentTheme === 'heart') {
        mainTextColor = "#d6336c";
        subTextColor  = "#f783ac";
      } else if (currentTheme === 'animals') {
        mainTextColor = "#5c3d2e";
        subTextColor  = "#8b5e3c";
      }

      ctx.lineJoin = "round";
      ctx.miterLimit = 2;

      // 윗줄 문구
      ctx.font = `bold 74px ${selectedFont}`;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 16;
      ctx.strokeText("♥2026 고척초등학교 기버데이♥", CONFIG.canvasWidth / 2, bannerCenterY - 26);
      ctx.fillStyle = mainTextColor;
      ctx.fillText("♥2026 고척초등학교 기버데이♥", CONFIG.canvasWidth / 2, bannerCenterY - 26);

      // 아랫줄 날짜
      ctx.font = `bold 54px ${selectedFont}`;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 12;
      ctx.strokeText("2026.11.19", CONFIG.canvasWidth / 2, bannerCenterY + 54);
      ctx.fillStyle = subTextColor;
      ctx.fillText("2026.11.19", CONFIG.canvasWidth / 2, bannerCenterY + 54);
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    btnStart.addEventListener('click', startCaptureSequence);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isRunning && modal.style.display !== 'flex' && loadingModal.style.display !== 'flex') {
        e.preventDefault();
        startCaptureSequence();
      }
    });

    document.getElementById('btnPrint').addEventListener('click', () => {
      printTarget.src = canvas.toDataURL('image/png');
      modal.style.display = 'none';
      loadingModal.style.display = 'flex';

      setTimeout(() => {
        window.print();
      }, 300);

      let remain = 12;
      const countLabel = document.getElementById('printCountdown');
      const timer = setInterval(() => {
        remain--;
        countLabel.innerText = `(약 ${remain}초 후 다음 촬영이 가능합니다)`;
        if (remain <= 0) {
          clearInterval(timer);
          loadingModal.style.display = 'none';
        }
      }, 1000);
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `고척초_기버데이_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    document.getElementById('btnClose').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    document.fonts.ready.then(() => {
      applyFontToUIAndCanvas('kotrahope');
    });

    initCamera();
  </script>
</body>
</html>
