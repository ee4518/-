<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고척초등학교 기버데이 인생네컷</title>
  
  <style>
    /* 코트라 희망체 단독 로드 (설치 불필요 웹폰트) */
    @font-face {
      font-family: 'KotraHope';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2110@1.0/KOTRAHOPE.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 10px 0;
      background-color: #ffffff;
      color: #222222;
      font-family: 'KotraHope', sans-serif !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      font-size: 32px;
      margin-bottom: 8px;
      color: #e6a800;
      text-shadow: 0 2px 6px rgba(0,0,0,0.15);
      font-family: 'KotraHope', sans-serif !important;
      letter-spacing: 0.5px;
    }

    /* 상단 패널 (밝기 + 색감) */
    .top-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 22px;
      margin-bottom: 12px;
      background: #282838;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 40px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
    }

    button, .chip-btn, .btn-main, .btn-sub, .btn-modal {
      font-family: 'KotraHope', sans-serif !important;
    }

    .chip-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .chip-btn {
      border: 2px solid transparent;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .chip-btn.active {
      border-color: #ffde59;
      transform: scale(1.06);
      box-shadow: 0 0 10px rgba(255, 222, 89, 0.7);
    }

    .theme-frame    { background: #e7f5ff; color: #1864ab; }
    .theme-ribbon   { background: #e3f2fd; color: #1971c2; }
    .theme-festival { background: #fff3bf; color: #e67700; }
    .theme-heart    { background: #ffe3ec; color: #d6336c; }
    .theme-animals  { background: #f3d9fa; color: #862e9c; }
    .theme-school   { background: #fff0d9; color: #b25000; }
    .theme-winter   { background: #e7f5ff; color: #1864ab; }

    /* 색감 선택 버튼 */
    .chip-btn.tone-soft    { background: #fff0f6; color: #d6336c; }
    .chip-btn.tone-film    { background: #fff4e6; color: #a15c00; }
    .chip-btn.tone-mono    { background: #f1f3f5; color: #343a40; }
    .chip-btn.tone-natural { background: #e7f5ff; color: #1971c2; }

    input[type=range] {
      width: 100px;
      accent-color: #ffde59;
      cursor: pointer;
    }

    /* 세로형 뷰어 부스 */
    .booth-container {
      position: relative;
      width: 440px;
      height: 600px;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,0.8);
      border: 5px solid #3c3c52;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      transition: filter 0.1s;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .cut-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #38d9a9;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 20px;
      display: none;
    }

    .countdown-text {
      font-size: 150px;
      color: #ff2a5f;
      text-shadow: 0 0 30px rgba(0,0,0,0.9);
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.25s ease-out;
    }

    .countdown-text.show {
      opacity: 1;
      transform: scale(1.15);
    }

    .flash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
    }

    .btn-main {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 13px 45px;
      font-size: 22px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(3, 105, 161, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-main:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.7);
    }

    .btn-main:disabled {
      background: #555;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-sub {
      background: #475569;
      color: white;
      border: none;
      padding: 13px 22px;
      font-size: 17px;
      border-radius: 40px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-sub:hover { background: #64748b; }

    /* 결과 & 배경 미리보기 모달 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.92);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    .modal-content {
      background: #252533;
      padding: 20px 26px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }

    #previewCanvas {
      width: 320px;
      height: 480px;
      background: white;
      border-radius: 6px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-modal {
      border: none;
      padding: 10px 22px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      color: white;
    }

    .btn-print { background: #0284c7; }
    .btn-print:hover { background: #0369a1; }
    .btn-download { background: #475569; }
    .btn-download:hover { background: #334155; }
    .btn-close { background: #e11d48; }
    .btn-close:hover { background: #be123c; }

    /* 인쇄 대기 팝업 */
    .loading-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.94);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      flex-direction: column;
    }

    .loading-card {
      background: white;
      color: #111;
      padding: 40px 50px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.7);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .loading-card h2 {
      font-size: 34px;
      margin: 0 0 14px 0;
      color: #0284c7;
      font-family: 'KotraHope', sans-serif !important;
    }

    .loading-card p {
      font-size: 22px;
      color: #475569;
      margin: 6px 0;
      font-family: 'KotraHope', sans-serif !important;
    }

    .spinner {
      margin: 24px auto 14px;
      width: 60px;
      height: 60px;
      border: 6px solid #f1f5f9;
      border-top: 6px solid #0284c7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    @page { size: 4in 6in; margin: 0; }
    @media print {
      body * { visibility: hidden; }
      .print-image, .print-image * { visibility: visible; }
      .print-image {
        position: absolute; left: 0; top: 0;
        width: 100vw; height: 100vh; display: block !important;
      }
    }
    .print-image { display: none; width: 100%; height: 100%; object-fit: fill; }
  </style>
</head>
<body>

  <header>★ 고척초등학교 기버데이 포토부스 ★</header>

  <!-- 상단 패널: 밝기 + 색감 선택 -->
  <div class="top-panel">
    <div class="option-group">
      <span>☀️ 밝기:</span>
      <input type="range" id="brightnessRange" min="100" max="150" value="118">
      <span id="brightnessVal">118%</span>
    </div>
    <div class="option-group">
      <span>🎨 색감:</span>
      <div class="chip-group" id="toneChips">
        <button class="chip-btn tone-soft" data-tone="soft">뽀송</button>
        <button class="chip-btn tone-film" data-tone="film">필름</button>
        <button class="chip-btn tone-mono" data-tone="mono">흑백</button>
        <button class="chip-btn tone-natural active" data-tone="natural">자연</button>
      </div>
    </div>
  </div>

  <div class="booth-container">
    <video id="webcam" autoplay playsinline></video>
    <div class="overlay">
      <div id="cutBadge" class="cut-badge">CUT 1 / 2</div>
      <div id="countdown" class="countdown-text">5</div>
    </div>
    <div id="flash" class="flash-screen"></div>
  </div>

  <!-- 2번 요구사항: [배경 미리보기] 버튼 -->
  <div class="controls">
    <button id="btnStart" class="btn-main">📸 촬영 시작 (Space)</button>
    <button id="btnPreview" class="btn-sub">🔍 배경 미리보기</button>
  </div>

  <!-- 결과 & 배경 선택/미리보기 모달 -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <!-- 팝업 내부에서 원하는 배경을 클릭해 전환 -->
      <div class="option-group" style="margin-bottom: 2px;">
        <span style="font-size: 16px;">🎨 배경 선택:</span>
        <div class="chip-group" id="modalThemeChips">
          <button class="chip-btn theme-frame active" data-theme="frame">✏️ 기본 프레임</button>
          <button class="chip-btn theme-ribbon" data-theme="ribbon">🎀 하늘리본</button>
          <button class="chip-btn theme-festival" data-theme="festival">🎉 손그림 축제</button>
          <button class="chip-btn theme-heart" data-theme="heart">💖 몽글 하트</button>
          <button class="chip-btn theme-animals" data-theme="animals">🐾 동물 친구</button>
          <button class="chip-btn theme-school" data-theme="school">🎁 기버데이</button>
          <button class="chip-btn theme-winter" data-theme="winter">❄️ 겨울</button>
        </div>
      </div>

      <canvas id="previewCanvas" width="1200" height="1800"></canvas>

      <div class="modal-buttons">
        <button id="btnPrint" class="btn-modal btn-print">🖨️ 바로 인쇄</button>
        <button id="btnDownload" class="btn-modal btn-download">💾 사진 저장</button>
        <button id="btnClose" class="btn-modal btn-close">닫기</button>
      </div>
    </div>
  </div>

  <!-- 인쇄 대기 팝업 -->
  <div id="loadingModal" class="loading-modal">
    <div class="loading-card">
      <div class="spinner"></div>
      <h2>🖨️ 예쁘게 인쇄하고 있어요!</h2>
      <p>포토프린터에서 사진이 나올 때까지</p>
      <p style="color: #0284c7; font-size: 26px;">잠시만 자리에서 기다려주세요! 💖</p>
      <p id="printCountdown" style="font-size: 16px; color: #94a3b8; margin-top: 15px;">(약 12초 후 다음 촬영이 가능합니다)</p>
    </div>
  </div>

  <img id="printTarget" class="print-image" />

  <script>
    const CONFIG = {
      canvasWidth: 1200,
      canvasHeight: 1800,
      photoWidth: 485,
      photoHeight: 655,
      marginLeft: 57.5,  // 세로 반 컷 시 각 반쪽(600px)에서 좌우 여백 동일: (600-485)/2
      marginTop: 90,
      gapY: 40,
      cutCount: 2,       // 촬영 횟수 (2번 찍어서 윗줄/아랫줄에 같은 사진 배치)
      countdownSec: 5
    };

    // 3번 요구사항: 코트라 희망체 단독 적용
    const APP_FONT = "'KotraHope', sans-serif";

    let currentTheme = 'frame';
    let brightnessMultiplier = 1.18;
    let currentTone = 'natural';

    // 색감 프리셋 (행사 중 버튼으로 바로 바꿀 수 있음)
    const TONES = {
      soft:    'saturate(1.08) brightness(1.05) contrast(1.02)',
      film:    'sepia(0.28) saturate(0.92) contrast(1.06) brightness(1.04)',
      mono:    'grayscale(1) contrast(1.08) brightness(1.03)',
      natural: ''
    };

    function photoFilter() {
      return `brightness(${brightnessMultiplier}) contrast(1.05) saturate(1.05) ${TONES[currentTone] || ''}`.trim();
    }

    // 학교 로고
    // 1) LOGO_DATA_URL 에 base64 문자열이 있으면 그것을 사용 (파일 하나로 배포 가능, 인쇄/저장 안전)
    // 2) 비어 있으면 같은 폴더의 logo.png 를 읽음
    const LOGO_DATA_URL = '';
    const schoolLogo = new Image();
    let logoLoaded = false;
    schoolLogo.onload = () => { logoLoaded = true; drawPhotoStrip(); };
    schoolLogo.onerror = () => { logoLoaded = false; };
    schoolLogo.src = LOGO_DATA_URL || 'logo.png';

    const video = document.getElementById('webcam');
    const btnStart = document.getElementById('btnStart');
    const btnPreview = document.getElementById('btnPreview');
    const cutBadge = document.getElementById('cutBadge');
    const countdownEl = document.getElementById('countdown');
    const flash = document.getElementById('flash');
    const modal = document.getElementById('resultModal');
    const loadingModal = document.getElementById('loadingModal');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const printTarget = document.getElementById('printTarget');
    const brightnessRange = document.getElementById('brightnessRange');
    const brightnessVal = document.getElementById('brightnessVal');

    let audioCtx = null;
    let capturedFrames = [];
    let isRunning = false;

    // 밝기 조절 이벤트
    function updateVideoFilter() {
      video.style.filter = photoFilter();
    }
    brightnessRange.addEventListener('input', (e) => {
      const val = e.target.value;
      brightnessMultiplier = val / 100;
      brightnessVal.innerText = `${val}%`;
      updateVideoFilter();
      drawPhotoStrip();
    });

    // 색감 선택 이벤트
    document.getElementById('toneChips').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip-btn');
      if (!btn) return;
      currentTone = btn.dataset.tone;
      document.querySelectorAll('#toneChips .chip-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tone === currentTone);
      });
      updateVideoFilter();
      drawPhotoStrip();
    });

    // 모달창 내부 테마 변경 이벤트
    document.getElementById('modalThemeChips').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip-btn');
      if (!btn) return;
      currentTheme = btn.dataset.theme;

      document.querySelectorAll('#modalThemeChips .chip-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.theme === currentTheme);
      });

      drawPhotoStrip();
    });

    // 2번 요구사항: [배경 미리보기] 클릭 시 팝업 열기
    btnPreview.addEventListener('click', () => {
      drawPhotoStrip();
      modal.style.display = 'flex';
    });

    function playBeep(freq, duration) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        updateVideoFilter();
      } catch (err) {
        alert("카메라 연결 실패: " + err.message);
      }
    }

    async function startCaptureSequence() {
      if (isRunning) return;
      isRunning = true;
      btnStart.disabled = true;
      capturedFrames = [];
      cutBadge.style.display = 'block';

      for (let cut = 1; cut <= CONFIG.cutCount; cut++) {
        cutBadge.innerText = `CUT ${cut} / ${CONFIG.cutCount}`;
        
        for (let sec = CONFIG.countdownSec; sec > 0; sec--) {
          countdownEl.innerText = sec;
          countdownEl.classList.add('show');
          playBeep(sec === 1 ? 950 : 800, 0.15);
          await wait(1000);
          countdownEl.classList.remove('show');
        }

        playBeep(1800, 0.35);
        triggerFlash();
        captureCurrentFrame();
        await wait(600);
      }

      cutBadge.style.display = 'none';
      drawPhotoStrip();
      modal.style.display = 'flex';
      isRunning = false;
      btnStart.disabled = false;
    }

    function captureCurrentFrame() {
      const tempCanvas = document.createElement('canvas');
      const vW = video.videoWidth || 1280;
      const vH = video.videoHeight || 720;

      const targetRatio = CONFIG.photoWidth / CONFIG.photoHeight;
      let sW = vH * targetRatio;
      let sH = vH;
      let sX = (vW - sW) / 2;
      let sY = 0;

      tempCanvas.width = CONFIG.photoWidth;
      tempCanvas.height = CONFIG.photoHeight;
      const tCtx = tempCanvas.getContext('2d');

      tCtx.translate(CONFIG.photoWidth, 0);
      tCtx.scale(-1, 1);
      tCtx.drawImage(video, sX, sY, sW, sH, 0, 0, CONFIG.photoWidth, CONFIG.photoHeight);

      capturedFrames.push(tempCanvas);
    }

    function triggerFlash() {
      flash.style.opacity = '0.95';
      flash.style.transition = 'none';
      setTimeout(() => {
        flash.style.transition = 'opacity 0.4s ease-out';
        flash.style.opacity = '0';
      }, 50);
    }

    // ==========================================
    // 손그림 드로잉 함수
    // ==========================================
    function drawDoodleRibbon(ctx, x, y, scale = 0.65, angle = 0, color = "#94c2ec") {
      ctx.save();
      ctx.translate(x, y - 5);
      ctx.rotate(angle * Math.PI / 180);
      ctx.scale(scale, scale);
      ctx.strokeStyle = color;
      ctx.lineWidth = 5.0;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-18, -30, -52, -16, -46, 8);
      ctx.bezierCurveTo(-40, 24, -16, 13, 0, 0);
      ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(18, -30, 52, -16, 46, 8);
      ctx.bezierCurveTo(40, 24, 16, 13, 0, 0);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-4, 5);
      ctx.bezierCurveTo(-13, 23, -22, 42, -32, 58);
      ctx.lineTo(-22, 48);
      ctx.lineTo(-16, 59);
      ctx.bezierCurveTo(-10, 42, -3, 23, 0, 5);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(4, 5);
      ctx.bezierCurveTo(13, 23, 22, 42, 32, 58);
      ctx.lineTo(22, 48);
      ctx.lineTo(16, 59);
      ctx.bezierCurveTo(10, 42, 3, 23, 0, 5);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 1, 8, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function drawDoodleHeart(ctx, x, y, size = 38, angle = 0, color = "#ff7597") {
      ctx.save();
      ctx.translate(x, y - (size * 0.45));
      ctx.rotate(angle * Math.PI / 180);
      ctx.strokeStyle = color;
      ctx.fillStyle = "rgba(255, 240, 245, 0.65)";
      ctx.lineWidth = 4.8;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();
      const topCurveHeight = size * 0.32;
      ctx.moveTo(0, topCurveHeight);
      ctx.bezierCurveTo(0, -2, -size / 1.8, -2, -size / 1.8, topCurveHeight);
      ctx.bezierCurveTo(-size / 1.8, (size + topCurveHeight) / 1.8, 0, (size + topCurveHeight) / 1.4, 0, size);
      ctx.bezierCurveTo(0, (size + topCurveHeight) / 1.4, size / 1.8, (size + topCurveHeight) / 1.8, size / 1.8, topCurveHeight);
      ctx.bezierCurveTo(size / 1.8, -2, 0, -2, 0, topCurveHeight);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = "rgba(255, 117, 151, 0.5)";
      ctx.lineWidth = 2.5;
      ctx.arc(-size*0.2, topCurveHeight*0.8, 4, 0, Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function drawDoodlePartyItem(ctx, x, y, type, color, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.strokeStyle = color;
      ctx.lineWidth = 4.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (type === 'hat') {
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        ctx.beginPath();
        ctx.moveTo(0, -28);
        ctx.lineTo(-18, 18);
        ctx.quadraticCurveTo(0, 24, 18, 18);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, -31, 5.5, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-9, -4); ctx.lineTo(9, -1);
        ctx.moveTo(-13, 10); ctx.lineTo(13, 12);
        ctx.stroke();

      } else if (type === 'balloon') {
        ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
        ctx.beginPath();
        ctx.ellipse(0, -6, 17, 22, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-3, 16); ctx.lineTo(3, 16); ctx.lineTo(0, 19); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, 19);
        ctx.bezierCurveTo(-7, 27, 7, 35, -2, 43);
        ctx.stroke();

      } else if (type === 'star') {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.quadraticCurveTo(0, 0, 20, 0);
        ctx.quadraticCurveTo(0, 0, 0, 20);
        ctx.quadraticCurveTo(0, 0, -20, 0);
        ctx.quadraticCurveTo(0, 0, 0, -20);
        ctx.fill();

      } else if (type === 'gift') {
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.beginPath();
        ctx.rect(-16, -4, 32, 24);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.rect(-20, -12, 40, 9);
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, -12); ctx.lineTo(0, 20);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-8, -16, 6, -0.2, Math.PI * 1.2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(8, -16, 6, Math.PI * 1.8, Math.PI * 3.2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawDoodleAnimal(ctx, x, y, type, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.strokeStyle = "#7c5335";
      ctx.lineWidth = 4.2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.fillStyle = "#ffffff";

      if (type === 'bear') {
        ctx.beginPath(); ctx.arc(-19, -16, 9.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(19, -16, 9.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 2, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#7c5335";
        ctx.beginPath(); ctx.arc(-8, 0, 2.8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, 0, 2.8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, 8, 4.5, 3.5, 0, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = "#ffb3c1";
        ctx.beginPath(); ctx.arc(-14, 8, 3.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(14, 8, 3.5, 0, Math.PI*2); ctx.fill();

      } else if (type === 'bunny') {
        ctx.beginPath(); ctx.ellipse(-9, -20, 6.5, 17, -0.15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(9, -20, 6.5, 17, 0.15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 4, 22, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#7c5335";
        ctx.beginPath(); ctx.arc(-7, 2, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(7, 2, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#ff85a2";
        ctx.beginPath(); ctx.arc(0, 8, 2.8, 0, Math.PI*2); ctx.fill();

      } else if (type === 'flower') {
        ctx.fillStyle = "#ffde59";
        for (let i = 0; i < 5; i++) {
          const a = (i * 72) * Math.PI / 180;
          ctx.beginPath();
          ctx.arc(Math.cos(a)*14, Math.sin(a)*14, 7.5, 0, Math.PI*2);
          ctx.fillStyle = "#ffffff";
          ctx.fill(); ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, Math.PI*2); ctx.fillStyle = "#ffc048"; ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }

    function drawDoodleSnow(ctx, x, y, size = 22, angle = 0, color = "#9ec9f0") {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.strokeStyle = color;
      ctx.lineWidth = 3.2;
      ctx.lineCap = "round";

      for (let i = 0; i < 6; i++) {
        const a = (i * 60) * Math.PI / 180;
        const ex = Math.cos(a) * size;
        const ey = Math.sin(a) * size;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(ex, ey);
        ctx.stroke();

        // 가지 두 개
        const bx = Math.cos(a) * size * 0.62;
        const by = Math.sin(a) * size * 0.62;
        const branch = size * 0.32;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(a + 0.7) * branch, by + Math.sin(a + 0.7) * branch);
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(a - 0.7) * branch, by + Math.sin(a - 0.7) * branch);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 학교 로고 그리기 (로고 파일이 없으면 아무것도 그리지 않음)
    function drawSchoolLogo(ctx, centerX) {
      if (!logoLoaded) return;
      const size = 54;
      const x = centerX - size / 2;
      const y = 1474;
      ctx.save();
      ctx.drawImage(schoolLogo, x, y, size, size);
      ctx.restore();
    }

    // ==========================================
    // 색연필 질감 도우미
    // ==========================================
    // 매번 똑같은 그림이 나오도록 '정해진 순서의 난수'를 사용
    function seededRandom(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    let bgLayer = null;
    let grainLayer = null;

    function getBgLayer() {
      if (!bgLayer) {
        bgLayer = document.createElement('canvas');
        bgLayer.width = CONFIG.canvasWidth;
        bgLayer.height = CONFIG.canvasHeight;
      }
      return bgLayer.getContext('2d');
    }

    // 종이 결처럼 군데군데 비는 '알갱이' (한 번만 만들어 재사용)
    function getGrain() {
      if (grainLayer) return grainLayer;
      grainLayer = document.createElement('canvas');
      grainLayer.width = CONFIG.canvasWidth;
      grainLayer.height = CONFIG.canvasHeight;
      const gctx = grainLayer.getContext('2d');
      const img = gctx.createImageData(grainLayer.width, grainLayer.height);
      const rnd = seededRandom(2026);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = rnd();
        img.data[i + 3] = v < 0.28 ? 210 : (v < 0.45 ? 90 : 0);
      }
      gctx.putImageData(img, 0, 0);
      return grainLayer;
    }

    // 그려 둔 배경 레이어에 알갱이 구멍을 내고, 살짝 어긋나게 두 번 겹쳐 '손으로 덧칠한' 느낌을 냄
    function compositePencilLayer() {
      const lctx = bgLayer.getContext('2d');
      lctx.globalCompositeOperation = 'destination-out';
      lctx.drawImage(getGrain(), 0, 0);
      lctx.globalCompositeOperation = 'source-over';

      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.drawImage(bgLayer, 0, 0);
      ctx.globalAlpha = 0.5;
      ctx.drawImage(bgLayer, 1.6, -1.2);
      ctx.restore();
    }

    // 살짝 떨리는 색연필 선 한 줄
    function pencilLine(c, x1, y1, x2, y2, color, width, rnd) {
      const jitter = 2.2;
      c.strokeStyle = color;
      c.lineCap = "round";
      for (let pass = 0; pass < 2; pass++) {
        c.globalAlpha = 0.5 + rnd() * 0.4;
        c.lineWidth = width * (0.7 + rnd() * 0.6);
        c.beginPath();
        c.moveTo(x1 + (rnd() - 0.5) * jitter * 2, y1 + (rnd() - 0.5) * jitter * 2);
        c.quadraticCurveTo(
          (x1 + x2) / 2 + (rnd() - 0.5) * jitter * 3,
          (y1 + y2) / 2 + (rnd() - 0.5) * jitter * 3,
          x2 + (rnd() - 0.5) * jitter * 2,
          y2 + (rnd() - 0.5) * jitter * 2
        );
        c.stroke();
      }
      c.globalAlpha = 1;
    }

    // '기본 프레임' 테마: 가장자리를 색연필로 칠한 단색 테두리
    function drawPencilFrame(c) {
      const rnd = seededRandom(11);
      const W = CONFIG.canvasWidth, H = CONFIG.canvasHeight;
      const color = "#74b0e3";

      // 가장자리 띠: 짧은 빗금을 촘촘히
      const bandIn = 12, bandOut = 44, step = 13;
      for (let x = 0; x < W; x += step) {
        pencilLine(c, x, bandIn, x + 9, bandOut, color, 3, rnd);
        pencilLine(c, x, H - bandOut, x + 9, H - bandIn, color, 3, rnd);
      }
      for (let y = 0; y < H; y += step) {
        pencilLine(c, bandIn, y, bandOut, y + 9, color, 3, rnd);
        pencilLine(c, W - bandOut, y, W - bandIn, y + 9, color, 3, rnd);
      }

      // 띠 안쪽 테두리선 (손으로 그은 듯 이어 그림)
      const inset = 56;
      const seg = 90;
      for (let x = inset; x < W - inset; x += seg) {
        const x2 = Math.min(x + seg + 4, W - inset);
        pencilLine(c, x, inset, x2, inset, color, 4, rnd);
        pencilLine(c, x, H - inset, x2, H - inset, color, 4, rnd);
      }
      for (let y = inset; y < H - inset; y += seg) {
        const y2 = Math.min(y + seg + 4, H - inset);
        pencilLine(c, inset, y, inset, y2, color, 4, rnd);
        pencilLine(c, W - inset, y, W - inset, y2, color, 4, rnd);
      }
    }

    // ==========================================
    // 캔버스 렌더링
    // ==========================================
    function drawPhotoStrip() {
      ctx.filter = "none";

      const symRowA = [85, 340, 600, 860, 1115];
      const symRowB = [210, 470, 730, 990];
      // 하단 문구 자리(y 1450 아래)에는 장식을 그리지 않아 글씨가 깨끗하게 보이게 함
      const yPositions = [80, 240, 390, 540, 690, 840, 960, 1110, 1260, 1410];

      // 배경 그림은 별도 레이어에 그린 뒤 '색연필 질감'을 입혀서 합침
      let paper = "#ffffff";
      const bgCtx = getBgLayer();
      bgCtx.clearRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
      {
        const ctx = bgCtx; // 이 블록 안의 그림은 모두 레이어로 그려짐
      if (currentTheme === 'frame') {
        paper = "#fffef9";
        drawPencilFrame(ctx);

      } else if (currentTheme === 'ribbon') {
        paper = "#ffffff";

        yPositions.forEach((y, rowIdx) => {
          const cols = (rowIdx % 2 === 0) ? symRowA : symRowB;
          cols.forEach((x, cIdx) => {
            const rot = ((x * 3 + y * 7) % 32) - 16;
            const scale = 0.62 + ((cIdx + rowIdx) % 3) * 0.03;
            drawDoodleRibbon(ctx, x, y, scale, rot, "#95c2eb");
          });
        });

      } else if (currentTheme === 'festival') {
        paper = "#fffef7";

        const items = ['hat', 'balloon', 'star'];
        const colors = ['#ff7675', '#fdcb6e', '#74b9ff', '#55efc4', '#a29bfe'];
        let idx = 0;

        yPositions.forEach((y, rowIdx) => {
          const cols = (rowIdx % 2 === 0) ? symRowA : symRowB;
          cols.forEach((x) => {
            const item = items[idx % items.length];
            const col = colors[idx % colors.length];
            const rot = ((x * 4 + y * 6) % 30) - 15;
            drawDoodlePartyItem(ctx, x, y, item, col, rot);
            idx++;
          });
        });

      } else if (currentTheme === 'heart') {
        paper = "#fff9fb";

        const heartColors = ['#ff7597', '#ff8fab', '#ffa2b8', '#ff5c8a'];
        let cIdx = 0;

        yPositions.forEach((y, rowIdx) => {
          const cols = (rowIdx % 2 === 0) ? symRowA : symRowB;
          cols.forEach((x) => {
            const rot = ((x * 5 + y * 3) % 36) - 18;
            const size = 36 + ((x * y) % 6);
            drawDoodleHeart(ctx, x, y, size, rot, heartColors[cIdx % heartColors.length]);
            cIdx++;
          });
        });

      } else if (currentTheme === 'animals') {
        paper = "#fcfaf7";

        const animals = ['bear', 'bunny', 'flower'];
        let aIdx = 0;

        yPositions.forEach((y, rowIdx) => {
          const cols = (rowIdx % 2 === 0) ? symRowA : symRowB;
          cols.forEach((x) => {
            const type = animals[aIdx % animals.length];
            const rot = ((x * 2 + y * 7) % 26) - 13;
            drawDoodleAnimal(ctx, x, y, type, rot);
            aIdx++;
          });
        });

      } else if (currentTheme === 'school') {
        paper = "#fffdf6";

        const schoolColors = ['#e8a33d', '#e57373', '#4dabf7', '#69db7c', '#b197fc'];
        let sIdx = 0;

        yPositions.forEach((y, rowIdx) => {
          const cols = (rowIdx % 2 === 0) ? symRowA : symRowB;
          cols.forEach((x) => {
            const rot = ((x * 3 + y * 5) % 30) - 15;
            const isGift = sIdx % 3 !== 1;
            if (isGift) {
              drawDoodlePartyItem(ctx, x, y, 'gift', schoolColors[sIdx % schoolColors.length], rot);
            } else {
              drawDoodlePartyItem(ctx, x, y, 'star', schoolColors[sIdx % schoolColors.length], rot);
            }
            sIdx++;
          });
        });

      } else if (currentTheme === 'winter') {
        paper = "#f7fbff";

        const snowColors = ['#9ec9f0', '#b8d8f5', '#8bb8e8'];
        let wIdx = 0;

        yPositions.forEach((y, rowIdx) => {
          const cols = (rowIdx % 2 === 0) ? symRowA : symRowB;
          cols.forEach((x) => {
            const size = 16 + ((x + y) % 14);
            const rot = ((x * 2 + y * 3) % 40) - 20;
            drawDoodleSnow(ctx, x, y, size, rot, snowColors[wIdx % snowColors.length]);
            wIdx++;
          });
        });
      }
      }
      ctx.fillStyle = paper;
      ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
      compositePencilLayer();

      // 사각형 4컷 사진 렌더링 (A·A / B·B 배치)
      const col2X = CONFIG.canvasWidth / 2 + CONFIG.marginLeft;
      const row2Y = CONFIG.marginTop + CONFIG.photoHeight + CONFIG.gapY;
      const positions = [
        { x: CONFIG.marginLeft, y: CONFIG.marginTop },
        { x: col2X,             y: CONFIG.marginTop },
        { x: CONFIG.marginLeft, y: row2Y },
        { x: col2X,             y: row2Y }
      ];

      const hasRealPhotos = capturedFrames.length === CONFIG.cutCount;

      // 윗줄 A·A / 아랫줄 B·B (가운데를 세로로 자르면 두 명이 같은 2컷을 나눠 가짐)
      const photoMap = [0, 0, 1, 1];

      positions.forEach((pos, index) => {
        ctx.save();
        ctx.shadowColor = "rgba(0, 0, 0, 0.12)";
        ctx.shadowBlur = 12;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 4;

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.rect(pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
        ctx.clip();

        if (hasRealPhotos) {
          ctx.filter = photoFilter();
          ctx.drawImage(capturedFrames[photoMap[index]], pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
        } else {
          ctx.fillStyle = "#f6f8fb";
          ctx.fillRect(pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
          ctx.fillStyle = "#94a3b8";
          ctx.font = `34px ${APP_FONT}`;
          ctx.textAlign = "center";
          ctx.fillText(`사진 ${photoMap[index] + 1} 들어가는 곳`, pos.x + CONFIG.photoWidth / 2, pos.y + CONFIG.photoHeight / 2);
        }
        ctx.restore();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 8;
        ctx.strokeRect(pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
      });

      // 하단 문구 렌더링
      const bannerTop = row2Y + CONFIG.photoHeight + 35;
      const bannerCenterY = bannerTop + ((CONFIG.canvasHeight - bannerTop) / 2) - 8;

      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";

      let mainTextColor = "#0284c7";
      let subTextColor  = "#38bdf8";

      if (currentTheme === 'festival') {
        mainTextColor = "#d9480f";
        subTextColor  = "#f76707";
      } else if (currentTheme === 'heart') {
        mainTextColor = "#d6336c";
        subTextColor  = "#f783ac";
      } else if (currentTheme === 'animals') {
        mainTextColor = "#5c3d2e";
        subTextColor  = "#8b5e3c";
      } else if (currentTheme === 'school') {
        mainTextColor = "#b25000";
        subTextColor  = "#e8a33d";
      } else if (currentTheme === 'winter') {
        mainTextColor = "#1864ab";
        subTextColor  = "#4dabf7";
      }

      // 사진을 가운데로 잘라 두 명이 나눠 가져도 되도록, 왼쪽·오른쪽 사진 아래에 똑같은 문구를 넣음
      const bannerCenters = [CONFIG.marginLeft + CONFIG.photoWidth / 2, col2X + CONFIG.photoWidth / 2];
      const maxTextWidth = CONFIG.photoWidth - 20;
      const fitText = (str, size, weight) => {
        ctx.font = `${weight} ${size}px ${APP_FONT}`;
        while (ctx.measureText(str).width > maxTextWidth && size > 24) {
          size -= 2;
          ctx.font = `${weight} ${size}px ${APP_FONT}`;
        }
      };
      bannerCenters.forEach((cx) => {
        ctx.fillStyle = mainTextColor;
        fitText("♥ 고척초등학교 ♥", 54, "bold");
        ctx.fillText("♥ 고척초등학교 ♥", cx, 1590);
        fitText("기버데이", 70, "bold");
        ctx.fillText("기버데이", cx, 1664);

        ctx.fillStyle = subTextColor;
        fitText("11월 19일", 46, "bold");
        ctx.fillText("11월 19일", cx, 1722);

        // 학교 로고 (logo.png 가 있으면 문구 위에 자동 삽입)
        drawSchoolLogo(ctx, cx);
      });

      ctx.filter = "none";
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 캔버스 → PNG 이미지
    // (로고 이미지 때문에 브라우저가 캔버스를 막는 경우, 로고를 빼고 한 번 더 시도해서 인쇄/저장이 끊기지 않게 함)
    function canvasToPNG(target) {
      try {
        return target.toDataURL('image/png');
      } catch (err) {
        logoLoaded = false;
        drawPhotoStrip();
        return target.toDataURL('image/png');
      }
    }

    btnStart.addEventListener('click', startCaptureSequence);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isRunning && modal.style.display !== 'flex' && loadingModal.style.display !== 'flex') {
        e.preventDefault();
        startCaptureSequence();
      }
    });

    document.getElementById('btnPrint').addEventListener('click', () => {
      printTarget.src = canvasToPNG(canvas);
      modal.style.display = 'none';
      loadingModal.style.display = 'flex';

      setTimeout(() => {
        window.print();
      }, 300);

      let remain = 12;
      const countLabel = document.getElementById('printCountdown');
      const timer = setInterval(() => {
        remain--;
        countLabel.innerText = `(약 ${remain}초 후 다음 촬영이 가능합니다)`;
        if (remain <= 0) {
          clearInterval(timer);
          loadingModal.style.display = 'none';
        }
      }, 1000);
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `고척초_기버데이_${Date.now()}.png`;
      link.href = canvasToPNG(canvas);
      link.click();
    });

    document.getElementById('btnClose').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    document.fonts.ready.then(() => {
      drawPhotoStrip();
    });

    initCamera();
  </script>
