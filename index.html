<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고척초등학교 기버데이 인생네컷</title>
  <!-- 둥근 손글씨 폰트(Jua) 불러오기 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 10px 0;
      background-color: #1a1a24;
      color: #ffffff;
      font-family: 'Jua', 'Malgun Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      font-size: 28px;
      margin-bottom: 10px;
      color: #ffde59;
      text-shadow: 0 3px 10px rgba(0,0,0,0.6);
      letter-spacing: 0.5px;
    }

    /* 상단 제어 바 */
    .top-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      background: #282838;
      padding: 10px 24px;
      border-radius: 40px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
    }

    .frame-chips {
      display: flex;
      gap: 8px;
    }

    .chip-btn {
      font-family: 'Jua', sans-serif;
      border: 2px solid transparent;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn.active {
      border-color: #ffde59;
      transform: scale(1.08);
      box-shadow: 0 0 12px rgba(255, 222, 89, 0.7);
    }

    .chip-ribbon { background: #e3f2fd; color: #1971c2; }
    .chip-pink   { background: #ffd4df; color: #b01e4a; }
    .chip-blue   { background: #d0ebff; color: #1864ab; }
    .chip-yellow { background: #ffec99; color: #d97706; }

    input[type=range] {
      width: 95px;
      accent-color: #ffde59;
      cursor: pointer;
    }

    /* 세로형 촬영 부스 */
    .booth-container {
      position: relative;
      width: 440px;
      height: 600px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,0.8);
      border: 5px solid #3c3c52;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 거울 모드 */
      transition: filter 0.1s;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .cut-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #38d9a9;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 20px;
      display: none;
    }

    .countdown-text {
      font-size: 150px;
      color: #ff2a5f;
      text-shadow: 0 0 30px rgba(0,0,0,0.9);
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.25s ease-out;
    }

    .countdown-text.show {
      opacity: 1;
      transform: scale(1.15);
    }

    .flash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
    }

    .btn-main {
      font-family: 'Jua', sans-serif;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 13px 45px;
      font-size: 23px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(3, 105, 161, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-main:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.7);
    }

    .btn-main:disabled {
      background: #555;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-sub {
      font-family: 'Jua', sans-serif;
      background: #475569;
      color: white;
      border: none;
      padding: 13px 24px;
      font-size: 18px;
      border-radius: 40px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-sub:hover {
      background: #64748b;
    }

    /* 결과 & 미리보기 모달 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.92);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    .modal-content {
      background: #252533;
      padding: 20px 26px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }

    #previewCanvas {
      width: 320px;
      height: 480px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-modal {
      font-family: 'Jua', sans-serif;
      border: none;
      padding: 10px 22px;
      font-size: 17px;
      border-radius: 25px;
      cursor: pointer;
      color: white;
    }

    .btn-print { background: #0284c7; }
    .btn-print:hover { background: #0369a1; }
    .btn-download { background: #475569; }
    .btn-download:hover { background: #334155; }
    .btn-close { background: #e11d48; }
    .btn-close:hover { background: #be123c; }

    /* 인쇄 대기 로딩 팝업 */
    .loading-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.94);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      flex-direction: column;
    }

    .loading-card {
      background: white;
      color: #111;
      padding: 40px 50px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.7);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .loading-card h2 {
      font-size: 34px;
      margin: 0 0 14px 0;
      color: #0284c7;
    }

    .loading-card p {
      font-size: 22px;
      color: #475569;
      margin: 6px 0;
    }

    .spinner {
      margin: 24px auto 14px;
      width: 60px;
      height: 60px;
      border: 6px solid #f1f5f9;
      border-top: 6px solid #0284c7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 4x6 인치 Borderless 인쇄 */
    @page {
      size: 4in 6in;
      margin: 0;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      .print-image, .print-image * {
        visibility: visible;
      }
      .print-image {
        position: absolute;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        display: block !important;
      }
    }

    .print-image {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
  </style>
</head>
<body>

  <header>★ 고척초등학교 기버데이 포토부스 ★</header>

  <div class="top-panel">
    <div class="option-group">
      <span>🎨 프레임 선택 (클릭 시 미리보기):</span>
      <div class="frame-chips">
        <button class="chip-btn chip-ribbon active" data-theme="ribbon">🎀 하늘리본</button>
        <button class="chip-btn chip-pink" data-theme="pink">🍓 딸기베어</button>
        <button class="chip-btn chip-blue" data-theme="blue">☁️ 몽실구름</button>
        <button class="chip-btn chip-yellow" data-theme="yellow">🧸 큐티베어</button>
      </div>
    </div>
    <div class="option-group">
      <span>☀️ 뽀샤시:</span>
      <input type="range" id="brightnessRange" min="100" max="150" value="118">
      <span id="brightnessVal">118%</span>
    </div>
  </div>

  <div class="booth-container">
    <video id="webcam" autoplay playsinline></video>
    <div class="overlay">
      <div id="cutBadge" class="cut-badge">CUT 1 / 4</div>
      <div id="countdown" class="countdown-text">5</div>
    </div>
    <div id="flash" class="flash-screen"></div>
  </div>

  <div class="controls">
    <button id="btnStart" class="btn-main">📸 촬영 시작 (Space)</button>
    <button id="btnPreview" class="btn-sub">🔍 프레임 미리보기</button>
  </div>

  <!-- 결과 & 프레임 미리보기 팝업 -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <div class="frame-chips">
        <button class="chip-btn chip-ribbon" data-theme="ribbon">🎀 하늘리본</button>
        <button class="chip-btn chip-pink" data-theme="pink">🍓 딸기베어</button>
        <button class="chip-btn chip-blue" data-theme="blue">☁️ 몽실구름</button>
        <button class="chip-btn chip-yellow" data-theme="yellow">🧸 큐티베어</button>
      </div>

      <canvas id="previewCanvas" width="1200" height="1800"></canvas>

      <div class="modal-buttons">
        <button id="btnPrint" class="btn-modal btn-print">🖨️ 바로 인쇄</button>
        <button id="btnDownload" class="btn-modal btn-download">💾 사진 저장</button>
        <button id="btnClose" class="btn-modal btn-close">닫기</button>
      </div>
    </div>
  </div>

  <!-- 인쇄 대기 팝업 -->
  <div id="loadingModal" class="loading-modal">
    <div class="loading-card">
      <div class="spinner"></div>
      <h2>🖨️ 예쁘게 인쇄하고 있어요!</h2>
      <p>포토프린터에서 사진이 나올 때까지</p>
      <p style="color: #0284c7; font-size: 26px;">잠시만 자리에서 기다려주세요! 💖</p>
      <p id="printCountdown" style="font-size: 16px; color: #94a3b8; margin-top: 15px;">(약 12초 후 다음 촬영이 가능합니다)</p>
    </div>
  </div>

  <img id="printTarget" class="print-image" />

  <script>
    // ★ 4번 요구사항 반영: 사진을 더 작게(460x620), 프레임 여백을 넓게(95px) 주어 리본이 사방에서 시원하게 보임!
    const CONFIG = {
      canvasWidth: 1200,
      canvasHeight: 1800,
      photoWidth: 460,       // 컴팩트한 사진 가로
      photoHeight: 620,      // 컴팩트한 사진 세로
      marginLeft: 95,        // 좌우 넓은 프레임 두께
      marginTop: 90,         // 상단 넓은 프레임 두께
      gapX: 90,              // 사진 사이 넓은 가로 간격
      gapY: 70,              // 사진 사이 세로 간격
      photoRadius: 24,       // 사진 모서리 둥글게
      countdownSec: 5        // 5초 타이머
    };

    let currentTheme = 'ribbon';
    let brightnessMultiplier = 1.18;

    const video = document.getElementById('webcam');
    const btnStart = document.getElementById('btnStart');
    const btnPreview = document.getElementById('btnPreview');
    const cutBadge = document.getElementById('cutBadge');
    const countdownEl = document.getElementById('countdown');
    const flash = document.getElementById('flash');
    const modal = document.getElementById('resultModal');
    const loadingModal = document.getElementById('loadingModal');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const printTarget = document.getElementById('printTarget');
    const brightnessRange = document.getElementById('brightnessRange');
    const brightnessVal = document.getElementById('brightnessVal');

    let audioCtx = null;
    let capturedFrames = [];
    let isRunning = false;

    // 밝기 슬라이더
    function updateVideoFilter() {
      video.style.filter = `brightness(${brightnessMultiplier}) contrast(1.05) saturate(1.05)`;
    }
    brightnessRange.addEventListener('input', (e) => {
      const val = e.target.value;
      brightnessMultiplier = val / 100;
      brightnessVal.innerText = `${val}%`;
      updateVideoFilter();
      drawPhotoStrip();
    });

    // ★ 5번 요구사항 반영: 프레임 버튼 클릭 시 즉시 미리보기 팝업 열기 & 변경
    document.querySelectorAll('.frame-chips').forEach(container => {
      container.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip-btn');
        if (!btn) return;
        currentTheme = btn.dataset.theme;

        document.querySelectorAll('.chip-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.theme === currentTheme);
        });

        drawPhotoStrip();
        modal.style.display = 'flex'; // 프레임 누르면 바로 모달로 실물 미리보기!
      });
    });

    btnPreview.addEventListener('click', () => {
      drawPhotoStrip();
      modal.style.display = 'flex';
    });

    function playBeep(freq, duration) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        updateVideoFilter();
      } catch (err) {
        alert("카메라 연결 실패: " + err.message);
      }
    }

    // 5초 타이머 촬영 루프
    async function startCaptureSequence() {
      if (isRunning) return;
      isRunning = true;
      btnStart.disabled = true;
      capturedFrames = [];
      cutBadge.style.display = 'block';

      for (let cut = 1; cut <= 4; cut++) {
        cutBadge.innerText = `CUT ${cut} / 4`;
        
        for (let sec = CONFIG.countdownSec; sec > 0; sec--) {
          countdownEl.innerText = sec;
          countdownEl.classList.add('show');
          playBeep(sec === 1 ? 950 : 800, 0.15);
          await wait(1000);
          countdownEl.classList.remove('show');
        }

        playBeep(1800, 0.35);
        triggerFlash();
        captureCurrentFrame();
        await wait(600);
      }

      cutBadge.style.display = 'none';
      drawPhotoStrip();
      modal.style.display = 'flex';
      isRunning = false;
      btnStart.disabled = false;
    }

    function captureCurrentFrame() {
      const tempCanvas = document.createElement('canvas');
      const vW = video.videoWidth || 1280;
      const vH = video.videoHeight || 720;

      const targetRatio = CONFIG.photoWidth / CONFIG.photoHeight;
      let sW = vH * targetRatio;
      let sH = vH;
      let sX = (vW - sW) / 2;
      let sY = 0;

      tempCanvas.width = CONFIG.photoWidth;
      tempCanvas.height = CONFIG.photoHeight;
      const tCtx = tempCanvas.getContext('2d');

      tCtx.translate(CONFIG.photoWidth, 0);
      tCtx.scale(-1, 1);
      tCtx.drawImage(video, sX, sY, sW, sH, 0, 0, CONFIG.photoWidth, CONFIG.photoHeight);

      capturedFrames.push(tempCanvas);
    }

    function triggerFlash() {
      flash.style.opacity = '0.95';
      flash.style.transition = 'none';
      setTimeout(() => {
        flash.style.transition = 'opacity 0.4s ease-out';
        flash.style.opacity = '0';
      }, 50);
    }

    // ★ 2번 요구사항 반영: 첨부해주신 리본 모양을 그대로 그리는 전용 벡터 함수
    function drawHandDrawnRibbon(ctx, x, y, scale = 1, angle = 0, color = "#9ec5ea") {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.scale(scale, scale);
      ctx.strokeStyle = color;
      ctx.lineWidth = 5.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      // 왼쪽 루프 (리본 날개)
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-20, -32, -55, -18, -48, 8);
      ctx.bezierCurveTo(-42, 26, -18, 14, 0, 0);
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      ctx.fill();
      ctx.stroke();

      // 오른쪽 루프 (리본 날개)
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(20, -32, 55, -18, 48, 8);
      ctx.bezierCurveTo(42, 26, 18, 14, 0, 0);
      ctx.fill();
      ctx.stroke();

      // 왼쪽 리본 꼬리 (절개선 포함)
      ctx.beginPath();
      ctx.moveTo(-4, 6);
      ctx.bezierCurveTo(-14, 25, -24, 45, -34, 62);
      ctx.lineTo(-24, 52);
      ctx.lineTo(-17, 63);
      ctx.bezierCurveTo(-10, 44, -3, 25, 0, 6);
      ctx.stroke();

      // 오른쪽 리본 꼬리 (절개선 포함)
      ctx.beginPath();
      ctx.moveTo(4, 6);
      ctx.bezierCurveTo(14, 25, 24, 45, 34, 62);
      ctx.lineTo(24, 52);
      ctx.lineTo(17, 63);
      ctx.bezierCurveTo(10, 44, 3, 25, 0, 6);
      ctx.stroke();

      // 가운데 매듭 알
      ctx.beginPath();
      ctx.arc(0, 1, 8.5, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    // ★ 캔버스 렌더링 (리본 프레임 -> 사진 4장 -> 둥근 서체 멘트)
    function drawPhotoStrip() {
      ctx.filter = "none";

      // 1. 배경 프레임 그리기
      if (currentTheme === 'ribbon') {
        // 보내주신 이미지와 똑같은 깨끗한 화이트 배경 + 지그재그 교차 하늘색 리본 배열
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        // 보내주신 사진의 리본 위치 그대로 촘촘하게 배치 (외곽과 사진 사이 간격에 쏙쏙 보이도록)
        const ribbonGrid = [
          // 1열 (상단 여백)
          {x: 230, y: 55,  s: 0.95, a: -6},
          {x: 600, y: 50,  s: 1.0,  a: 5},
          {x: 970, y: 55,  s: 0.95, a: -4},

          // 2열 (사진 윗부분 좌/우/중간)
          {x: 50,  y: 220, s: 1.0,  a: 8},
          {x: 600, y: 280, s: 0.95, a: -5},
          {x: 1150, y: 220, s: 1.0, a: -7},

          // 3열 (사진 중간 좌/우)
          {x: 45,  y: 500, s: 0.95, a: -8},
          {x: 600, y: 530, s: 1.0,  a: 4},
          {x: 1155, y: 500, s: 0.95, a: 7},

          // 4열 (1행과 2행 사진 사이 정중앙 가로 간격!)
          {x: 230, y: 745, s: 1.0,  a: 6},
          {x: 600, y: 745, s: 1.05, a: -4},
          {x: 970, y: 745, s: 1.0,  a: 5},

          // 5열 (아래 사진 좌/우/중간)
          {x: 50,  y: 980, s: 0.95, a: -6},
          {x: 600, y: 1020, s: 1.0, a: 5},
          {x: 1150, y: 980, s: 0.95, a: 8},

          {x: 45,  y: 1250, s: 1.0, a: 7},
          {x: 600, y: 1260, s: 0.95, a: -5},
          {x: 1155, y: 1250, s: 1.0, a: -8},

          // 6열 (하단 멘트 영역 위/아래)
          {x: 160, y: 1440, s: 1.05, a: -5},
          {x: 600, y: 1440, s: 1.0,  a: 6},
          {x: 1040, y: 1440, s: 1.05, a: 4},

          {x: 140, y: 1720, s: 1.0,  a: 8},
          {x: 600, y: 1730, s: 1.05, a: -4},
          {x: 1060, y: 1720, s: 1.0, a: -6}
        ];

        ribbonGrid.forEach(r => drawHandDrawnRibbon(ctx, r.x, r.y, r.s, r.a, "#98c5eb"));

      } else if (currentTheme === 'pink') {
        drawPatternFrame("#fff0f3", "rgba(255, 175, 195, 0.45)", "🍓", "#ff8fa3");
      } else if (currentTheme === 'blue') {
        drawPatternFrame("#eef7ff", "rgba(186, 222, 255, 0.5)", "☁️", "#74c0fc");
      } else if (currentTheme === 'yellow') {
        drawPatternFrame("#fffbe6", "rgba(255, 236, 153, 0.6)", "🧸", "#ffd43b");
      }

      // 2. 4컷 사진 위치 계산 (작아진 크기와 넓어진 프레임 여백)
      const col2X = CONFIG.marginLeft + CONFIG.photoWidth + CONFIG.gapX;
      const row2Y = CONFIG.marginTop + CONFIG.photoHeight + CONFIG.gapY;
      const positions = [
        { x: CONFIG.marginLeft, y: CONFIG.marginTop },
        { x: col2X,             y: CONFIG.marginTop },
        { x: CONFIG.marginLeft, y: row2Y },
        { x: col2X,             y: row2Y }
      ];

      // 사진이 없을 때(프레임 미리보기 상태) 보여줄 샘플 더미 카드
      const hasRealPhotos = capturedFrames.length === 4;

      positions.forEach((pos, index) => {
        ctx.save();

        // 둥근 모서리 클리핑
        drawRoundedRectPath(ctx, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight, CONFIG.photoRadius);
        ctx.clip();

        if (hasRealPhotos) {
          ctx.filter = `brightness(${brightnessMultiplier}) contrast(1.06) saturate(1.05)`;
          ctx.drawImage(capturedFrames[index], pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
        } else {
          // 미리보기용 예쁜 플레이스홀더 화면
          ctx.fillStyle = (currentTheme === 'ribbon') ? "#f0f8ff" : "#f8f9fa";
          ctx.fillRect(pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
          ctx.fillStyle = "#94a3b8";
          ctx.font = "34px 'Jua', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(`사진 ${index + 1} 들어가는 곳`, pos.x + CONFIG.photoWidth / 2, pos.y + CONFIG.photoHeight / 2);
        }
        ctx.restore();

        // 사진 테두리 (리본 프레임과 자연스럽게 어울리는 산뜻한 외곽선)
        ctx.strokeStyle = (currentTheme === 'ribbon') ? "#bce0fd" : "#ffffff";
        ctx.lineWidth = 7;
        drawRoundedRectStroke(ctx, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight, CONFIG.photoRadius);
      });

      // 3. ★ 3번 요구사항 반영: 둥근 글씨체(Jua)와 가운데 맞춤 하단 멘트
      const bannerTop = row2Y + CONFIG.photoHeight + 40;
      const bannerCenterY = bannerTop + ((CONFIG.canvasHeight - bannerTop) / 2) - 10;

      // 멘트 배경 화이트 카드
      ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
      drawRoundedRectPath(ctx, CONFIG.marginLeft + 15, bannerTop - 10, CONFIG.canvasWidth - (CONFIG.marginLeft * 2) - 30, (CONFIG.canvasHeight - bannerTop) - 30, 24);
      ctx.fill();
      ctx.strokeStyle = (currentTheme === 'ribbon') ? "#bce0fd" : "#ffd4df";
      ctx.lineWidth = 4;
      drawRoundedRectStroke(ctx, CONFIG.marginLeft + 15, bannerTop - 10, CONFIG.canvasWidth - (CONFIG.marginLeft * 2) - 30, (CONFIG.canvasHeight - bannerTop) - 30, 24);

      ctx.textAlign = "center";

      // 윗줄: ♥2026 고척초등학교 기버데이♥ (동글동글 귀여운 폰트)
      ctx.font = "52px 'Jua', sans-serif";
      ctx.fillStyle = (currentTheme === 'pink') ? "#d90429" : (currentTheme === 'yellow') ? "#d97706" : (currentTheme === 'blue') ? "#1864ab" : "#0284c7";
      ctx.fillText("♥2026 고척초등학교 기버데이♥", CONFIG.canvasWidth / 2, bannerCenterY - 18);

      // 아랫줄: 2026.11.19
      ctx.font = "38px 'Jua', sans-serif";
      ctx.fillStyle = (currentTheme === 'pink') ? "#ff4d6d" : (currentTheme === 'yellow') ? "#f59e0b" : (currentTheme === 'blue') ? "#4dabf7" : "#38bdf8";
      ctx.fillText("2026.11.19", CONFIG.canvasWidth / 2, bannerCenterY + 44);
    }

    function drawPatternFrame(bg, dotColor, emoji, strokeColor) {
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
      ctx.fillStyle = dotColor;
      for (let x = 20; x < CONFIG.canvasWidth; x += 55) {
        for (let y = 20; y < CONFIG.canvasHeight; y += 55) {
          ctx.beginPath();
          ctx.arc(x, y, 4.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.font = "48px sans-serif";
      ctx.fillText(emoji, 60, 60);
      ctx.fillText(emoji, CONFIG.canvasWidth - 60, 60);
      ctx.fillText(emoji, 60, CONFIG.canvasHeight - 60);
      ctx.fillText(emoji, CONFIG.canvasWidth - 60, CONFIG.canvasHeight - 60);
    }

    function drawRoundedRectPath(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawRoundedRectStroke(ctx, x, y, width, height, radius) {
      drawRoundedRectPath(ctx, x, y, width, height, radius);
      ctx.stroke();
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    btnStart.addEventListener('click', startCaptureSequence);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isRunning && modal.style.display !== 'flex' && loadingModal.style.display !== 'flex') {
        e.preventDefault();
        startCaptureSequence();
      }
    });

    document.getElementById('btnPrint').addEventListener('click', () => {
      printTarget.src = canvas.toDataURL('image/png');
      modal.style.display = 'none';
      loadingModal.style.display = 'flex';

      setTimeout(() => {
        window.print();
      }, 300);

      let remain = 12;
      const countLabel = document.getElementById('printCountdown');
      const timer = setInterval(() => {
        remain--;
        countLabel.innerText = `(약 ${remain}초 후 다음 촬영이 가능합니다)`;
        if (remain <= 0) {
          clearInterval(timer);
          loadingModal.style.display = 'none';
        }
      }, 1000);
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `고척초_기버데이_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    document.getElementById('btnClose').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    // 구글 폰트(Jua) 로딩 완료 후 초기 렌더링
    document.fonts.ready.then(() => {
      drawPhotoStrip();
    });

    initCamera();
  </script>
</body>
