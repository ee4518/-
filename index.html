<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고척초등학교 기버데이 인생네컷</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 12px 0;
      background-color: #1e1e28;
      color: #ffffff;
      font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 10px;
      color: #ffdd59;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      letter-spacing: -0.5px;
    }

    /* 상단 프레임 선택 & 밝기 패널 */
    .top-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      background: #2b2b3a;
      padding: 10px 24px;
      border-radius: 40px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .frame-chips {
      display: flex;
      gap: 8px;
    }

    .chip-btn {
      border: 2px solid transparent;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn.active {
      border-color: #ffdd59;
      transform: scale(1.08);
      box-shadow: 0 0 12px rgba(255, 221, 89, 0.7);
    }

    .chip-bear   { background: #fcefdc; color: #8d5b28; }
    .chip-ribbon { background: #e3f2fd; color: #1976d2; }
    .chip-awning { background: #ffe0e6; color: #c2185b; }
    .chip-rabbit { background: #fff0f5; color: #d81b60; }

    input[type=range] {
      width: 95px;
      accent-color: #ffdd59;
      cursor: pointer;
    }

    /* 4x6 세로형 비율 카메라 뷰어 */
    .booth-container {
      position: relative;
      width: 440px;
      height: 560px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      border: 5px solid #3e3e52;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      transition: filter 0.1s;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .cut-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #38d9a9;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 900;
      display: none;
    }

    .countdown-text {
      font-size: 150px;
      font-weight: 900;
      color: #ff2a5f;
      text-shadow: 0 0 30px rgba(0,0,0,0.9);
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.25s ease-out;
    }

    .countdown-text.show {
      opacity: 1;
      transform: scale(1.15);
    }

    .flash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    .controls {
      margin-top: 15px;
    }

    .btn-main {
      background: linear-gradient(135deg, #ff4081, #f50057);
      color: white;
      border: none;
      padding: 14px 45px;
      font-size: 21px;
      font-weight: 900;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(245, 0, 87, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-main:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(245, 0, 87, 0.65);
    }

    .btn-main:disabled {
      background: #555;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 결과 미리보기 모달 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    .modal-content {
      background: #262635;
      padding: 18px 24px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }

    #previewCanvas {
      width: 320px;
      height: 480px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-modal {
      border: none;
      padding: 11px 22px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      color: white;
    }

    .btn-print { background: #2563eb; }
    .btn-print:hover { background: #1d4ed8; }
    .btn-download { background: #475569; }
    .btn-download:hover { background: #334155; }
    .btn-close { background: #e11d48; }
    .btn-close:hover { background: #be123c; }

    /* 인쇄 대기 중 로딩 안내 */
    .loading-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.93);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      flex-direction: column;
    }

    .loading-card {
      background: white;
      color: #111;
      padding: 40px 50px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.7);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .loading-card h2 {
      font-size: 32px;
      margin: 0 0 14px 0;
      color: #e11d48;
    }

    .loading-card p {
      font-size: 20px;
      color: #475569;
      margin: 6px 0;
      font-weight: 700;
    }

    .spinner {
      margin: 24px auto 14px;
      width: 60px;
      height: 60px;
      border: 6px solid #f1f5f9;
      border-top: 6px solid #e11d48;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @page {
      size: 4in 6in;
      margin: 0;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      .print-image, .print-image * {
        visibility: visible;
      }
      .print-image {
        position: absolute;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        display: block !important;
      }
    }

    .print-image {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
  </style>
</head>
<body>

  <header>★ 고척초등학교 기버데이 포토부스 ★</header>

  <!-- 상단 제어 바 -->
  <div class="top-panel">
    <div class="option-group">
      <span>🎨 일러스트 테마:</span>
      <div class="frame-chips">
        <button class="chip-btn chip-bear active" data-theme="bear">🧸 파티베어</button>
        <button class="chip-btn chip-ribbon" data-theme="ribbon">🎀 빅리본</button>
        <button class="chip-btn chip-awning" data-theme="awning">🎪 마켓어닝</button>
        <button class="chip-btn chip-rabbit" data-theme="rabbit">🐰 래빗체리</button>
      </div>
    </div>
    <div class="option-group">
      <span>☀️ 뽀샤시:</span>
      <input type="range" id="brightnessRange" min="100" max="150" value="118">
      <span id="brightnessVal">118%</span>
    </div>
  </div>

  <!-- 세로형 촬영 부스 -->
  <div class="booth-container">
    <video id="webcam" autoplay playsinline></video>
    <div class="overlay">
      <div id="cutBadge" class="cut-badge">CUT 1 / 4</div>
      <div id="countdown" class="countdown-text">5</div>
    </div>
    <div id="flash" class="flash-screen"></div>
  </div>

  <div class="controls">
    <button id="btnStart" class="btn-main">📸 촬영 시작 (Space)</button>
  </div>

  <!-- 결과 미리보기 팝업 -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <div class="frame-chips">
        <button class="chip-btn chip-bear" data-theme="bear">🧸 파티베어</button>
        <button class="chip-btn chip-ribbon" data-theme="ribbon">🎀 빅리본</button>
        <button class="chip-btn chip-awning" data-theme="awning">🎪 마켓어닝</button>
        <button class="chip-btn chip-rabbit" data-theme="rabbit">🐰 래빗체리</button>
      </div>

      <canvas id="previewCanvas" width="1200" height="1800"></canvas>

      <div class="modal-buttons">
        <button id="btnPrint" class="btn-modal btn-print">🖨️ 바로 인쇄</button>
        <button id="btnDownload" class="btn-modal btn-download">💾 사진 저장</button>
        <button id="btnClose" class="btn-modal btn-close">다시 찍기</button>
      </div>
    </div>
  </div>

  <!-- 인쇄 대기 로딩 모달 -->
  <div id="loadingModal" class="loading-modal">
    <div class="loading-card">
      <div class="spinner"></div>
      <h2>🖨️ 예쁘게 인쇄하고 있어요!</h2>
      <p>포토프린터에서 사진이 나올 때까지</p>
      <p style="color: #e11d48; font-weight: 800; font-size: 24px;">잠시만 자리에서 기다려주세요! 💖</p>
      <p id="printCountdown" style="font-size: 16px; color: #94a3b8; margin-top: 15px;">(약 12초 후 다음 촬영이 가능합니다)</p>
    </div>
  </div>

  <img id="printTarget" class="print-image" />

  <script>
    // 4x6 (1200 x 1800) 꽉 찬 규격 레이아웃
    const CONFIG = {
      canvasWidth: 1200,
      canvasHeight: 1800,
      photoWidth: 550,
      photoHeight: 700,
      marginLeft: 40,
      marginTop: 140, // 상단 일러스트 장식을 위한 적정 여백
      gapX: 20,
      gapY: 30,
      photoRadius: 22,
      countdownSec: 5
    };

    let currentTheme = 'bear';
    let brightnessMultiplier = 1.18;

    const video = document.getElementById('webcam');
    const btnStart = document.getElementById('btnStart');
    const cutBadge = document.getElementById('cutBadge');
    const countdownEl = document.getElementById('countdown');
    const flash = document.getElementById('flash');
    const modal = document.getElementById('resultModal');
    const loadingModal = document.getElementById('loadingModal');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const printTarget = document.getElementById('printTarget');
    const brightnessRange = document.getElementById('brightnessRange');
    const brightnessVal = document.getElementById('brightnessVal');

    let audioCtx = null;
    let capturedFrames = [];
    let isRunning = false;

    // 밝기 슬라이더
    function updateVideoFilter() {
      video.style.filter = `brightness(${brightnessMultiplier}) contrast(1.05) saturate(1.05)`;
    }

    brightnessRange.addEventListener('input', (e) => {
      const val = e.target.value;
      brightnessMultiplier = val / 100;
      brightnessVal.innerText = `${val}%`;
      updateVideoFilter();
      if (capturedFrames.length === 4) {
        drawPhotoStrip();
      }
    });

    // 테마 전환 버튼
    document.querySelectorAll('.frame-chips').forEach(container => {
      container.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip-btn');
        if (!btn) return;
        currentTheme = btn.dataset.theme;

        document.querySelectorAll('.chip-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.theme === currentTheme);
        });

        if (capturedFrames.length === 4) {
          drawPhotoStrip();
        }
      });
    });

    function playBeep(freq, duration) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        updateVideoFilter();
      } catch (err) {
        alert("카메라 연결 실패: " + err.message);
      }
    }

    // 5초 타이머 촬영
    async function startCaptureSequence() {
      if (isRunning) return;
      isRunning = true;
      btnStart.disabled = true;
      capturedFrames = [];
      cutBadge.style.display = 'block';

      for (let cut = 1; cut <= 4; cut++) {
        cutBadge.innerText = `CUT ${cut} / 4`;
        
        for (let sec = CONFIG.countdownSec; sec > 0; sec--) {
          countdownEl.innerText = sec;
          countdownEl.classList.add('show');
          playBeep(sec === 1 ? 950 : 800, 0.15);
          await wait(1000);
          countdownEl.classList.remove('show');
        }

        playBeep(1800, 0.35);
        triggerFlash();
        captureCurrentFrame();
        await wait(600);
      }

      cutBadge.style.display = 'none';
      drawPhotoStrip();
      modal.style.display = 'flex';
      isRunning = false;
      btnStart.disabled = false;
    }

    function captureCurrentFrame() {
      const tempCanvas = document.createElement('canvas');
      const vW = video.videoWidth || 1280;
      const vH = video.videoHeight || 720;

      const targetRatio = CONFIG.photoWidth / CONFIG.photoHeight;
      let sW = vH * targetRatio;
      let sH = vH;
      let sX = (vW - sW) / 2;
      let sY = 0;

      tempCanvas.width = CONFIG.photoWidth;
      tempCanvas.height = CONFIG.photoHeight;
      const tCtx = tempCanvas.getContext('2d');

      tCtx.translate(CONFIG.photoWidth, 0);
      tCtx.scale(-1, 1);
      tCtx.drawImage(video, sX, sY, sW, sH, 0, 0, CONFIG.photoWidth, CONFIG.photoHeight);

      capturedFrames.push(tempCanvas);
    }

    function triggerFlash() {
      flash.style.opacity = '0.95';
      flash.style.transition = 'none';
      setTimeout(() => {
        flash.style.transition = 'opacity 0.4s ease-out';
        flash.style.opacity = '0';
      }, 50);
    }

    /* ==============================================================
       ★ 일러스트 벡터 그리기 엔진 (도안 맞춤형 구현) ★
    ============================================================== */

    // 1. 꼬깔모자 쓴 곰돌이 캐릭터 그리기
    function drawPartyBear(ctx, x, y, size, faceColor, innerColor, hatColor, pomColor) {
      ctx.save();
      ctx.translate(x, y);

      // 귀 2개
      ctx.fillStyle = faceColor;
      ctx.beginPath(); ctx.arc(-size * 0.45, -size * 0.35, size * 0.25, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(size * 0.45, -size * 0.35, size * 0.25, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = innerColor;
      ctx.beginPath(); ctx.arc(-size * 0.45, -size * 0.35, size * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(size * 0.45, -size * 0.35, size * 0.13, 0, Math.PI * 2); ctx.fill();

      // 꼬깔모자
      ctx.fillStyle = hatColor;
      ctx.beginPath();
      ctx.moveTo(-size * 0.3, -size * 0.25);
      ctx.lineTo(0, -size * 0.95);
      ctx.lineTo(size * 0.3, -size * 0.25);
      ctx.closePath();
      ctx.fill();

      // 꼬깔모자 줄무늬
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-size * 0.15, -size * 0.45); ctx.lineTo(size * 0.15, -size * 0.45);
      ctx.moveTo(-size * 0.22, -size * 0.32); ctx.lineTo(size * 0.22, -size * 0.32);
      ctx.stroke();

      // 꼬깔 방울
      ctx.fillStyle = pomColor;
      ctx.beginPath(); ctx.arc(0, -size * 0.95, size * 0.12, 0, Math.PI * 2); ctx.fill();

      // 곰 얼굴
      ctx.fillStyle = faceColor;
      ctx.beginPath(); ctx.arc(0, 0, size * 0.55, 0, Math.PI * 2); ctx.fill();

      // 주둥이 영역
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.ellipse(0, size * 0.12, size * 0.22, size * 0.16, 0, 0, Math.PI * 2); ctx.fill();

      // 코 & 입
      ctx.fillStyle = "#2b2b2b";
      ctx.beginPath(); ctx.arc(0, size * 0.08, size * 0.06, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#2b2b2b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, size * 0.08); ctx.lineTo(0, size * 0.17);
      ctx.moveTo(-size * 0.08, size * 0.17); ctx.quadraticCurveTo(0, size * 0.23, size * 0.08, size * 0.17);
      ctx.stroke();

      // 눈
      ctx.fillStyle = "#2b2b2b";
      ctx.beginPath(); ctx.arc(-size * 0.18, -size * 0.05, size * 0.05, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(size * 0.18, -size * 0.05, size * 0.05, 0, Math.PI * 2); ctx.fill();

      // 뽈터치
      ctx.fillStyle = "rgba(255, 107, 129, 0.45)";
      ctx.beginPath(); ctx.arc(-size * 0.32, size * 0.12, size * 0.09, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(size * 0.32, size * 0.12, size * 0.09, 0, Math.PI * 2); ctx.fill();

      ctx.restore();
    }

    // 2. 도안 3,4번 빅 선물 리본 그리기
    function drawBigRibbon(ctx, x, y, width, height, mainColor, shadeColor) {
      ctx.save();
      ctx.translate(x, y);

      // 왼쪽 날개
      ctx.fillStyle = mainColor;
      ctx.beginPath();
      ctx.moveTo(-width * 0.1, 0);
      ctx.bezierCurveTo(-width * 0.4, -height * 0.7, -width * 0.6, -height * 0.2, -width * 0.45, height * 0.3);
      ctx.bezierCurveTo(-width * 0.3, height * 0.4, -width * 0.2, 0, -width * 0.1, 0);
      ctx.fill();

      // 오른쪽 날개
      ctx.beginPath();
      ctx.moveTo(width * 0.1, 0);
      ctx.bezierCurveTo(width * 0.4, -height * 0.7, width * 0.6, -height * 0.2, width * 0.45, height * 0.3);
      ctx.bezierCurveTo(width * 0.3, height * 0.4, width * 0.2, 0, width * 0.1, 0);
      ctx.fill();

      // 리본 주름 음영
      ctx.strokeStyle = shadeColor;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-width * 0.3, -height * 0.1); ctx.quadraticCurveTo(-width * 0.2, 0, -width * 0.1, 0);
      ctx.moveTo(width * 0.3, -height * 0.1); ctx.quadraticCurveTo(width * 0.2, 0, width * 0.1, 0);
      ctx.stroke();

      // 가운데 매듭
      ctx.fillStyle = shadeColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, width * 0.12, height * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 3. 도안 5,6번 마켓 어닝 지붕 그리기
    function drawMarketAwning(ctx, y, height, color1, color2) {
      const scallopCount = 14;
      const step = CONFIG.canvasWidth / scallopCount;

      ctx.save();
      // 지붕 띠
      ctx.fillStyle = color1;
      ctx.fillRect(0, 0, CONFIG.canvasWidth, y + height);

      // 스트라이프 & 물결 밑단
      for (let i = 0; i < scallopCount; i++) {
        ctx.fillStyle = (i % 2 === 0) ? color1 : color2;
        ctx.fillRect(i * step, 0, step, y + height);

        // 아래 둥근 레이스 물결
        ctx.beginPath();
        ctx.arc(i * step + step / 2, y + height, step / 2, 0, Math.PI);
        ctx.fill();
      }
      ctx.restore();
    }

    // 4. 사진 구분선 미니 리본 타이 (도안에 나온 요소)
    function drawMiniBow(ctx, x, y, size, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = color;

      // 왼쪽 날개
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-size, -size * 0.55);
      ctx.lineTo(-size, size * 0.55);
      ctx.closePath();
      ctx.fill();

      // 오른쪽 날개
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(size, -size * 0.55);
      ctx.lineTo(size, size * 0.55);
      ctx.closePath();
      ctx.fill();

      // 매듭
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 5. 데이지 꽃 & 잎사귀
    function drawDaisyFlower(ctx, x, y, size, petalColor, centerColor) {
      ctx.save();
      ctx.translate(x, y);

      // 초록 잎사귀
      ctx.fillStyle = "#81c784";
      ctx.beginPath();
      ctx.ellipse(size * 0.7, size * 0.4, size * 0.5, size * 0.25, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();

      // 5개 꽃잎
      ctx.fillStyle = petalColor;
      for (let i = 0; i < 5; i++) {
        const angle = (i * Math.PI * 2) / 5;
        const px = Math.cos(angle) * (size * 0.5);
        const py = Math.sin(angle) * (size * 0.5);
        ctx.beginPath();
        ctx.arc(px, py, size * 0.38, 0, Math.PI * 2);
        ctx.fill();
      }

      // 꽃술
      ctx.fillStyle = centerColor;
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 6. 사탕 데코
    function drawCandyItem(ctx, x, y, size, color1, color2) {
      ctx.save();
      ctx.translate(x, y);

      // 사탕 포장 양끝 날개
      ctx.fillStyle = color2;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-size * 1.3, -size * 0.4); ctx.lineTo(-size * 1.3, size * 0.4); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(size * 1.3, -size * 0.4); ctx.lineTo(size * 1.3, size * 0.4); ctx.closePath(); ctx.fill();

      // 가운데 알사탕
      ctx.fillStyle = color1;
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.65, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    /* ==============================================================
       ★ 메인 합성 루틴 (요청 문구 및 도안 스타일 완성) ★
    ============================================================== */
    function drawPhotoStrip() {
      ctx.filter = "none";

      const col2X = CONFIG.marginLeft + CONFIG.photoWidth + CONFIG.gapX;
      const row2Y = CONFIG.marginTop + CONFIG.photoHeight + CONFIG.gapY;
      const positions = [
        { x: CONFIG.marginLeft, y: CONFIG.marginTop },
        { x: col2X,             y: CONFIG.marginTop },
        { x: CONFIG.marginLeft, y: row2Y },
        { x: col2X,             y: row2Y }
      ];

      // --- 1. 테마별 배경 및 상단 일러스트 렌더링 ---
      if (currentTheme === 'bear') {
        // [테마 1] 🧸 파티베어 (도안 1,2번)
        ctx.fillStyle = "#faf3e8";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        // 상단 곰돌이 2마리 배치
        drawPartyBear(ctx, CONFIG.marginLeft + (CONFIG.photoWidth / 2), CONFIG.marginTop - 20, 115, "#c89d7c", "#f3d1b9", "#5bc0be", "#ff6b81");
        drawPartyBear(ctx, col2X + (CONFIG.photoWidth / 2), CONFIG.marginTop - 20, 115, "#e5b7a1", "#ffd8c8", "#ff9bb2", "#ffdd59");

        // 하단 부드러운 언덕 모양
        ctx.fillStyle = "#f1e3ce";
        ctx.beginPath();
        ctx.arc(CONFIG.canvasWidth / 2, CONFIG.canvasHeight + 110, 480, Math.PI, 0);
        ctx.fill();

      } else if (currentTheme === 'ribbon') {
        // [테마 2] 🎀 빅리본 (도안 3,4번)
        ctx.fillStyle = "#fbfaf2";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        // 상단 양쪽 컬럼에 얹힌 큼직한 파스텔 리본 2개
        drawBigRibbon(ctx, CONFIG.marginLeft + (CONFIG.photoWidth / 2), CONFIG.marginTop - 45, 420, 150, "#90caf9", "#64b5f6");
        drawBigRibbon(ctx, col2X + (CONFIG.photoWidth / 2), CONFIG.marginTop - 45, 420, 150, "#fff59d", "#ffee58");

        // 하단 파스텔 잔디 언덕
        ctx.fillStyle = "#c8e6c9";
        ctx.beginPath();
        ctx.ellipse(CONFIG.canvasWidth / 2, CONFIG.canvasHeight + 80, 700, 240, 0, Math.PI, 0);
        ctx.fill();

      } else if (currentTheme === 'awning') {
        // [테마 3] 🎪 마켓 어닝 (도안 5,6번)
        ctx.fillStyle = "#fffdf7";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        // 상단 스트라이프 물결 어닝 지붕
        drawMarketAwning(ctx, 0, 95, "#ff6b8b", "#ffe3e8");

      } else if (currentTheme === 'rabbit') {
        // [테마 4] 🐰 래빗체리
        ctx.fillStyle = "#fff0f4";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        // 귀여운 토끼 귀 2쌍
        drawPartyBear(ctx, CONFIG.marginLeft + (CONFIG.photoWidth / 2), CONFIG.marginTop - 15, 110, "#ffffff", "#ffccd5", "#ff4081", "#ffeb3b");
        drawPartyBear(ctx, col2X + (CONFIG.photoWidth / 2), CONFIG.marginTop - 15, 110, "#ffffff", "#ffccd5", "#ff80ab", "#00e676");
      }

      // --- 2. 사진 4장 둥근 모서리 합성 & 뽀샤시 필터 적용 ---
      capturedFrames.forEach((frameCanvas, index) => {
        const pos = positions[index];
        ctx.save();

        drawRoundedRectPath(ctx, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight, CONFIG.photoRadius);
        ctx.clip();

        ctx.filter = `brightness(${brightnessMultiplier}) contrast(1.06) saturate(1.05)`;
        ctx.drawImage(frameCanvas, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
        ctx.restore();

        // 프레임 테두리 선
        ctx.strokeStyle = "rgba(0, 0, 0, 0.08)";
        ctx.lineWidth = 4;
        drawRoundedRectStroke(ctx, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight, CONFIG.photoRadius);

        // 어닝 테마의 경우 귀여운 점선 스티치 효과 추가
        if (currentTheme === 'awning') {
          ctx.save();
          ctx.strokeStyle = "#ff8fa3";
          ctx.lineWidth = 3;
          ctx.setLineDash([8, 6]);
          drawRoundedRectStroke(ctx, pos.x - 6, pos.y - 6, CONFIG.photoWidth + 12, CONFIG.photoHeight + 12, CONFIG.photoRadius + 4);
          ctx.restore();
        }
      });

      // --- 3. 도안 특유의 세부 장식 (구분선 미니 리본, 데이지 꽃, 캔디) ---
      const midY = CONFIG.marginTop + CONFIG.photoHeight + (CONFIG.gapY / 2);

      if (currentTheme === 'bear') {
        // 구분선 리본과 캔디
        drawCandyItem(ctx, CONFIG.marginLeft + (CONFIG.photoWidth / 2), midY, 18, "#ff6b81", "#ffa4b2");
        drawCandyItem(ctx, col2X + (CONFIG.photoWidth / 2), midY, 18, "#4ecdc4", "#a8edea");
        drawDaisyFlower(ctx, CONFIG.marginLeft - 12, CONFIG.marginTop + 240, 22, "#ffffff", "#ffd43b");
        drawDaisyFlower(ctx, CONFIG.canvasWidth - CONFIG.marginLeft + 12, row2Y + 280, 22, "#ffffff", "#ffd43b");

      } else if (currentTheme === 'ribbon') {
        // 프레임 가장자리에 피어난 데이지 꽃들과 나뭇잎 (도안 3,4번 느낌)
        drawDaisyFlower(ctx, CONFIG.marginLeft - 8, CONFIG.marginTop + 320, 26, "#ffffff", "#fbc02d");
        drawDaisyFlower(ctx, CONFIG.canvasWidth - CONFIG.marginLeft + 8, CONFIG.marginTop + 420, 24, "#ffffff", "#fbc02d");
        drawDaisyFlower(ctx, col2X + CONFIG.photoWidth + 5, row2Y + 180, 26, "#ffffff", "#fbc02d");
        drawMiniBow(ctx, CONFIG.marginLeft + (CONFIG.photoWidth / 2), midY, 18, "#ffb74d");
        drawMiniBow(ctx, col2X + (CONFIG.photoWidth / 2), midY, 18, "#64b5f6");

      } else if (currentTheme === 'awning') {
        // 도안 5,6번에 나온 프레임 가로선 리본 타이
        drawMiniBow(ctx, CONFIG.marginLeft + (CONFIG.photoWidth / 2), midY, 20, "#ffb703");
        drawMiniBow(ctx, col2X + (CONFIG.photoWidth / 2), midY, 20, "#fb8500");
        drawMiniBow(ctx, CONFIG.marginLeft + (CONFIG.photoWidth / 2), row2Y + CONFIG.photoHeight + 16, 18, "#ff4d6d");
        drawMiniBow(ctx, col2X + (CONFIG.photoWidth / 2), row2Y + CONFIG.photoHeight + 16, 18, "#06d6a0");

      } else if (currentTheme === 'rabbit') {
        drawMiniBow(ctx, CONFIG.marginLeft + (CONFIG.photoWidth / 2), midY, 18, "#ff4081");
        drawMiniBow(ctx, col2X + (CONFIG.photoWidth / 2), midY, 18, "#ff80ab");
        drawDaisyFlower(ctx, CONFIG.marginLeft - 8, row2Y + 200, 24, "#ffffff", "#ff4081");
      }

      // --- 4. 요청 하단 문구 렌더링 (가운데 맞춤) ---
      const bannerTop = row2Y + CONFIG.photoHeight;
      const bannerCenterY = bannerTop + ((CONFIG.canvasHeight - bannerTop) / 2);

      ctx.filter = "none";
      ctx.textAlign = "center";

      // 테마별 글씨 색상
      let titleColor = "#d90429";
      let dateColor = "#ff4d6d";

      if (currentTheme === 'bear') {
        titleColor = "#6d4c41";
        dateColor = "#8d6e63";
      } else if (currentTheme === 'ribbon') {
        titleColor = "#2e7d32";
        dateColor = "#388e3c";
      } else if (currentTheme === 'awning') {
        titleColor = "#c2185b";
        dateColor = "#e91e63";
      }

      // 좌우 아기자기한 이모지 장식
      ctx.font = "36px sans-serif";
      ctx.fillText(currentTheme === 'ribbon' ? "🌼" : "🎀", (CONFIG.canvasWidth / 2) - 400, bannerCenterY - 14);
      ctx.fillText(currentTheme === 'ribbon' ? "🌼" : "🎀", (CONFIG.canvasWidth / 2) + 400, bannerCenterY - 14);

      // 윗줄: ♥2026 고척초등학교 기버데이♥
      ctx.font = "900 48px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
      ctx.fillStyle = titleColor;
      ctx.fillText("♥2026 고척초등학교 기버데이♥", CONFIG.canvasWidth / 2, bannerCenterY - 14);

      // 아랫줄: 2026.11.19
      ctx.font = "800 32px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
      ctx.fillStyle = dateColor;
      ctx.fillText("2026.11.19", CONFIG.canvasWidth / 2, bannerCenterY + 46);
    }

    function drawRoundedRectPath(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawRoundedRectStroke(ctx, x, y, width, height, radius) {
      drawRoundedRectPath(ctx, x, y, width, height, radius);
      ctx.stroke();
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 촬영 시작
    btnStart.addEventListener('click', startCaptureSequence);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isRunning && modal.style.display !== 'flex' && loadingModal.style.display !== 'flex') {
        e.preventDefault();
        startCaptureSequence();
      }
    });

    // 인쇄 실행 & 안내창 카운트다운
    document.getElementById('btnPrint').addEventListener('click', () => {
      printTarget.src = canvas.toDataURL('image/png');
      modal.style.display = 'none';
      loadingModal.style.display = 'flex';

      setTimeout(() => {
        window.print();
      }, 300);

      let remain = 12;
      const countLabel = document.getElementById('printCountdown');
      const timer = setInterval(() => {
        remain--;
        countLabel.innerText = `(약 ${remain}초 후 다음 촬영이 가능합니다)`;
        if (remain <= 0) {
          clearInterval(timer);
          loadingModal.style.display = 'none';
        }
      }, 1000);
    });

    // 다운로드
    document.getElementById('btnDownload').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `고척초_기버데이_${currentTheme}_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // 닫기
    document.getElementById('btnClose').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    // 시작 시 카메라 구동
    initCamera();
  </script>
</body>
