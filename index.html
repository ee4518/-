<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고척초등학교 기버데이 인생네컷</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      padding: 12px 0;
      background-color: #1a1a24;
      color: #ffffff;
      font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 10px;
      color: #ffde59;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      letter-spacing: -0.5px;
    }

    /* 상단 컨트롤 바 */
    .top-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      background: #2a2a38;
      padding: 10px 22px;
      border-radius: 40px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .frame-chips {
      display: flex;
      gap: 8px;
    }

    .chip-btn {
      border: 2px solid transparent;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip-btn.active {
      border-color: #ffde59;
      transform: scale(1.06);
      box-shadow: 0 0 12px rgba(255, 222, 89, 0.7);
    }

    .chip-butter { background: #fff3bf; color: #b25e00; }
    .chip-berry  { background: #ffdce5; color: #c2255c; }
    .chip-sky    { background: #d0ebff; color: #1864ab; }
    .chip-custom { background: #38d9a9; color: #084935; }

    input[type=range] {
      width: 90px;
      accent-color: #ffde59;
      cursor: pointer;
    }

    /* 세로형 4컷 전용 뷰어 */
    .booth-container {
      position: relative;
      width: 440px;
      height: 560px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      border: 5px solid #3c3c50;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 거울 모드 */
      transition: filter 0.1s;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .cut-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #38d9a9;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 900;
      display: none;
    }

    .countdown-text {
      font-size: 150px;
      font-weight: 900;
      color: #ff2a5f;
      text-shadow: 0 0 30px rgba(0,0,0,0.9);
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.25s ease-out;
    }

    .countdown-text.show {
      opacity: 1;
      transform: scale(1.15);
    }

    .flash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    .controls {
      margin-top: 15px;
    }

    .btn-main {
      background: linear-gradient(135deg, #ff4081, #f50057);
      color: white;
      border: none;
      padding: 14px 45px;
      font-size: 21px;
      font-weight: 900;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(245, 0, 87, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-main:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(245, 0, 87, 0.65);
    }

    .btn-main:disabled {
      background: #555;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 결과 미리보기 모달 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    .modal-content {
      background: #252533;
      padding: 18px 24px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }

    #previewCanvas {
      width: 320px;
      height: 480px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-modal {
      border: none;
      padding: 11px 22px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      color: white;
    }

    .btn-print { background: #2563eb; }
    .btn-print:hover { background: #1d4ed8; }
    .btn-download { background: #475569; }
    .btn-download:hover { background: #334155; }
    .btn-close { background: #e11d48; }
    .btn-close:hover { background: #be123c; }

    /* 인쇄 중 로딩 안내 */
    .loading-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.93);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      flex-direction: column;
    }

    .loading-card {
      background: white;
      color: #111;
      padding: 40px 50px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.7);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .loading-card h2 {
      font-size: 32px;
      margin: 0 0 14px 0;
      color: #e11d48;
    }

    .loading-card p {
      font-size: 20px;
      color: #475569;
      margin: 6px 0;
      font-weight: 700;
    }

    .spinner {
      margin: 24px auto 14px;
      width: 60px;
      height: 60px;
      border: 6px solid #f1f5f9;
      border-top: 6px solid #e11d48;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    @page { size: 4in 6in; margin: 0; }
    @media print {
      body * { visibility: hidden; }
      .print-image, .print-image * { visibility: visible; }
      .print-image {
        position: absolute; left: 0; top: 0;
        width: 100vw; height: 100vh;
        display: block !important;
      }
    }
    .print-image { display: none; width: 100%; height: 100%; object-fit: fill; }
  </style>
</head>
<body>

  <header>★ 고척초등학교 기버데이 포토부스 ★</header>

  <!-- 상단 테마 선택 패널 -->
  <div class="top-panel">
    <div class="option-group">
      <span>🎨 프레임:</span>
      <div class="frame-chips">
        <button class="chip-btn chip-butter active" data-theme="butter">🧺 버터 깅엄체크</button>
        <button class="chip-btn chip-berry" data-theme="berry">🍓 딸기우유 구름</button>
        <button class="chip-btn chip-sky" data-theme="sky">☁️ 파스텔 스카이</button>
        <button class="chip-btn chip-custom" id="btnUploadTrigger">📁 내 디자인 PNG 넣기</button>
      </div>
      <input type="file" id="pngUploader" accept="image/png" style="display: none;">
    </div>
    <div class="option-group">
      <span>☀️ 뽀샤시:</span>
      <input type="range" id="brightnessRange" min="100" max="150" value="118">
      <span id="brightnessVal">118%</span>
    </div>
  </div>

  <!-- 촬영 뷰어 -->
  <div class="booth-container">
    <video id="webcam" autoplay playsinline></video>
    <div class="overlay">
      <div id="cutBadge" class="cut-badge">CUT 1 / 4</div>
      <div id="countdown" class="countdown-text">5</div>
    </div>
    <div id="flash" class="flash-screen"></div>
  </div>

  <div class="controls">
    <button id="btnStart" class="btn-main">📸 촬영 시작 (Space)</button>
  </div>

  <!-- 결과 모달 -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <div class="frame-chips">
        <button class="chip-btn chip-butter" data-theme="butter">🧺 버터 깅엄체크</button>
        <button class="chip-btn chip-berry" data-theme="berry">🍓 딸기우유 구름</button>
        <button class="chip-btn chip-sky" data-theme="sky">☁️ 파스텔 스카이</button>
      </div>

      <canvas id="previewCanvas" width="1200" height="1800"></canvas>

      <div class="modal-buttons">
        <button id="btnPrint" class="btn-modal btn-print">🖨️ 바로 인쇄</button>
        <button id="btnDownload" class="btn-modal btn-download">💾 사진 저장</button>
        <button id="btnClose" class="btn-modal btn-close">다시 찍기</button>
      </div>
    </div>
  </div>

  <!-- 인쇄 대기 화면 -->
  <div id="loadingModal" class="loading-modal">
    <div class="loading-card">
      <div class="spinner"></div>
      <h2>🖨️ 예쁘게 인쇄하고 있어요!</h2>
      <p>포토프린터에서 사진이 나올 때까지</p>
      <p style="color: #e11d48; font-weight: 800; font-size: 24px;">잠시만 자리에서 기다려주세요! 💖</p>
      <p id="printCountdown" style="font-size: 16px; color: #94a3b8; margin-top: 15px;">(약 12초 후 다음 촬영이 가능합니다)</p>
    </div>
  </div>

  <img id="printTarget" class="print-image" />

  <script>
    // 4x6 (1200 x 1800) 꽉 찬 규격 레이아웃
    const CONFIG = {
      canvasWidth: 1200,
      canvasHeight: 1800,
      photoWidth: 550,
      photoHeight: 720,
      marginLeft: 40,
      marginTop: 80,
      gapX: 20,
      gapY: 26,
      photoRadius: 26,
      countdownSec: 5
    };

    let currentTheme = 'butter';
    let brightnessMultiplier = 1.18;
    let customFrameImage = null; // 사용자가 올린 커스텀 PNG 이미지

    const video = document.getElementById('webcam');
    const btnStart = document.getElementById('btnStart');
    const cutBadge = document.getElementById('cutBadge');
    const countdownEl = document.getElementById('countdown');
    const flash = document.getElementById('flash');
    const modal = document.getElementById('resultModal');
    const loadingModal = document.getElementById('loadingModal');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const printTarget = document.getElementById('printTarget');
    const brightnessRange = document.getElementById('brightnessRange');
    const brightnessVal = document.getElementById('brightnessVal');
    const pngUploader = document.getElementById('pngUploader');

    let audioCtx = null;
    let capturedFrames = [];
    let isRunning = false;

    // 밝기 슬라이더
    function updateVideoFilter() {
      video.style.filter = `brightness(${brightnessMultiplier}) contrast(1.05) saturate(1.05)`;
    }

    brightnessRange.addEventListener('input', (e) => {
      const val = e.target.value;
      brightnessMultiplier = val / 100;
      brightnessVal.innerText = `${val}%`;
      updateVideoFilter();
      if (capturedFrames.length === 4) drawPhotoStrip();
    });

    // 테마 전환
    document.querySelectorAll('.frame-chips').forEach(container => {
      container.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip-btn');
        if (!btn || btn.id === 'btnUploadTrigger') return;
        currentTheme = btn.dataset.theme;

        document.querySelectorAll('.chip-btn').forEach(b => {
          if (b.id !== 'btnUploadTrigger') b.classList.toggle('active', b.dataset.theme === currentTheme);
        });

        if (capturedFrames.length === 4) drawPhotoStrip();
      });
    });

    // 사용자 PNG 파일 업로드 처리
    document.getElementById('btnUploadTrigger').addEventListener('click', () => {
      pngUploader.click();
    });

    pngUploader.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          customFrameImage = img;
          currentTheme = 'custom';
          alert("✨ 나만의 프레임 디자인이 성공적으로 등록되었습니다!");
          if (capturedFrames.length === 4) drawPhotoStrip();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    function playBeep(freq, duration) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        updateVideoFilter();
      } catch (err) {
        alert("카메라 연결 실패: " + err.message);
      }
    }

    // 5초 타이머 촬영
    async function startCaptureSequence() {
      if (isRunning) return;
      isRunning = true;
      btnStart.disabled = true;
      capturedFrames = [];
      cutBadge.style.display = 'block';

      for (let cut = 1; cut <= 4; cut++) {
        cutBadge.innerText = `CUT ${cut} / 4`;
        
        for (let sec = CONFIG.countdownSec; sec > 0; sec--) {
          countdownEl.innerText = sec;
          countdownEl.classList.add('show');
          playBeep(sec === 1 ? 950 : 800, 0.15);
          await wait(1000);
          countdownEl.classList.remove('show');
        }

        playBeep(1800, 0.35);
        triggerFlash();
        captureCurrentFrame();
        await wait(600);
      }

      cutBadge.style.display = 'none';
      drawPhotoStrip();
      modal.style.display = 'flex';
      isRunning = false;
      btnStart.disabled = false;
    }

    function captureCurrentFrame() {
      const tempCanvas = document.createElement('canvas');
      const vW = video.videoWidth || 1280;
      const vH = video.videoHeight || 720;

      const targetRatio = CONFIG.photoWidth / CONFIG.photoHeight;
      let sW = vH * targetRatio;
      let sH = vH;
      let sX = (vW - sW) / 2;
      let sY = 0;

      tempCanvas.width = CONFIG.photoWidth;
      tempCanvas.height = CONFIG.photoHeight;
      const tCtx = tempCanvas.getContext('2d');

      tCtx.translate(CONFIG.photoWidth, 0);
      tCtx.scale(-1, 1);
      tCtx.drawImage(video, sX, sY, sW, sH, 0, 0, CONFIG.photoWidth, CONFIG.photoHeight);

      capturedFrames.push(tempCanvas);
    }

    function triggerFlash() {
      flash.style.opacity = '0.95';
      flash.style.transition = 'none';
      setTimeout(() => {
        flash.style.transition = 'opacity 0.4s ease-out';
        flash.style.opacity = '0';
      }, 50);
    }

    /* ==============================================================
       ★ 세련된 인생네컷 스튜디오 패턴 배경 엔진 ★
    ============================================================== */

    // 1. 버터 깅엄체크 패턴 그리기
    function drawGinghamBackground(ctx, baseColor, stripeColor, size) {
      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

      ctx.fillStyle = stripeColor;
      // 세로 줄무늬
      for (let x = 0; x < CONFIG.canvasWidth; x += size * 2) {
        ctx.fillRect(x, 0, size, CONFIG.canvasHeight);
      }
      // 가로 줄무늬
      for (let y = 0; y < CONFIG.canvasHeight; y += size * 2) {
        ctx.fillRect(0, y, CONFIG.canvasWidth, size);
      }
    }

    // 2. 몽글몽글 구름 물결 패턴 그리기
    function drawCloudWaves(ctx, waveColor) {
      ctx.fillStyle = waveColor;
      const scallopCount = 12;
      const r = CONFIG.canvasWidth / scallopCount / 2;

      // 상단 물결
      for (let i = 0; i < scallopCount; i++) {
        ctx.beginPath();
        ctx.arc(i * (r * 2) + r, 0, r * 1.05, 0, Math.PI);
        ctx.fill();
      }

      // 하단 둥근 언덕
      ctx.beginPath();
      ctx.ellipse(CONFIG.canvasWidth / 2, CONFIG.canvasHeight + 40, 680, 210, 0, Math.PI, 0);
      ctx.fill();
    }

    /* ==============================================================
       ★ 메인 프레임 렌더링 ★
    ============================================================== */
    function drawPhotoStrip() {
      ctx.filter = "none";

      const col2X = CONFIG.marginLeft + CONFIG.photoWidth + CONFIG.gapX;
      const row2Y = CONFIG.marginTop + CONFIG.photoHeight + CONFIG.gapY;
      const positions = [
        { x: CONFIG.marginLeft, y: CONFIG.marginTop },
        { x: col2X,             y: CONFIG.marginTop },
        { x: CONFIG.marginLeft, y: row2Y },
        { x: col2X,             y: row2Y }
      ];

      let titleColor = "#5c3d2e";
      let dateColor = "#8c624d";

      // 1. 테마별 배경 렌더링
      if (currentTheme === 'butter') {
        // [테마 1] 🧺 버터 깅엄체크
        drawGinghamBackground(ctx, "#fdf9ee", "rgba(247, 215, 148, 0.45)", 40);
        titleColor = "#6d4c41";
        dateColor = "#8d6e63";

      } else if (currentTheme === 'berry') {
        // [테마 2] 🍓 딸기우유 구름
        ctx.fillStyle = "#fff0f3";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
        drawCloudWaves(ctx, "#ffd0dc");
        titleColor = "#c2255c";
        dateColor = "#e64980";

      } else if (currentTheme === 'sky') {
        // [테마 3] ☁️ 파스텔 스카이
        ctx.fillStyle = "#f0f8ff";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
        drawCloudWaves(ctx, "#d0ebff");
        titleColor = "#1864ab";
        dateColor = "#228be6";

      } else if (currentTheme === 'custom') {
        // [테마 4] 사용자가 올린 프레임
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
      }

      // 2. 사진 4장 둥근 모서리 합성 & 뽀샤시 필터 적용
      capturedFrames.forEach((frameCanvas, index) => {
        const pos = positions[index];
        ctx.save();

        // 둥근 사각형 클리핑
        drawRoundedRectPath(ctx, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight, CONFIG.photoRadius);
        ctx.clip();

        // 뽀샤시 필터
        ctx.filter = `brightness(${brightnessMultiplier}) contrast(1.06) saturate(1.05)`;
        ctx.drawImage(frameCanvas, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
        ctx.restore();

        // 은은하고 깔끔한 폴라로이드 테두리
        ctx.strokeStyle = "rgba(0, 0, 0, 0.08)";
        ctx.lineWidth = 4;
        drawRoundedRectStroke(ctx, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight, CONFIG.photoRadius);
      });

      // 3. 만약 사용자가 업로드한 커스텀 PNG 프레임이 있다면 위에 덮어쓰기
      if (currentTheme === 'custom' && customFrameImage) {
        ctx.drawImage(customFrameImage, 0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
      }

      // 4. 하단 지정 문구 렌더링 (가운데 정렬)
      const bannerTop = row2Y + CONFIG.photoHeight;
      const bannerCenterY = bannerTop + ((CONFIG.canvasHeight - bannerTop) / 2);

      ctx.filter = "none";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // 윗줄: ♥2026 고척초등학교 기버데이♥
      ctx.font = "900 48px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
      ctx.fillStyle = titleColor;
      ctx.fillText("♥2026 고척초등학교 기버데이♥", CONFIG.canvasWidth / 2, bannerCenterY - 16);

      // 아랫줄: 2026.11.19
      ctx.font = "800 32px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
      ctx.fillStyle = dateColor;
      ctx.fillText("2026.11.19", CONFIG.canvasWidth / 2, bannerCenterY + 44);
    }

    function drawRoundedRectPath(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawRoundedRectStroke(ctx, x, y, width, height, radius) {
      drawRoundedRectPath(ctx, x, y, width, height, radius);
      ctx.stroke();
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 촬영 시작
    btnStart.addEventListener('click', startCaptureSequence);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isRunning && modal.style.display !== 'flex' && loadingModal.style.display !== 'flex') {
        e.preventDefault();
        startCaptureSequence();
      }
    });

    // 인쇄 실행 & 안내창 카운트다운
    document.getElementById('btnPrint').addEventListener('click', () => {
      printTarget.src = canvas.toDataURL('image/png');
      modal.style.display = 'none';
      loadingModal.style.display = 'flex';

      setTimeout(() => {
        window.print();
      }, 300);

      let remain = 12;
      const countLabel = document.getElementById('printCountdown');
      const timer = setInterval(() => {
        remain--;
        countLabel.innerText = `(약 ${remain}초 후 다음 촬영이 가능합니다)`;
        if (remain <= 0) {
          clearInterval(timer);
          loadingModal.style.display = 'none';
        }
      }, 1000);
    });

    // 다운로드
    document.getElementById('btnDownload').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `고척초_기버데이_${currentTheme}_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // 닫기
    document.getElementById('btnClose').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    // 시작 시 카메라 구동
    initCamera();
  </script>
</body>
</html>
