<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고척초등학교 기버데이 인생네컷</title>
  <!-- 귀여운 둥근 손글씨 폰트 (Jua) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 10px 0;
      background-color: #1a1a24;
      color: #ffffff;
      font-family: 'Jua', 'Malgun Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      font-size: 28px;
      margin-bottom: 10px;
      color: #ffde59;
      text-shadow: 0 3px 10px rgba(0,0,0,0.6);
      letter-spacing: 0.5px;
    }

    /* 상단 옵션 패널 */
    .top-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      background: #282838;
      padding: 10px 24px;
      border-radius: 40px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
    }

    .frame-chips {
      display: flex;
      gap: 8px;
    }

    .chip-btn {
      font-family: 'Jua', sans-serif;
      border: 2px solid transparent;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn.active {
      border-color: #ffde59;
      transform: scale(1.08);
      box-shadow: 0 0 12px rgba(255, 222, 89, 0.7);
    }

    /* 새로운 4개 테마 버튼 스타일 */
    .chip-ribbon   { background: #e3f2fd; color: #1971c2; }
    .chip-festival { background: #fff3bf; color: #e67700; }
    .chip-heart    { background: #ffe3ec; color: #d6336c; }
    .chip-animals  { background: #f3d9fa; color: #862e9c; }

    input[type=range] {
      width: 95px;
      accent-color: #ffde59;
      cursor: pointer;
    }

    /* 세로형 뷰어 부스 */
    .booth-container {
      position: relative;
      width: 440px;
      height: 600px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,0.8);
      border: 5px solid #3c3c52;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 거울 모드 */
      transition: filter 0.1s;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .cut-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #38d9a9;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 20px;
      display: none;
    }

    .countdown-text {
      font-size: 150px;
      color: #ff2a5f;
      text-shadow: 0 0 30px rgba(0,0,0,0.9);
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.25s ease-out;
    }

    .countdown-text.show {
      opacity: 1;
      transform: scale(1.15);
    }

    .flash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
    }

    .btn-main {
      font-family: 'Jua', sans-serif;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 13px 45px;
      font-size: 23px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(3, 105, 161, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-main:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.7);
    }

    .btn-main:disabled {
      background: #555;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-sub {
      font-family: 'Jua', sans-serif;
      background: #475569;
      color: white;
      border: none;
      padding: 13px 24px;
      font-size: 18px;
      border-radius: 40px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-sub:hover {
      background: #64748b;
    }

    /* 결과 & 미리보기 모달 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.92);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    .modal-content {
      background: #252533;
      padding: 20px 26px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }

    #previewCanvas {
      width: 320px;
      height: 480px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-modal {
      font-family: 'Jua', sans-serif;
      border: none;
      padding: 10px 22px;
      font-size: 17px;
      border-radius: 25px;
      cursor: pointer;
      color: white;
    }

    .btn-print { background: #0284c7; }
    .btn-print:hover { background: #0369a1; }
    .btn-download { background: #475569; }
    .btn-download:hover { background: #334155; }
    .btn-close { background: #e11d48; }
    .btn-close:hover { background: #be123c; }

    /* 인쇄 대기 로딩 팝업 */
    .loading-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.94);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      flex-direction: column;
    }

    .loading-card {
      background: white;
      color: #111;
      padding: 40px 50px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.7);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .loading-card h2 {
      font-size: 34px;
      margin: 0 0 14px 0;
      color: #0284c7;
    }

    .loading-card p {
      font-size: 22px;
      color: #475569;
      margin: 6px 0;
    }

    .spinner {
      margin: 24px auto 14px;
      width: 60px;
      height: 60px;
      border: 6px solid #f1f5f9;
      border-top: 6px solid #0284c7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 4x6 Borderless 인쇄 */
    @page {
      size: 4in 6in;
      margin: 0;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      .print-image, .print-image * {
        visibility: visible;
      }
      .print-image {
        position: absolute;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        display: block !important;
      }
    }

    .print-image {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
  </style>
</head>
<body>

  <header>★ 고척초등학교 기버데이 포토부스 ★</header>

  <div class="top-panel">
    <div class="option-group">
      <span>🎨 테마 선택:</span>
      <div class="frame-chips">
        <button class="chip-btn chip-ribbon active" data-theme="ribbon">🎀 하늘리본</button>
        <button class="chip-btn chip-festival" data-theme="festival">🎉 팡팡 페스티벌</button>
        <button class="chip-btn chip-heart" data-theme="heart">💖 러블리 하트</button>
        <button class="chip-btn chip-animals" data-theme="animals">🐾 몽글 동물친구</button>
      </div>
    </div>
    <div class="option-group">
      <span>☀️ 뽀샤시:</span>
      <input type="range" id="brightnessRange" min="100" max="150" value="118">
      <span id="brightnessVal">118%</span>
    </div>
  </div>

  <div class="booth-container">
    <video id="webcam" autoplay playsinline></video>
    <div class="overlay">
      <div id="cutBadge" class="cut-badge">CUT 1 / 4</div>
      <div id="countdown" class="countdown-text">5</div>
    </div>
    <div id="flash" class="flash-screen"></div>
  </div>

  <div class="controls">
    <button id="btnStart" class="btn-main">📸 촬영 시작 (Space)</button>
    <button id="btnPreview" class="btn-sub">🔍 프레임 미리보기</button>
  </div>

  <!-- 결과 & 프레임 미리보기 팝업 -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <div class="frame-chips">
        <button class="chip-btn chip-ribbon" data-theme="ribbon">🎀 하늘리본</button>
        <button class="chip-btn chip-festival" data-theme="festival">🎉 팡팡 페스티벌</button>
        <button class="chip-btn chip-heart" data-theme="heart">💖 러블리 하트</button>
        <button class="chip-btn chip-animals" data-theme="animals">🐾 몽글 동물친구</button>
      </div>

      <canvas id="previewCanvas" width="1200" height="1800"></canvas>

      <div class="modal-buttons">
        <button id="btnPrint" class="btn-modal btn-print">🖨️ 바로 인쇄</button>
        <button id="btnDownload" class="btn-modal btn-download">💾 사진 저장</button>
        <button id="btnClose" class="btn-modal btn-close">닫기</button>
      </div>
    </div>
  </div>

  <!-- 인쇄 대기 팝업 -->
  <div id="loadingModal" class="loading-modal">
    <div class="loading-card">
      <div class="spinner"></div>
      <h2>🖨️ 예쁘게 인쇄하고 있어요!</h2>
      <p>포토프린터에서 사진이 나올 때까지</p>
      <p style="color: #0284c7; font-size: 26px;">잠시만 자리에서 기다려주세요! 💖</p>
      <p id="printCountdown" style="font-size: 16px; color: #94a3b8; margin-top: 15px;">(약 12초 후 다음 촬영이 가능합니다)</p>
    </div>
  </div>

  <img id="printTarget" class="print-image" />

  <script>
    const CONFIG = {
      canvasWidth: 1200,
      canvasHeight: 1800,
      photoWidth: 460,       // 프레임이 잘 보이도록 콤팩트한 사진 가로
      photoHeight: 620,      // 세로 비율 사진
      marginLeft: 95,        // 넓은 외곽 여백
      marginTop: 90,         // 상단 여백
      gapX: 90,              // 좌우 사진 사이 여백
      gapY: 70,              // 상하 사진 사이 여백
      photoRadius: 24,       // 사진 모서리 둥글게
      countdownSec: 5        // 5초 타이머
    };

    let currentTheme = 'ribbon';
    let brightnessMultiplier = 1.18;

    const video = document.getElementById('webcam');
    const btnStart = document.getElementById('btnStart');
    const btnPreview = document.getElementById('btnPreview');
    const cutBadge = document.getElementById('cutBadge');
    const countdownEl = document.getElementById('countdown');
    const flash = document.getElementById('flash');
    const modal = document.getElementById('resultModal');
    const loadingModal = document.getElementById('loadingModal');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const printTarget = document.getElementById('printTarget');
    const brightnessRange = document.getElementById('brightnessRange');
    const brightnessVal = document.getElementById('brightnessVal');

    let audioCtx = null;
    let capturedFrames = [];
    let isRunning = false;

    // 밝기 슬라이더
    function updateVideoFilter() {
      video.style.filter = `brightness(${brightnessMultiplier}) contrast(1.05) saturate(1.05)`;
    }
    brightnessRange.addEventListener('input', (e) => {
      const val = e.target.value;
      brightnessMultiplier = val / 100;
      brightnessVal.innerText = `${val}%`;
      updateVideoFilter();
      drawPhotoStrip();
    });

    // 프레임 버튼 클릭 시 바로 미리보기 반영
    document.querySelectorAll('.frame-chips').forEach(container => {
      container.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip-btn');
        if (!btn) return;
        currentTheme = btn.dataset.theme;

        document.querySelectorAll('.chip-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.theme === currentTheme);
        });

        drawPhotoStrip();
        modal.style.display = 'flex';
      });
    });

    btnPreview.addEventListener('click', () => {
      drawPhotoStrip();
      modal.style.display = 'flex';
    });

    function playBeep(freq, duration) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        updateVideoFilter();
      } catch (err) {
        alert("카메라 연결 실패: " + err.message);
      }
    }

    // 5초 타이머 촬영
    async function startCaptureSequence() {
      if (isRunning) return;
      isRunning = true;
      btnStart.disabled = true;
      capturedFrames = [];
      cutBadge.style.display = 'block';

      for (let cut = 1; cut <= 4; cut++) {
        cutBadge.innerText = `CUT ${cut} / 4`;
        
        for (let sec = CONFIG.countdownSec; sec > 0; sec--) {
          countdownEl.innerText = sec;
          countdownEl.classList.add('show');
          playBeep(sec === 1 ? 950 : 800, 0.15);
          await wait(1000);
          countdownEl.classList.remove('show');
        }

        playBeep(1800, 0.35);
        triggerFlash();
        captureCurrentFrame();
        await wait(600);
      }

      cutBadge.style.display = 'none';
      drawPhotoStrip();
      modal.style.display = 'flex';
      isRunning = false;
      btnStart.disabled = false;
    }

    function captureCurrentFrame() {
      const tempCanvas = document.createElement('canvas');
      const vW = video.videoWidth || 1280;
      const vH = video.videoHeight || 720;

      const targetRatio = CONFIG.photoWidth / CONFIG.photoHeight;
      let sW = vH * targetRatio;
      let sH = vH;
      let sX = (vW - sW) / 2;
      let sY = 0;

      tempCanvas.width = CONFIG.photoWidth;
      tempCanvas.height = CONFIG.photoHeight;
      const tCtx = tempCanvas.getContext('2d');

      tCtx.translate(CONFIG.photoWidth, 0);
      tCtx.scale(-1, 1);
      tCtx.drawImage(video, sX, sY, sW, sH, 0, 0, CONFIG.photoWidth, CONFIG.photoHeight);

      capturedFrames.push(tempCanvas);
    }

    function triggerFlash() {
      flash.style.opacity = '0.95';
      flash.style.transition = 'none';
      setTimeout(() => {
        flash.style.transition = 'opacity 0.4s ease-out';
        flash.style.opacity = '0';
      }, 50);
    }

    // ★ 1번 요구사항: 리본 크기를 35% 더 작게 조정한 미니 리본 드로잉 함수
    function drawMiniRibbon(ctx, x, y, scale = 0.65, angle = 0, color = "#9ec5ea") {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.scale(scale, scale);
      ctx.strokeStyle = color;
      ctx.lineWidth = 5.2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      // 왼쪽 날개
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-20, -32, -55, -18, -48, 8);
      ctx.bezierCurveTo(-42, 26, -18, 14, 0, 0);
      ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
      ctx.fill();
      ctx.stroke();

      // 오른쪽 날개
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(20, -32, 55, -18, 48, 8);
      ctx.bezierCurveTo(42, 26, 18, 14, 0, 0);
      ctx.fill();
      ctx.stroke();

      // 왼쪽 꼬리
      ctx.beginPath();
      ctx.moveTo(-4, 6);
      ctx.bezierCurveTo(-14, 25, -24, 45, -34, 62);
      ctx.lineTo(-24, 52);
      ctx.lineTo(-17, 63);
      ctx.bezierCurveTo(-10, 44, -3, 25, 0, 6);
      ctx.stroke();

      // 오른쪽 꼬리
      ctx.beginPath();
      ctx.moveTo(4, 6);
      ctx.bezierCurveTo(14, 25, 24, 45, 34, 62);
      ctx.lineTo(24, 52);
      ctx.lineTo(17, 63);
      ctx.bezierCurveTo(10, 44, 3, 25, 0, 6);
      ctx.stroke();

      // 가운데 알
      ctx.beginPath();
      ctx.arc(0, 1, 8.5, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    // 손그림 하트 드로잉 함수
    function drawCuteHeart(ctx, x, y, size, angle, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.strokeStyle = color;
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      ctx.lineWidth = 4.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(0, topCurveHeight);
      ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
      ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, (size + topCurveHeight) / 1.5, 0, size);
      ctx.bezierCurveTo(0, (size + topCurveHeight) / 1.5, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
      ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // 동물 얼굴(곰돌이/토끼) 드로잉 함수
    function drawCuteAnimal(ctx, x, y, type) {
      ctx.save();
      ctx.translate(x, y);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#8b5e3c";
      ctx.fillStyle = "#ffffff";

      if (type === 'bear') {
        // 귀
        ctx.beginPath(); ctx.arc(-22, -18, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(22, -18, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // 얼굴
        ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // 눈코입
        ctx.fillStyle = "#8b5e3c";
        ctx.beginPath(); ctx.arc(-9, -2, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(9, -2, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 6, 4, 0, Math.PI * 2); ctx.fill();
      } else {
        // 발바닥
        ctx.fillStyle = "#ffb3ba";
        ctx.beginPath(); ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(-14, -13, 6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, -18, 6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(14, -13, 6, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    // ★ 캔버스 메인 합성
    function drawPhotoStrip() {
      ctx.filter = "none";

      // 1. 테마별 배경 프레임 렌더링
      if (currentTheme === 'ribbon') {
        // 🎀 하늘리본: 깨끗한 흰 바탕 + 작고 앙증맞은 하늘색 미니 리본 배열
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        const miniRibbons = [
          // 상단 여백
          {x: 100, y: 48, a: -6}, {x: 350, y: 45, a: 5}, {x: 600, y: 46, a: -4}, {x: 850, y: 45, a: 6}, {x: 1100, y: 48, a: -5},
          // 사진 1행 좌우/중앙
          {x: 45, y: 220, a: 8}, {x: 600, y: 240, a: -7}, {x: 1155, y: 220, a: -6},
          {x: 45, y: 460, a: -5}, {x: 600, y: 480, a: 6}, {x: 1155, y: 460, a: 7},
          // 1행과 2행 사이 가로 여백
          {x: 120, y: 745, a: -6}, {x: 360, y: 745, a: 5}, {x: 600, y: 745, a: -4}, {x: 840, y: 745, a: 6}, {x: 1080, y: 745, a: -5},
          // 사진 2행 좌우/중앙
          {x: 45, y: 980, a: 7}, {x: 600, y: 1000, a: -5}, {x: 1155, y: 980, a: 8},
          {x: 45, y: 1220, a: -6}, {x: 600, y: 1240, a: 5}, {x: 1155, y: 1220, a: -7},
          // 하단 멘트 주변
          {x: 90, y: 1440, a: -5}, {x: 340, y: 1435, a: 6}, {x: 600, y: 1440, a: -4}, {x: 860, y: 1435, a: 5}, {x: 1110, y: 1440, a: -6},
          {x: 100, y: 1720, a: 7}, {x: 350, y: 1730, a: -5}, {x: 600, y: 1725, a: 4}, {x: 850, y: 1730, a: -6}, {x: 1100, y: 1720, a: 5}
        ];
        miniRibbons.forEach(r => drawMiniRibbon(ctx, r.x, r.y, 0.65, r.a, "#9ec5ea"));

      } else if (currentTheme === 'festival') {
        // 🎉 팡팡 페스티벌: 상단 파티 가랜드 + 축제 컨페티 폭죽
        ctx.fillStyle = "#fffef7";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        // 상단 가랜드 플래그
        const flags = ["#ff6b6b", "#fcc419", "#4dabf7", "#51cf66", "#ff922b", "#845ef7", "#ff6b6b", "#4dabf7"];
        for (let i = 0; i < flags.length; i++) {
          ctx.fillStyle = flags[i];
          ctx.beginPath();
          const fx = 60 + i * 145;
          ctx.moveTo(fx, 15);
          ctx.lineTo(fx + 100, 15);
          ctx.lineTo(fx + 50, 75);
          ctx.closePath();
          ctx.fill();
        }

        // 반짝이 컨페티 별 & 링가링가
        const confettis = [
          {x: 45, y: 300, c: "#ff6b6b"}, {x: 1150, y: 320, c: "#fcc419"},
          {x: 600, y: 350, c: "#4dabf7"}, {x: 50, y: 800, c: "#51cf66"},
          {x: 600, y: 745, c: "#ff922b"}, {x: 1150, y: 820, c: "#845ef7"},
          {x: 55, y: 1200, c: "#fcc419"}, {x: 1145, y: 1250, c: "#ff6b6b"},
          {x: 200, y: 1450, c: "#4dabf7"}, {x: 1000, y: 1450, c: "#51cf66"}
        ];
        confettis.forEach(c => {
          ctx.fillStyle = c.c;
          ctx.beginPath();
          ctx.arc(c.x, c.y, 8, 0, Math.PI*2);
          ctx.fill();
        });

      } else if (currentTheme === 'heart') {
        // 💖 러블리 하트: 사랑스러운 피치핑크 바탕 + 몽글몽글 하트 드로잉
        ctx.fillStyle = "#fff8fa";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        const hearts = [
          {x: 80, y: 55, s: 35, a: -12}, {x: 600, y: 50, s: 40, a: 8}, {x: 1120, y: 55, s: 35, a: 15},
          {x: 45, y: 300, s: 42, a: 14}, {x: 600, y: 320, s: 32, a: -8}, {x: 1155, y: 300, s: 42, a: -10},
          {x: 200, y: 745, s: 38, a: -6}, {x: 600, y: 745, s: 45, a: 5}, {x: 1000, y: 745, s: 38, a: -12},
          {x: 45, y: 1100, s: 42, a: -14}, {x: 600, y: 1120, s: 35, a: 10}, {x: 1155, y: 1100, s: 42, a: 12},
          {x: 140, y: 1450, s: 44, a: 8}, {x: 1060, y: 1450, s: 44, a: -8},
          {x: 160, y: 1720, s: 40, a: -10}, {x: 600, y: 1730, s: 42, a: 6}, {x: 1040, y: 1720, s: 40, a: 12}
        ];
        hearts.forEach(h => drawCuteHeart(ctx, h.x, h.y, h.s, h.a, "#ff85a2"));

      } else if (currentTheme === 'animals') {
        // 🐾 몽글 동물친구: 테두리 곳곳에 귀여운 아기 곰돌이와 발바닥
        ctx.fillStyle = "#fcfbfa";
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        drawCuteAnimal(ctx, 120, 52, 'bear');
        drawCuteAnimal(ctx, 600, 52, 'paw');
        drawCuteAnimal(ctx, 1080, 52, 'bear');

        drawCuteAnimal(ctx, 50, 400, 'paw');
        drawCuteAnimal(ctx, 600, 380, 'bear');
        drawCuteAnimal(ctx, 1150, 400, 'paw');

        drawCuteAnimal(ctx, 220, 745, 'bear');
        drawCuteAnimal(ctx, 600, 745, 'paw');
        drawCuteAnimal(ctx, 980, 745, 'bear');

        drawCuteAnimal(ctx, 50, 1150, 'bear');
        drawCuteAnimal(ctx, 600, 1150, 'paw');
        drawCuteAnimal(ctx, 1150, 1150, 'bear');

        drawCuteAnimal(ctx, 160, 1720, 'paw');
        drawCuteAnimal(ctx, 1040, 1720, 'bear');
      }

      // 2. 4컷 사진 렌더링
      const col2X = CONFIG.marginLeft + CONFIG.photoWidth + CONFIG.gapX;
      const row2Y = CONFIG.marginTop + CONFIG.photoHeight + CONFIG.gapY;
      const positions = [
        { x: CONFIG.marginLeft, y: CONFIG.marginTop },
        { x: col2X,             y: CONFIG.marginTop },
        { x: CONFIG.marginLeft, y: row2Y },
        { x: col2X,             y: row2Y }
      ];

      const hasRealPhotos = capturedFrames.length === 4;

      positions.forEach((pos, index) => {
        ctx.save();
        drawRoundedRectPath(ctx, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight, CONFIG.photoRadius);
        ctx.clip();

        if (hasRealPhotos) {
          ctx.filter = `brightness(${brightnessMultiplier}) contrast(1.06) saturate(1.05)`;
          ctx.drawImage(capturedFrames[index], pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
        } else {
          ctx.fillStyle = (currentTheme === 'ribbon') ? "#f0f8ff" : "#fbfbfb";
          ctx.fillRect(pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
          ctx.fillStyle = "#94a3b8";
          ctx.font = "34px 'Jua', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(`사진 ${index + 1} 들어가는 곳`, pos.x + CONFIG.photoWidth / 2, pos.y + CONFIG.photoHeight / 2);
        }
        ctx.restore();

        // 산뜻한 화이트 테두리 선
        ctx.strokeStyle = (currentTheme === 'ribbon') ? "#bce0fd" : "#ffffff";
        ctx.lineWidth = 7;
        drawRoundedRectStroke(ctx, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight, CONFIG.photoRadius);
      });

      // 3. ★ 4번 요구사항: 하단 흰색 불투명 네모 박스 완전히 제거 & 글씨 직접 렌더링
      const bannerTop = row2Y + CONFIG.photoHeight + 40;
      const bannerCenterY = bannerTop + ((CONFIG.canvasHeight - bannerTop) / 2) - 10;

      ctx.textAlign = "center";

      // 글씨 색상 지정
      let mainTextColor = "#0284c7";
      let subTextColor  = "#38bdf8";

      if (currentTheme === 'festival') {
        mainTextColor = "#d9480f";
        subTextColor  = "#f76707";
      } else if (currentTheme === 'heart') {
        mainTextColor = "#d6336c";
        subTextColor  = "#f783ac";
      } else if (currentTheme === 'animals') {
        mainTextColor = "#5c3d2e";
        subTextColor  = "#8b5e3c";
      }

      // 글씨 뒤에 은은한 화이트 외곽선을 주어 네모 상자가 없어도 배경 위에서 선명하게 돋보임!
      ctx.lineJoin = "round";
      ctx.miterLimit = 2;

      // 윗줄: ♥2026 고척초등학교 기버데이♥
      ctx.font = "54px 'Jua', sans-serif";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 9;
      ctx.strokeText("♥2026 고척초등학교 기버데이♥", CONFIG.canvasWidth / 2, bannerCenterY - 18);
      ctx.fillStyle = mainTextColor;
      ctx.fillText("♥2026 고척초등학교 기버데이♥", CONFIG.canvasWidth / 2, bannerCenterY - 18);

      // 아랫줄: 2026.11.19
      ctx.font = "40px 'Jua', sans-serif";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 7;
      ctx.strokeText("2026.11.19", CONFIG.canvasWidth / 2, bannerCenterY + 44);
      ctx.fillStyle = subTextColor;
      ctx.fillText("2026.11.19", CONFIG.canvasWidth / 2, bannerCenterY + 44);
    }

    function drawRoundedRectPath(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawRoundedRectStroke(ctx, x, y, width, height, radius) {
      drawRoundedRectPath(ctx, x, y, width, height, radius);
      ctx.stroke();
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    btnStart.addEventListener('click', startCaptureSequence);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isRunning && modal.style.display !== 'flex' && loadingModal.style.display !== 'flex') {
        e.preventDefault();
        startCaptureSequence();
      }
    });

    document.getElementById('btnPrint').addEventListener('click', () => {
      printTarget.src = canvas.toDataURL('image/png');
      modal.style.display = 'none';
      loadingModal.style.display = 'flex';

      setTimeout(() => {
        window.print();
      }, 300);

      let remain = 12;
      const countLabel = document.getElementById('printCountdown');
      const timer = setInterval(() => {
        remain--;
        countLabel.innerText = `(약 ${remain}초 후 다음 촬영이 가능합니다)`;
        if (remain <= 0) {
          clearInterval(timer);
          loadingModal.style.display = 'none';
        }
      }, 1000);
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `고척초_기버데이_${currentTheme}_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    document.getElementById('btnClose').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    // 폰트 로드 후 캔버스 초기 렌더링
    document.fonts.ready.then(() => {
      drawPhotoStrip();
    });

    initCamera();
  </script>
</body>
</html>
