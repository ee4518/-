<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고척초등학교 기버데이 인생네컷</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 10px 0;
      background-color: #1a1a24;
      color: #ffffff;
      font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 10px;
      color: #ffde59;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      letter-spacing: -0.5px;
    }

    /* 상단 프레임 및 옵션 바 */
    .top-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      background: #282836;
      padding: 10px 22px;
      border-radius: 40px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .frame-chips {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .chip-btn {
      border: 2px solid transparent;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn.active {
      border-color: #ffde59;
      transform: scale(1.06);
      box-shadow: 0 0 12px rgba(255, 222, 89, 0.7);
    }

    .chip-ribbon { background: #e3f2fd; color: #1971c2; }
    .chip-pink   { background: #ffd4df; color: #b01e4a; }
    .chip-yellow { background: #ffec99; color: #d97706; }
    .chip-upload { background: #4f46e5; color: #ffffff; }

    input[type=range] {
      width: 95px;
      accent-color: #ffde59;
      cursor: pointer;
    }

    /* 세로형 부스 컨테이너 */
    .booth-container {
      position: relative;
      width: 440px;
      height: 600px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,0.8);
      border: 5px solid #3c3c52;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 거울 모드 */
      transition: filter 0.1s;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .cut-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #38d9a9;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 900;
      display: none;
    }

    .countdown-text {
      font-size: 150px;
      font-weight: 900;
      color: #ff2a5f;
      text-shadow: 0 0 30px rgba(0,0,0,0.9);
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.25s ease-out;
    }

    .countdown-text.show {
      opacity: 1;
      transform: scale(1.15);
    }

    .flash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    .controls {
      margin-top: 15px;
    }

    .btn-main {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 14px 46px;
      font-size: 21px;
      font-weight: 900;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(3, 105, 161, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-main:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.7);
    }

    .btn-main:disabled {
      background: #555;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 결과 모달 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    .modal-content {
      background: #252533;
      padding: 20px 26px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }

    #previewCanvas {
      width: 320px;
      height: 480px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-modal {
      border: none;
      padding: 11px 22px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      color: white;
    }

    .btn-print { background: #0284c7; }
    .btn-print:hover { background: #0369a1; }
    .btn-download { background: #475569; }
    .btn-download:hover { background: #334155; }
    .btn-close { background: #e11d48; }
    .btn-close:hover { background: #be123c; }

    /* 인쇄 대기 팝업 */
    .loading-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.93);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      flex-direction: column;
    }

    .loading-card {
      background: white;
      color: #111;
      padding: 40px 50px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.7);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .loading-card h2 {
      font-size: 32px;
      margin: 0 0 14px 0;
      color: #0284c7;
    }

    .loading-card p {
      font-size: 20px;
      color: #475569;
      margin: 6px 0;
      font-weight: 700;
    }

    .spinner {
      margin: 24px auto 14px;
      width: 60px;
      height: 60px;
      border: 6px solid #f1f5f9;
      border-top: 6px solid #0284c7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 4x6 인치 Borderless 인쇄 */
    @page {
      size: 4in 6in;
      margin: 0;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      .print-image, .print-image * {
        visibility: visible;
      }
      .print-image {
        position: absolute;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        display: block !important;
      }
    }

    .print-image {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
  </style>
</head>
<body>

  <header>★ 고척초등학교 기버데이 포토부스 ★</header>

  <div class="top-panel">
    <div class="option-group">
      <span>🎨 프레임:</span>
      <div class="frame-chips">
        <button class="chip-btn chip-ribbon active" data-theme="ribbon">🎀 하늘리본</button>
        <button class="chip-btn chip-pink" data-theme="pink">🍓 딸기베어</button>
        <button class="chip-btn chip-yellow" data-theme="yellow">🧸 큐티베어</button>
        <!-- 사용자가 직접 이미지를 첨부할 수 있는 버튼 -->
        <button class="chip-btn chip-upload" id="btnUploadTrigger">📁 내 리본사진 넣기</button>
        <input type="file" id="frameFileInput" accept="image/*" style="display: none;">
      </div>
    </div>
    <div class="option-group">
      <span>☀️ 뽀샤시:</span>
      <input type="range" id="brightnessRange" min="100" max="150" value="118">
      <span id="brightnessVal">118%</span>
    </div>
  </div>

  <div class="booth-container">
    <video id="webcam" autoplay playsinline></video>
    <div class="overlay">
      <div id="cutBadge" class="cut-badge">CUT 1 / 4</div>
      <div id="countdown" class="countdown-text">5</div>
    </div>
    <div id="flash" class="flash-screen"></div>
  </div>

  <div class="controls">
    <button id="btnStart" class="btn-main">📸 촬영 시작 (Space)</button>
  </div>

  <!-- 결과 미리보기 팝업 -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <div class="frame-chips">
        <button class="chip-btn chip-ribbon" data-theme="ribbon">🎀 하늘리본</button>
        <button class="chip-btn chip-pink" data-theme="pink">🍓 딸기베어</button>
        <button class="chip-btn chip-yellow" data-theme="yellow">🧸 큐티베어</button>
      </div>

      <canvas id="previewCanvas" width="1200" height="1800"></canvas>

      <div class="modal-buttons">
        <button id="btnPrint" class="btn-modal btn-print">🖨️ 바로 인쇄</button>
        <button id="btnDownload" class="btn-modal btn-download">💾 사진 저장</button>
        <button id="btnClose" class="btn-modal btn-close">다시 찍기</button>
      </div>
    </div>
  </div>

  <!-- 인쇄 대기 팝업 -->
  <div id="loadingModal" class="loading-modal">
    <div class="loading-card">
      <div class="spinner"></div>
      <h2>🖨️ 예쁘게 인쇄하고 있어요!</h2>
      <p>포토프린터에서 사진이 나올 때까지</p>
      <p style="color: #0284c7; font-weight: 800; font-size: 24px;">잠시만 자리에서 기다려주세요! 💖</p>
      <p id="printCountdown" style="font-size: 16px; color: #94a3b8; margin-top: 15px;">(약 12초 후 다음 촬영이 가능합니다)</p>
    </div>
  </div>

  <img id="printTarget" class="print-image" />

  <script>
    const CONFIG = {
      canvasWidth: 1200,
      canvasHeight: 1800,
      photoWidth: 560,
      photoHeight: 765,
      marginLeft: 30,
      marginTop: 35,
      gapX: 20,
      gapY: 25,
      photoRadius: 20,
      countdownSec: 5
    };

    let currentTheme = 'ribbon';
    let brightnessMultiplier = 1.18;
    let userUploadedImage = null; // 사용자가 첨부한 프레임 이미지 객체

    const video = document.getElementById('webcam');
    const btnStart = document.getElementById('btnStart');
    const cutBadge = document.getElementById('cutBadge');
    const countdownEl = document.getElementById('countdown');
    const flash = document.getElementById('flash');
    const modal = document.getElementById('resultModal');
    const loadingModal = document.getElementById('loadingModal');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const printTarget = document.getElementById('printTarget');
    const brightnessRange = document.getElementById('brightnessRange');
    const brightnessVal = document.getElementById('brightnessVal');

    const fileInput = document.getElementById('frameFileInput');
    const btnUploadTrigger = document.getElementById('btnUploadTrigger');

    let audioCtx = null;
    let capturedFrames = [];
    let isRunning = false;

    // 첨부 이미지 파일 로컬스토리지에서 복원
    const savedCustomFrame = localStorage.getItem('gocheok_custom_frame');
    if (savedCustomFrame) {
      userUploadedImage = new Image();
      userUploadedImage.onload = () => {
        if (capturedFrames.length === 4) drawPhotoStrip();
      };
      userUploadedImage.src = savedCustomFrame;
    }

    // 파일 첨부 버튼 클릭 이벤트
    btnUploadTrigger.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          userUploadedImage = img;
          localStorage.setItem('gocheok_custom_frame', event.target.result);
          currentTheme = 'ribbon';
          alert("첨부하신 리본 프레임이 성공적으로 배경으로 적용되었습니다!");
          if (capturedFrames.length === 4) drawPhotoStrip();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 밝기 슬라이더
    function updateVideoFilter() {
      video.style.filter = `brightness(${brightnessMultiplier}) contrast(1.05) saturate(1.05)`;
    }
    brightnessRange.addEventListener('input', (e) => {
      const val = e.target.value;
      brightnessMultiplier = val / 100;
      brightnessVal.innerText = `${val}%`;
      updateVideoFilter();
      if (capturedFrames.length === 4) drawPhotoStrip();
    });

    // 테마 전환
    document.querySelectorAll('.frame-chips').forEach(container => {
      container.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip-btn');
        if (!btn || btn.id === 'btnUploadTrigger') return;
        currentTheme = btn.dataset.theme;

        document.querySelectorAll('.chip-btn').forEach(b => {
          if (b.dataset.theme) b.classList.toggle('active', b.dataset.theme === currentTheme);
        });

        if (capturedFrames.length === 4) drawPhotoStrip();
      });
    });

    function playBeep(freq, duration) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        updateVideoFilter();
      } catch (err) {
        alert("카메라 연결 실패: " + err.message);
      }
    }

    async function startCaptureSequence() {
      if (isRunning) return;
      isRunning = true;
      btnStart.disabled = true;
      capturedFrames = [];
      cutBadge.style.display = 'block';

      for (let cut = 1; cut <= 4; cut++) {
        cutBadge.innerText = `CUT ${cut} / 4`;
        
        for (let sec = CONFIG.countdownSec; sec > 0; sec--) {
          countdownEl.innerText = sec;
          countdownEl.classList.add('show');
          playBeep(sec === 1 ? 950 : 800, 0.15);
          await wait(1000);
          countdownEl.classList.remove('show');
        }

        playBeep(1800, 0.35);
        triggerFlash();
        captureCurrentFrame();
        await wait(600);
      }

      cutBadge.style.display = 'none';
      drawPhotoStrip();
      modal.style.display = 'flex';
      isRunning = false;
      btnStart.disabled = false;
    }

    function captureCurrentFrame() {
      const tempCanvas = document.createElement('canvas');
      const vW = video.videoWidth || 1280;
      const vH = video.videoHeight || 720;

      const targetRatio = CONFIG.photoWidth / CONFIG.photoHeight;
      let sW = vH * targetRatio;
      let sH = vH;
      let sX = (vW - sW) / 2;
      let sY = 0;

      tempCanvas.width = CONFIG.photoWidth;
      tempCanvas.height = CONFIG.photoHeight;
      const tCtx = tempCanvas.getContext('2d');

      tCtx.translate(CONFIG.photoWidth, 0);
      tCtx.scale(-1, 1);
      tCtx.drawImage(video, sX, sY, sW, sH, 0, 0, CONFIG.photoWidth, CONFIG.photoHeight);

      capturedFrames.push(tempCanvas);
    }

    function triggerFlash() {
      flash.style.opacity = '0.95';
      flash.style.transition = 'none';
      setTimeout(() => {
        flash.style.transition = 'opacity 0.4s ease-out';
        flash.style.opacity = '0';
      }, 50);
    }

    // ★ 캔버스 합성 핵심 로직 (배경 -> 사진 -> 텍스트 순서)
    function drawPhotoStrip() {
      ctx.filter = "none";

      // 1단계: 맨 아래 '배경' 그리기
      if (currentTheme === 'ribbon') {
        if (userUploadedImage) {
          // 사용자가 첨부한 리본 이미지를 배경 전체에 꽉 채워 그림
          ctx.drawImage(userUploadedImage, 0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
        } else {
          // 첨부 이미지가 없을 경우 동일한 하늘색 리본 패턴 자동 생성
          drawDefaultRibbonBackground();
        }
      } else if (currentTheme === 'pink') {
        drawColorPatternBackground("#ffeef2", "rgba(255, 175, 195, 0.45)");
      } else if (currentTheme === 'yellow') {
        drawColorPatternBackground("#fff9db", "rgba(255, 236, 153, 0.6)");
      }

      // 2단계: 4컷 사진을 배경 '위에' 올리기
      const col2X = CONFIG.marginLeft + CONFIG.photoWidth + CONFIG.gapX;
      const row2Y = CONFIG.marginTop + CONFIG.photoHeight + CONFIG.gapY;
      const positions = [
        { x: CONFIG.marginLeft, y: CONFIG.marginTop },
        { x: col2X,             y: CONFIG.marginTop },
        { x: CONFIG.marginLeft, y: row2Y },
        { x: col2X,             y: row2Y }
      ];

      capturedFrames.forEach((frameCanvas, index) => {
        const pos = positions[index];
        ctx.save();

        // 둥근 모서리 클리핑
        drawRoundedRectPath(ctx, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight, CONFIG.photoRadius);
        ctx.clip();

        // 뽀샤시 필터 적용
        ctx.filter = `brightness(${brightnessMultiplier}) contrast(1.06) saturate(1.05)`;
        ctx.drawImage(frameCanvas, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight);
        ctx.restore();

        // 사진 테두리 선 (리본 배경과 깔끔하게 구분되도록 화이트+스카이블루 라인 추가)
        ctx.strokeStyle = (currentTheme === 'ribbon') ? "#bce0fd" : "#ffffff";
        ctx.lineWidth = 6;
        drawRoundedRectStroke(ctx, pos.x, pos.y, CONFIG.photoWidth, CONFIG.photoHeight, CONFIG.photoRadius);
      });

      // 3단계: 하단 텍스트 및 카드 렌더링
      const bannerTop = row2Y + CONFIG.photoHeight;
      const bannerCenterY = bannerTop + ((CONFIG.canvasHeight - bannerTop) / 2);

      // 리본 배경 위에서 글씨가 선명하게 보이도록 은은한 화이트 카드 받침대 배치
      ctx.fillStyle = "rgba(255, 255, 255, 0.88)";
      drawRoundedRectPath(ctx, CONFIG.marginLeft + 20, bannerTop + 15, CONFIG.canvasWidth - (CONFIG.marginLeft * 2) - 40, (CONFIG.canvasHeight - bannerTop) - 35, 22);
      ctx.fill();
      ctx.strokeStyle = "#cbe5ff";
      ctx.lineWidth = 3;
      drawRoundedRectStroke(ctx, CONFIG.marginLeft + 20, bannerTop + 15, CONFIG.canvasWidth - (CONFIG.marginLeft * 2) - 40, (CONFIG.canvasHeight - bannerTop) - 35, 22);

      ctx.textAlign = "center";
      
      // 윗줄: ♥2026 고척초등학교 기버데이♥
      ctx.font = "900 45px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
      ctx.fillStyle = (currentTheme === 'pink') ? "#d90429" : (currentTheme === 'yellow') ? "#d97706" : "#0284c7";
      ctx.fillText("♥2026 고척초등학교 기버데이♥", CONFIG.canvasWidth / 2, bannerCenterY - 14);

      // 아랫줄: 2026.11.19
      ctx.font = "800 32px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
      ctx.fillStyle = (currentTheme === 'pink') ? "#ff4d6d" : (currentTheme === 'yellow') ? "#f59e0b" : "#38bdf8";
      ctx.fillText("2026.11.19", CONFIG.canvasWidth / 2, bannerCenterY + 44);
    }

    // 첨부 이미지 미선택 시 기본 그려지는 하늘색 리본 패턴
    function drawDefaultRibbonBackground() {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

      // 은은한 하늘색 리본 및 반짝이 패턴
      ctx.font = "46px sans-serif";
      ctx.textAlign = "center";
      const ribbonPositions = [
        {x: 100, y: 150}, {x: 600, y: 100}, {x: 1100, y: 180},
        {x: 150, y: 550}, {x: 1050, y: 600},
        {x: 80, y: 950},  {x: 600, y: 900}, {x: 1120, y: 1020},
        {x: 120, y: 1450}, {x: 1080, y: 1480}, {x: 600, y: 1520}
      ];

      ribbonPositions.forEach(p => {
        ctx.fillStyle = "rgba(165, 216, 255, 0.85)";
        ctx.fillText("🎀", p.x, p.y);
      });
    }

    function drawColorPatternBackground(bg, dotColor) {
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
      ctx.fillStyle = dotColor;
      for (let x = 15; x < CONFIG.canvasWidth; x += 45) {
        for (let y = 15; y < CONFIG.canvasHeight; y += 45) {
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawRoundedRectPath(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawRoundedRectStroke(ctx, x, y, width, height, radius) {
      drawRoundedRectPath(ctx, x, y, width, height, radius);
      ctx.stroke();
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    btnStart.addEventListener('click', startCaptureSequence);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isRunning && modal.style.display !== 'flex' && loadingModal.style.display !== 'flex') {
        e.preventDefault();
        startCaptureSequence();
      }
    });

    document.getElementById('btnPrint').addEventListener('click', () => {
      printTarget.src = canvas.toDataURL('image/png');
      modal.style.display = 'none';
      loadingModal.style.display = 'flex';

      setTimeout(() => {
        window.print();
      }, 300);

      let remain = 12;
      const countLabel = document.getElementById('printCountdown');
      const timer = setInterval(() => {
        remain--;
        countLabel.innerText = `(약 ${remain}초 후 다음 촬영이 가능합니다)`;
        if (remain <= 0) {
          clearInterval(timer);
          loadingModal.style.display = 'none';
        }
      }, 1000);
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `고척초_기버데이_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    document.getElementById('btnClose').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    initCamera();
  </script>
</body>
</html>
