<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고척초등학교 기버데이 인생네컷</title>
  
  <style>
    /* 글씨체: 카페24 슈퍼매직체 하나만 사용 (앱 폴더의 fonts/ 파일이라 인터넷이 없어도 똑같이 나옴) */
    @font-face {
      font-family: 'Cafe24Supermagic';
      src: url('fonts/Cafe24Supermagic-Bold.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 10px 0;
      background-color: #ffffff;
      color: #222222;
      font-family: 'Cafe24Supermagic', sans-serif !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      font-size: 32px;
      margin-bottom: 8px;
      color: #e6a800;
      text-shadow: 0 2px 6px rgba(0,0,0,0.15);
      font-family: 'Cafe24Supermagic', sans-serif !important;
      letter-spacing: 0.5px;
    }

    /* 상단 패널 (밝기 + 색감) */
    .top-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 22px;
      margin-bottom: 12px;
      background: #282838;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 40px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
    }

    button, .chip-btn, .btn-main, .btn-sub, .btn-modal {
      font-family: 'Cafe24Supermagic', sans-serif !important;
    }

    .chip-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .chip-btn {
      border: 2px solid transparent;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .chip-btn.active {
      border-color: #ffde59;
      transform: scale(1.06);
      box-shadow: 0 0 10px rgba(255, 222, 89, 0.7);
    }

    .theme-school   { background: #fff0d9; color: #b25000; }
    .theme-space    { background: #e0e0ff; color: #3b3f8f; }
    .theme-animals  { background: #f3d9fa; color: #862e9c; }
    .theme-heart    { background: #ffe3ec; color: #d6336c; }




    /* 색감 선택 버튼 */
    .chip-btn.tone-soft    { background: #fff0f6; color: #d6336c; }
    .chip-btn.tone-film    { background: #fff4e6; color: #a15c00; }
    .chip-btn.tone-mono    { background: #f1f3f5; color: #343a40; }
    .chip-btn.tone-natural { background: #e7f5ff; color: #1971c2; }

    input[type=range] {
      width: 100px;
      accent-color: #ffde59;
      cursor: pointer;
    }

    /* 세로형 뷰어 부스 */
    .booth-container {
      position: relative;
      width: 440px;
      height: 600px;
      background: #000;
      border-radius: 0;   /* 모서리를 둥글지 않게 */
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,0.8);
      border: 5px solid #3c3c52;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      transition: filter 0.1s;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .cut-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #38d9a9;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 20px;
      display: none;
    }

    .countdown-text {
      font-size: 150px;
      color: #ff2a5f;
      text-shadow: 0 0 30px rgba(0,0,0,0.9);
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.25s ease-out;
    }

    .countdown-text.show {
      opacity: 1;
      transform: scale(1.15);
    }

    .flash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    /* 세로 / 가로 고르기 (촬영 시작 버튼 옆) */
    .orient {
      display: flex;
      background: #334155;
      border-radius: 40px;
      padding: 4px;
      gap: 4px;
    }
    .orient-btn {
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 17px;
      padding: 9px 18px;
      border-radius: 36px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .orient-btn.active { background: #ffde59; color: #3b2f00; }
    .orient-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 가로 모드: 촬영 화면과 미리보기가 가로 모양으로 바뀜 */
    body.landscape .booth-container { width: 600px; height: 440px; }
    body.landscape #previewCanvas {
      aspect-ratio: 3 / 2;   /* 세로용 2/3 비율이 남아 있으면 팝업이 화면 밖으로 넘쳐서 버튼이 안 보임 */
      height: auto;
      width: clamp(300px, calc((100vh - 200px) * 1.5), 600px);
    }

    .btn-main {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 13px 45px;
      font-size: 22px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(3, 105, 161, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-main:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.7);
    }

    .btn-main:disabled {
      background: #555;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-sub {
      background: #475569;
      color: white;
      border: none;
      padding: 13px 22px;
      font-size: 17px;
      border-radius: 40px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-sub:hover { background: #64748b; }

    /* 결과 & 배경 미리보기 모달 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.92);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    .modal-content {
      background: #252533;
      padding: 20px 26px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }

    #previewCanvas {
      /* 촬영 화면(높이 600px)과 같은 크기로 보이게. 화면이 작으면 그에 맞춰 줄어듦 (2:3 비율 유지) */
      height: clamp(280px, calc(100vh - 200px), 600px);
      width: auto;
      aspect-ratio: 2 / 3;
      background: white;
      border-radius: 0;   /* 모서리를 둥글지 않게 */
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-modal {
      border: none;
      padding: 10px 22px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      color: white;
    }

    .btn-print { background: #0284c7; }
    .btn-print:hover { background: #0369a1; }
    .btn-close { background: #e11d48; }
    .btn-close:hover { background: #be123c; }

    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .modal-head { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .modal-title { margin: 0; font-size: 18px; color: #f1f5f9; text-align: center; }

    @page { size: 4in 6in; margin: 0; }
    /* 인쇄용 장수만큼의 이미지 (화면에서는 숨김) */
    #printArea { display: none; }
    .copies {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .copies-label { font-size: 16px; color: #e2e8f0; margin-right: 4px; }
    .copies-btn { background: #ffffff; color: #334155; min-width: 52px; }

    @media print {
      /* 인쇄할 이미지(장수만큼)만 남기고 화면의 나머지는 모두 숨김 */
      body { display: block; margin: 0; padding: 0; background: #ffffff; }
      body > *:not(#printArea) { display: none !important; }
      #printArea { display: block !important; }
      .print-page {
        display: block;
        width: 4in;
        height: 6in;
        object-fit: fill;
        break-after: page;
        page-break-after: always;
      }
      .print-page:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
<body>

  <header>★ 고척초등학교 기버데이 포토부스 ★</header>

  <!-- 상단 패널: 밝기 + 색감 선택 -->
  <div class="top-panel">
    <div class="option-group">
      <span>☀️ 밝기:</span>
      <input type="range" id="brightnessRange" min="100" max="150" value="118">
      <span id="brightnessVal">118%</span>
    </div>
    <div class="option-group">
      <span>🎨 색감:</span>
      <div class="chip-group" id="toneChips">
        <button class="chip-btn tone-soft" data-tone="soft">뽀송</button>
        <button class="chip-btn tone-film" data-tone="film">필름</button>
        <button class="chip-btn tone-mono" data-tone="mono">흑백</button>
        <button class="chip-btn tone-natural active" data-tone="natural">자연</button>
      </div>
    </div>
  </div>

  <div class="booth-container">
    <video id="webcam" autoplay playsinline></video>
    <div class="overlay">
      <div id="cutBadge" class="cut-badge">CUT 1 / 2</div>
      <div id="countdown" class="countdown-text">5</div>
    </div>
    <div id="flash" class="flash-screen"></div>
  </div>

  <!-- 2번 요구사항: [배경 미리보기] 버튼 -->
  <div class="controls">
    <button id="btnStart" class="btn-main">📸 촬영 시작 (Space)</button>
    <div class="orient" role="group" aria-label="사진 방향 고르기">
      <button type="button" class="orient-btn active" data-orient="portrait" aria-pressed="true">▯ 세로</button>
      <button type="button" class="orient-btn" data-orient="landscape" aria-pressed="false">▭ 가로</button>
    </div>
    <button id="btnPreview" class="btn-sub">🔍 배경 미리보기</button>
  </div>

  <!-- 결과 & 배경 선택/미리보기 모달 -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <!-- 사진을 찍기 전(배경만 보기)과 찍은 뒤(인쇄)에 안내 문구와 버튼이 달라짐 -->
      <div class="modal-head">
        <p id="modalTitle" class="modal-title"></p>
        <!-- 사진을 찍기 전(배경 미리보기)에만 보임. 찍은 뒤에는 방향을 바꾸면 사진이 지워지므로 숨김 -->
        <div id="modalOrient" class="orient" role="group" aria-label="사진 방향 고르기">
          <button type="button" class="orient-btn active" data-orient="portrait" aria-pressed="true">▯ 세로</button>
          <button type="button" class="orient-btn" data-orient="landscape" aria-pressed="false">▭ 가로</button>
        </div>
      </div>
      <!-- 팝업 내부에서 원하는 배경을 클릭해 전환 -->
      <div class="option-group" style="margin-bottom: 2px;">
        <span style="font-size: 16px; color: #e2e8f0;">🎨 배경 선택:</span>
        <div class="chip-group" id="modalThemeChips">
          <button class="chip-btn theme-school active" data-theme="school">🎁 기버데이</button>
          <button class="chip-btn theme-space" data-theme="space">🚀 우주</button>
          <button class="chip-btn theme-animals" data-theme="animals">🐾 동물</button>
          <button class="chip-btn theme-heart" data-theme="heart">💖 하트</button>
        </div>
      </div>

      <canvas id="previewCanvas" width="1200" height="1800"></canvas>

      <!-- 인쇄할 장수 고르기 (종이 한 장을 반으로 잘라 두 명이 나눠 가져요) -->
      <div class="copies" role="group" aria-label="인쇄 장수">
        <span class="copies-label">🖨️ 인쇄 장수</span>
        <button type="button" class="chip-btn copies-btn active" data-copies="1" aria-pressed="true">1장</button>
        <button type="button" class="chip-btn copies-btn" data-copies="2" aria-pressed="false">2장</button>
        <button type="button" class="chip-btn copies-btn" data-copies="3" aria-pressed="false">3장</button>
        <button type="button" class="chip-btn copies-btn" data-copies="4" aria-pressed="false">4장</button>
        <button type="button" class="chip-btn copies-btn" data-copies="5" aria-pressed="false">5장</button>
      </div>

      <div class="modal-buttons">
        <button id="btnPrint" class="btn-modal btn-print">🖨️ 바로 인쇄</button>
        <button id="btnClose" class="btn-modal btn-close">닫기</button>
      </div>
    </div>
  </div>

  <div id="printArea" aria-hidden="true"></div>

  <script>
    const CONFIG = {
      canvasWidth: 1200,
      canvasHeight: 1800,
      photoWidth: 485,
      photoHeight: 655,
      marginLeft: 57.5,  // 세로 반 컷 시 각 반쪽(600px)에서 좌우 여백 동일: (600-485)/2
      marginTop: 90,
      gapY: 40,
      cutCount: 2,       // 촬영 횟수 (2번 찍어서 윗줄/아랫줄에 같은 사진 배치)
      countdownSec: 5
    };

    // 글씨체는 카페24 슈퍼매직체 하나로 통일 (화면, 인쇄물 하단 문구 모두)
    const APP_FONT = "'Cafe24Supermagic', sans-serif";

    let currentTheme = 'school';
    let brightnessMultiplier = 1.18;
    let currentTone = 'natural';

    // 색감 프리셋 (행사 중 버튼으로 바로 바꿀 수 있음)
    const TONES = {
      soft:    'saturate(1.08) brightness(1.05) contrast(1.02)',
      film:    'sepia(0.28) saturate(0.92) contrast(1.06) brightness(1.04)',
      mono:    'grayscale(1) contrast(1.08) brightness(1.03)',
      natural: ''
    };

    function photoFilter() {
      return `brightness(${brightnessMultiplier}) contrast(1.05) saturate(1.05) ${TONES[currentTone] || ''}`.trim();
    }

    // 학교 로고
    // 1) LOGO_DATA_URL 에 base64 문자열이 있으면 그것을 사용 (파일 하나로 배포 가능, 인쇄/저장 안전)
    // 2) 비어 있으면 같은 폴더의 logo.png 를 읽음
    const LOGO_DATA_URL = '';
    const schoolLogo = new Image();
    let logoLoaded = false;
    schoolLogo.onload = () => { logoLoaded = true; drawPhotoStrip(); };
    schoolLogo.onerror = () => { logoLoaded = false; };
    schoolLogo.src = LOGO_DATA_URL || 'logo.png';

    const video = document.getElementById('webcam');
    const btnStart = document.getElementById('btnStart');
    const btnPreview = document.getElementById('btnPreview');
    const cutBadge = document.getElementById('cutBadge');
    const countdownEl = document.getElementById('countdown');
    const flash = document.getElementById('flash');
    const modal = document.getElementById('resultModal');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const printArea = document.getElementById('printArea');
    const brightnessRange = document.getElementById('brightnessRange');
    const brightnessVal = document.getElementById('brightnessVal');

    let audioCtx = null;
    let capturedFrames = [];
    let capturedOrientation = 'portrait';   // 찍을 때의 방향 (방향을 바꾸면 이전 사진은 지움)
    let orientation = 'portrait';           // 'portrait'(세로 4×6) | 'landscape'(가로 6×4)

    // 가로 프레임 오른쪽 빈 자리의 문구 위치(위쪽 반 기준. 아래쪽 반은 600px 아래에 똑같이)
    //  cx,cy = 문구 3줄의 가운데, width = 글씨가 넘지 않아야 하는 폭
    const LANDSCAPE_TEXT = {
      school:  { cx: 1600, cy: 305, width: 330 },   // 깃발·풍선(위)과 가게·선물(아래) 사이
      space:   { cx: 1595, cy: 300, width: 330 },   // 행성(위)과 로켓·토끼(아래) 사이
      animals: { cx: 1595, cy: 318, width: 330 },   // 나뭇가지(위)와 동물들(아래) 사이
      heart:   { cx: 1605, cy: 300, width: 250 }    // 하트 타원 안쪽 (폭이 좁음)
    };

    // 방향별 그림 배치. 가로는 세로 프레임의 사진 크기(485×655)를 눕힌 655×485 로 쓰고,
    // 종이를 위아래로 반 잘라 두 명이 나눠 가짐 (반쪽마다 사진 2장 + 오른쪽에 문구 3줄)
    function getLayout() {
      if (orientation === 'landscape') {
        const pw = CONFIG.photoHeight, ph = CONFIG.photoWidth;       // 655 x 485
        const W = CONFIG.canvasHeight, H = CONFIG.canvasWidth;       // 1800 x 1200
        const m = (H / 2 - ph) / 2;                                  // 위아래 여백 57.5 (반으로 잘라도 같음)
        // 가로 프레임의 점선 안내선(왼쪽 x20 · 가운데 x728)에 맞춰 사진을 놓음: 왼쪽 여백 33, 두 사진 사이 40
        const xA = 53, xB = 748;
        const y0 = m, y1 = H / 2 + m;
        // 프레임 오른쪽의 빈 자리(그림과 그림 사이) 가운데에 문구를 넣음. 테마마다 빈 자리가 조금씩 달라서 따로 정함
        const t = LANDSCAPE_TEXT[currentTheme] || LANDSCAPE_TEXT.school;
        return {
          landscape: true, W, H, pw, ph,
          positions: [{ x: xA, y: y0 }, { x: xB, y: y0 }, { x: xA, y: y1 }, { x: xB, y: y1 }],
          photoMap: [0, 1, 0, 1],
          banner: [{ cx: t.cx, cy: t.cy }, { cx: t.cx, cy: t.cy + H / 2 }],
          textWidth: t.width
        };
      }
      const pw = CONFIG.photoWidth, ph = CONFIG.photoHeight;
      const W = CONFIG.canvasWidth, H = CONFIG.canvasHeight;
      const col2X = W / 2 + CONFIG.marginLeft;
      const row2Y = CONFIG.marginTop + ph + CONFIG.gapY;
      return {
        landscape: false, W, H, pw, ph,
        positions: [
          { x: CONFIG.marginLeft, y: CONFIG.marginTop }, { x: col2X, y: CONFIG.marginTop },
          { x: CONFIG.marginLeft, y: row2Y },            { x: col2X, y: row2Y }
        ],
        photoMap: [0, 0, 1, 1],
        banner: [{ cx: CONFIG.marginLeft + pw / 2 }, { cx: col2X + pw / 2 }],
        textWidth: 330
      };
    }

    // 세로 / 가로 고르기
    function setOrientation(o) {
      if (isRunning || o === orientation) return;
      orientation = o;
      capturedFrames = [];                       // 방향이 다른 이전 사진은 지움
      document.body.classList.toggle('landscape', o === 'landscape');
      syncOrientButtons();
      drawPhotoStrip();
    }
    // 화면의 세로/가로 버튼과 팝업 안의 세로/가로 버튼을 같은 상태로 맞춤
    function syncOrientButtons() {
      document.querySelectorAll('.orient-btn').forEach(b => {
        const on = b.dataset.orient === orientation;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', String(on));
      });
    }
    document.querySelectorAll('.orient').forEach(group => group.addEventListener('click', (e) => {
      const b = e.target.closest('.orient-btn');
      if (b) setOrientation(b.dataset.orient);
    }));
    function lockOrientButtons(lock) {

    function playBeep(freq, duration) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // 카메라가 연결되지 않아도 촬영할 수 있도록, 안 될 때는 안내 없이 까만 화면을 대신 씀
    let blackAnimId = 0;
    function cameraIsLive() {
      const s = video.srcObject;
      return !!s && s.getVideoTracks().some(t => t.readyState === 'live');
    }
    function stopCurrentSource() {
      cancelAnimationFrame(blackAnimId);
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
    }
    function useBlackScreen() {
      stopCurrentSource();
      const c = document.createElement('canvas');
      c.width = 1280; c.height = 720;
      const g = c.getContext('2d');
      const draw = () => {
        g.fillStyle = '#000000';
        g.fillRect(0, 0, c.width, c.height);
        blackAnimId = requestAnimationFrame(draw);
      };
      draw();
      video.srcObject = c.captureStream(30);
      video.play().catch(() => {});
      updateVideoFilter();
    }
    let usingBlack = false;
    async function initCamera() {
      try {
        stopCurrentSource();
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
        usingBlack = false;
        updateVideoFilter();
        // 촬영 중간에 카메라가 빠지면 까만 화면으로 바꿈
        stream.getVideoTracks().forEach(t => t.addEventListener('ended', () => {
          usingBlack = true;
          useBlackScreen();
        }));
      } catch (err) {
        usingBlack = true;
        useBlackScreen();
      }
    }
    // 카메라를 나중에 꽂으면 저절로 다시 연결
    if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
      navigator.mediaDevices.addEventListener('devicechange', () => { if (usingBlack && !isRunning) initCamera(); });
    }

    async function startCaptureSequence() {
      if (isRunning) return;
      if (!cameraIsLive()) { usingBlack = true; useBlackScreen(); }
      isRunning = true;
      btnStart.disabled = true;
      lockOrientButtons(true);
      capturedFrames = [];
      capturedOrientation = orientation;
      cutBadge.style.display = 'block';

      for (let cut = 1; cut <= CONFIG.cutCount; cut++) {
        cutBadge.innerText = `CUT ${cut} / ${CONFIG.cutCount}`;
        
        for (let sec = CONFIG.countdownSec; sec > 0; sec--) {
          countdownEl.innerText = sec;
          countdownEl.classList.add('show');
          playBeep(sec === 1 ? 950 : 800, 0.15);
          await wait(1000);
          countdownEl.classList.remove('show');
        }

        playBeep(1800, 0.35);
        triggerFlash();
        captureCurrentFrame();
        await wait(600);
      }

      cutBadge.style.display = 'none';
      openModal();
      isRunning = false;
      btnStart.disabled = false;
      lockOrientButtons(false);
    }

    function captureCurrentFrame() {
      const tempCanvas = document.createElement('canvas');
      const vW = video.videoWidth || 1280;
      const vH = video.videoHeight || 720;

      // 방향에 맞는 사진 크기 (세로 485×655 / 가로 655×485)
      const L = getLayout();
      const targetRatio = L.pw / L.ph;
      let sW = vH * targetRatio;
      let sH = vH;
      if (sW > vW) { sW = vW; sH = vW / targetRatio; }
      const sX = (vW - sW) / 2;
      const sY = (vH - sH) / 2;

      tempCanvas.width = L.pw;
      tempCanvas.height = L.ph;
      const tCtx = tempCanvas.getContext('2d');

      tCtx.translate(L.pw, 0);
      tCtx.scale(-1, 1);
      tCtx.drawImage(video, sX, sY, sW, sH, 0, 0, L.pw, L.ph);

      capturedFrames.push(tempCanvas);
    }

    function triggerFlash() {
      flash.style.opacity = '0.95';
      flash.style.transition = 'none';
      setTimeout(() => {
        flash.style.transition = 'opacity 0.4s ease-out';
        flash.style.opacity = '0';
      }, 50);
    }

    // ==========================================
    // 손그림 드로잉 함수
    // ==========================================
    function drawDoodleHeart(ctx, x, y, size = 38, angle = 0, color = "#ff7597") {
      ctx.save();
      ctx.translate(x, y - (size * 0.45));
      ctx.rotate(angle * Math.PI / 180);
      ctx.strokeStyle = color;
      ctx.fillStyle = "rgba(255, 240, 245, 0.65)";
      ctx.lineWidth = 4.8;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();
      const topCurveHeight = size * 0.32;
      ctx.moveTo(0, topCurveHeight);
      ctx.bezierCurveTo(0, -2, -size / 1.8, -2, -size / 1.8, topCurveHeight);
      ctx.bezierCurveTo(-size / 1.8, (size + topCurveHeight) / 1.8, 0, (size + topCurveHeight) / 1.4, 0, size);
      ctx.bezierCurveTo(0, (size + topCurveHeight) / 1.4, size / 1.8, (size + topCurveHeight) / 1.8, size / 1.8, topCurveHeight);
      ctx.bezierCurveTo(size / 1.8, -2, 0, -2, 0, topCurveHeight);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = "rgba(255, 117, 151, 0.5)";
      ctx.lineWidth = 2.5;
      ctx.arc(-size*0.2, topCurveHeight*0.8, 4, 0, Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function drawDoodlePartyItem(ctx, x, y, type, color, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.strokeStyle = color;
      ctx.lineWidth = 4.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (type === 'star') {
      } else if (type === 'star') {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.quadraticCurveTo(0, 0, 20, 0);
        ctx.quadraticCurveTo(0, 0, 0, 20);
        ctx.quadraticCurveTo(0, 0, -20, 0);
        ctx.quadraticCurveTo(0, 0, 0, -20);
        ctx.fill();

      } else if (type === 'gift') {
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.beginPath();
        ctx.rect(-16, -4, 32, 24);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.rect(-20, -12, 40, 9);
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, -12); ctx.lineTo(0, 20);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-8, -16, 6, -0.2, Math.PI * 1.2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(8, -16, 6, Math.PI * 1.8, Math.PI * 3.2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawDoodleAnimal(ctx, x, y, type, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.strokeStyle = "#7c5335";
      ctx.lineWidth = 4.2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.fillStyle = "#ffffff";

      if (type === 'bear') {
        ctx.beginPath(); ctx.arc(-19, -16, 9.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(19, -16, 9.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 2, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#7c5335";
        ctx.beginPath(); ctx.arc(-8, 0, 2.8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, 0, 2.8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, 8, 4.5, 3.5, 0, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = "#ffb3c1";

      } else if (type === 'bunny') {
        ctx.beginPath(); ctx.ellipse(-9, -20, 6.5, 17, -0.15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(9, -20, 6.5, 17, 0.15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 4, 22, 0, Math.PI*2); ctx.fill(); ctx.stroke();

          ctx.fillStyle = "#ffffff";
          ctx.fill(); ctx.stroke();

    // 학교 로고 그리기 (로고 파일이 없으면 아무것도 그리지 않음)
    function drawSchoolLogo(ctx, centerX) {

    // ==========================================
    // 색연필 질감 도우미
    // ==========================================
    // 매번 똑같은 그림이 나오도록 '정해진 순서의 난수'를 사용
    function seededRandom(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    let bgLayer = null;
    let grainLayer = null;

    function getBgLayer() {
      if (!bgLayer) {
        bgLayer = document.createElement('canvas');
        bgLayer.width = CONFIG.canvasWidth;
        bgLayer.height = CONFIG.canvasHeight;
      }
      return bgLayer.getContext('2d');
    }

    // 종이 결처럼 군데군데 비는 '알갱이' (한 번만 만들어 재사용)
    function getGrain() {
      if (grainLayer) return grainLayer;
      grainLayer = document.createElement('canvas');
      grainLayer.width = CONFIG.canvasWidth;
      grainLayer.height = CONFIG.canvasHeight;
      const gctx = grainLayer.getContext('2d');
      const img = gctx.createImageData(grainLayer.width, grainLayer.height);
      const rnd = seededRandom(2026);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = rnd();
        img.data[i + 3] = v < 0.28 ? 210 : (v < 0.45 ? 90 : 0);
      }
      gctx.putImageData(img, 0, 0);
      return grainLayer;
    }

    // 그려 둔 배경 레이어에 알갱이 구멍을 내고, 살짝 어긋나게 두 번 겹쳐 '손으로 덧칠한' 느낌을 냄
    function compositePencilLayer() {
      const lctx = bgLayer.getContext('2d');
      lctx.globalCompositeOperation = 'destination-out';
      lctx.drawImage(getGrain(), 0, 0);
      lctx.globalCompositeOperation = 'source-over';

      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.drawImage(bgLayer, 0, 0);
      ctx.globalAlpha = 0.5;
      ctx.drawImage(bgLayer, 1.6, -1.2);
      ctx.restore();
    }

    // ==========================================
    // 캔버스 렌더링
    // ==========================================
    // ==========================================
    // 하단 장면(구름·언덕 + 큼직한 캐릭터)
    // ==========================================
    const SCENES = {
      school:  { paper: "#fffdf6", sky: "#ffe7c2", back: "#fff4de", front: "#ffd69a", line: "#9c5a12", spark: "#e8a33d",
                 main: "#b25000", sub: "#e8a33d" },
      space:   { paper: "#1d2152", sky: "#4a3f9a", back: "#3a3f94", front: "#5b4fb0", line: "#c9ccff", spark: "#ffd43b",
                 main: "#ffffff", sub: "#ffd43b" },
      animals: { paper: "#fcfaf7", sky: "#e6efd2", back: "#f6efdf", front: "#cfe3a8", line: "#6b4a2e", spark: "#ffc048",
                 main: "#5c3d2e", sub: "#8b5e3c" },
      heart:   { paper: "#fff9fb", sky: "#ffd6e2", back: "#fff0f4", front: "#ffc2d4", line: "#c2255c", spark: "#ff7597",
                 main: "#d6336c", sub: "#f783ac" }
    };

    // 폭 300px 주기로 반복되는 뭉게구름 띠 (가운데로 반 잘라도 양쪽이 똑같음)
    function cloudBank(c, top, radii, fill, line, lw) {
      const W = CONFIG.canvasWidth, H = CONFIG.canvasHeight;
      const step = 300 / radii.length;
      const circles = [];
      for (let i = 0, x = -step; x < W + step; i++, x += step) {
        const r = radii[((i % radii.length) + radii.length) % radii.length];
        circles.push([x + step / 2, top + r, r]);
      }
      c.save();
      c.strokeStyle = line; c.lineWidth = lw * 2; c.lineJoin = "round";
      circles.forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke(); });
      c.fillStyle = fill;
      circles.forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); });
      c.fillRect(0, top + Math.max(...radii), W, H);
      c.restore();
    }

    function drawSparkle(c, x, y, r, color) {
      c.save();
      c.translate(x, y);
      c.fillStyle = color;
      c.beginPath();
      c.moveTo(0, -r);
      c.quadraticCurveTo(0, 0, r, 0);
      c.quadraticCurveTo(0, 0, 0, r);
      c.quadraticCurveTo(0, 0, -r, 0);
      c.quadraticCurveTo(0, 0, 0, -r);
      c.fill();
      c.restore();
    }

    // 로켓 (x,y = 몸통 중심)
    function drawDoodleRocket(c, x, y, s, line) {
      c.save();
      c.translate(x, y);
      c.scale(s, s);
      c.strokeStyle = line; c.lineWidth = 3.4 / Math.sqrt(s); c.lineJoin = "round"; c.lineCap = "round";
      // 불꽃
      c.fillStyle = "#ffa94d";
      c.beginPath(); c.moveTo(-10, 40); c.quadraticCurveTo(0, 78, 10, 40); c.closePath(); c.fill(); c.stroke();
      // 날개
      c.fillStyle = "#ff6b6b";
      c.beginPath(); c.moveTo(-18, 14); c.lineTo(-38, 44); c.lineTo(-16, 38); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(18, 14); c.lineTo(38, 44); c.lineTo(16, 38); c.closePath(); c.fill(); c.stroke();
      // 몸통
      c.fillStyle = "#ffffff";
      c.beginPath();
      c.moveTo(0, -56);
      c.bezierCurveTo(30, -30, 24, 18, 18, 42);
      c.lineTo(-18, 42);
      c.bezierCurveTo(-24, 18, -30, -30, 0, -56);
      c.closePath(); c.fill(); c.stroke();
      // 코
      c.fillStyle = "#ff6b6b";
      c.beginPath(); c.moveTo(0, -56); c.bezierCurveTo(14, -44, 18, -36, 19, -30); c.lineTo(-19, -30); c.bezierCurveTo(-18, -36, -14, -44, 0, -56); c.closePath(); c.fill(); c.stroke();
      // 창문
      c.fillStyle = "#a5d8ff";
      c.beginPath(); c.arc(0, -8, 10, 0, Math.PI * 2); c.fill(); c.stroke();
      c.restore();
    }

    // 고리 있는 행성
    function drawDoodlePlanet(c, x, y, s, line, body) {
      c.save();
      c.translate(x, y);
      c.scale(s, s);
      c.strokeStyle = line; c.lineWidth = 3.4 / Math.sqrt(s); c.lineJoin = "round"; c.lineCap = "round";
      c.fillStyle = body;
      c.beginPath(); c.arc(0, 0, 32, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = "rgba(255,255,255,0.35)";
      c.beginPath(); c.arc(-10, -10, 8, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(12, 10, 5, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.ellipse(0, 4, 54, 12, -0.3, 0, Math.PI * 2); c.stroke();
      c.restore();
    }

    // 큼직하게 키운 기존 낙서 그림 (center 기준)
    function bigDoodle(c, x, y, s, fn) {
      c.save(); c.translate(x, y); c.scale(s, s); fn(c); c.restore();
    }

    // 사진 아래 하단 장면. 가운데 세로 컷 기준 양쪽 반쪽에 똑같이 그림
    function drawBottomScene(c, theme) {
      const sc = SCENES[theme] || SCENES.school;

      // 우주: 여백 곳곳에 별
      if (theme === 'space') {
        const stars = [[22, 40, 9], [1178, 60, 11], [300, 36, 8], [900, 30, 9], [28, 460, 8], [1174, 420, 9],
                       [600, 770, 10], [28, 900, 9], [1172, 1000, 8], [600, 1100, 10], [26, 1300, 9], [1174, 1250, 10]];
        stars.forEach(([x, y, r]) => drawSparkle(c, x, y, r, sc.spark));
      }

      // 반짝이
      [0, 600].forEach(ox => {
        [[38, 1492, 13], [562, 1478, 16], [190, 1504, 8], [410, 1498, 9]].forEach(([x, y, r]) =>
          drawSparkle(c, ox + x, y, r, sc.spark));
      });

      // 뒤쪽 구름(글씨 뒤 배경) → 캐릭터 → 앞쪽 구름 순서
      cloudBank(c, 1520, [44, 38, 50, 40], sc.back, sc.line, 3.5);

      const baseY = 1735;     // 캐릭터 발 위치(앞 구름에 살짝 가려짐)
      const L = 90, R = 510;  // 반쪽(600px) 안에서 캐릭터 가로 위치
      [0, 600].forEach(ox => {
        const xl = ox + L, xr = ox + R;
        if (theme === 'school') {
          bigDoodle(c, xl, baseY - 64, 2.8, k => drawDoodlePartyItem(k, 0, 0, 'gift', '#e57373', -6));
          bigDoodle(c, xr, baseY - 64, 2.8, k => drawDoodlePartyItem(k, 0, 0, 'gift', '#4dabf7', 6));
          drawSparkle(c, xl + 62, baseY - 130, 15, '#e8a33d');
          drawSparkle(c, xr - 62, baseY - 126, 15, '#b197fc');
        } else if (theme === 'space') {
          drawDoodleRocket(c, xl, baseY - 74, 1.35, sc.line);
          drawDoodlePlanet(c, xr, baseY - 62, 1.35, sc.line, '#ffa94d');
          drawSparkle(c, xl + 56, baseY - 150, 13, sc.spark);
          drawSparkle(c, xr - 58, baseY - 140, 13, sc.spark);
        } else if (theme === 'animals') {
          bigDoodle(c, xl, baseY - 64, 2.3, k => drawDoodleAnimal(k, 0, 0, 'bear', 0));
          bigDoodle(c, xr, baseY - 72, 2.3, k => drawDoodleAnimal(k, 0, 0, 'bunny', 0));
          drawDoodleAnimal(c, xl + 68, baseY - 120, 'flower', 0);
          drawDoodleAnimal(c, xr - 66, baseY - 112, 'flower', 0);
        } else if (theme === 'heart') {
          drawDoodleHeart(c, xl, baseY - 20, 88, -10, '#ff7597');
          drawDoodleHeart(c, xr, baseY - 20, 76, 10, '#ff5c8a');
          drawDoodleHeart(c, xl + 66, baseY - 130, 36, 14, '#ffa2b8');
          drawDoodleHeart(c, xr - 62, baseY - 118, 32, -14, '#ff8fab');
        }
      });

      cloudBank(c, 1738, [34, 30, 38, 32], sc.front, sc.line, 3.5);
    }

    // ==========================================
    // 프레임 사진: frames/ 폴더의 파일을 테마마다 자동으로 사용 (1200x1800, 2:3)
    //  - 사진 칸 위치: 왼쪽 x57.5 / 오른쪽 x657.5, 위 y90 / 아래 y785, 크기 485x655
    //  - 프레임 파일이 없거나 안 열리면 코드로 그린 기본 그림이 대신 나옴
    // ==========================================
    const FRAME_FILES = {
      school:  'frames/school.webp',   // 기버데이
      space:   'frames/space.webp',    // 우주
      animals: 'frames/animals.webp',  // 동물
      heart:   'frames/heart.webp'     // 하트
    };
    const frameImages = {};
    Object.keys(FRAME_FILES).forEach(theme => {
      const img = new Image();
      img.onload = () => { frameImages[theme] = img; drawPhotoStrip(); };
      img.src = FRAME_FILES[theme];
    });

    // 가로(1800x1200) 프레임: frames/ 폴더의 <테마>_landscape.webp 를 자동으로 사용
    const FRAME_FILES_LANDSCAPE = {
      school:  'frames/school_landscape.webp',
      space:   'frames/space_landscape.webp',
      animals: 'frames/animals_landscape.webp',
      heart:   'frames/heart_landscape.webp'
    };
    const frameImagesLandscape = {};
    Object.keys(FRAME_FILES_LANDSCAPE).forEach(theme => {
      const img = new Image();
      img.onload = () => { frameImagesLandscape[theme] = img; drawPhotoStrip(); };
      img.src = FRAME_FILES_LANDSCAPE[theme];
    });

    function drawPhotoStrip() {
      const L = getLayout();
      if (canvas.width !== L.W || canvas.height !== L.H) { canvas.width = L.W; canvas.height = L.H; }
      ctx.filter = "none";

      const frameImg = (L.landscape ? frameImagesLandscape : frameImages)[currentTheme];
      const scene = SCENES[currentTheme] || SCENES.school;

      if (frameImg) {
        // 내 프레임 사진을 배경 전체로 사용
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, L.W, L.H);
        ctx.drawImage(frameImg, 0, 0, L.W, L.H);
      } else if (L.landscape) {
        // 가로 프레임 파일이 없을 때: 테마 색의 단순한 배경
        const g = ctx.createLinearGradient(0, 0, 0, L.H);
        g.addColorStop(0, scene.paper);
        g.addColorStop(1, scene.sky);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, L.W, L.H);
      } else {
        // 세로 기본 그림 (프레임 파일이 없을 때): 색연필 질감 레이어에 그림
        const bgCtx = getBgLayer();
        bgCtx.clearRect(0, 0, L.W, L.H);
        drawBottomScene(bgCtx, currentTheme);
        ctx.fillStyle = scene.paper;
        ctx.fillRect(0, 0, L.W, L.H);
        const g = ctx.createLinearGradient(0, 1250, 0, L.H);
        g.addColorStop(0, scene.paper);
        g.addColorStop(1, scene.sky);
        ctx.fillStyle = g;
        ctx.fillRect(0, 1250, L.W, L.H - 1250);
        compositePencilLayer();
      }

      const hasRealPhotos = hasPhotos();

      L.positions.forEach((pos, index) => {
        if (!frameImg) {
          // 기본 그림일 때만 사진 칸에 그림자를 줌 (내 프레임 사진을 쓸 땐 없음)
          ctx.save();
          ctx.shadowColor = "rgba(0, 0, 0, 0.12)";
          ctx.shadowBlur = 12;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 4;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(pos.x, pos.y, L.pw, L.ph);
          ctx.restore();
        }

        ctx.save();
        ctx.beginPath();
        ctx.rect(pos.x, pos.y, L.pw, L.ph);
        ctx.clip();

        if (hasRealPhotos) {
          ctx.filter = photoFilter();
          ctx.drawImage(capturedFrames[L.photoMap[index]], pos.x, pos.y, L.pw, L.ph);
        } else {
          ctx.fillStyle = "#f6f8fb";
          ctx.fillRect(pos.x, pos.y, L.pw, L.ph);
          ctx.fillStyle = "#94a3b8";
          ctx.font = `34px ${APP_FONT}`;
          ctx.textAlign = "center";
          ctx.fillText(`사진 ${L.photoMap[index] + 1} 들어가는 곳`, pos.x + L.pw / 2, pos.y + L.ph / 2);
        }
        ctx.restore();

        if (!frameImg) {
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 8;
          ctx.strokeRect(pos.x, pos.y, L.pw, L.ph);
        }
      });

      // 하단 문구 렌더링 (고척초등학교 / ♥기버데이♥ / 날짜 세 줄, 가운데 맞춤)
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      const mainTextColor = scene.main;
      const subTextColor  = scene.sub;

      const fitText = (str, size, weight) => {
        ctx.font = `${weight} ${size}px ${APP_FONT}`;
        while (ctx.measureText(str).width > L.textWidth && size > 24) {
          size -= 2;
          ctx.font = `${weight} ${size}px ${APP_FONT}`;
        }
      };
      // 세로: 사진 아래 / 가로: 사진 옆(오른쪽). 종이를 반으로 잘라도 양쪽에 똑같이 들어감
      L.banner.forEach((b) => {
        // 가로는 빈 자리의 높이(약 220px)가 좁아서 글씨를 조금 줄임 (40 / 54 / 34)
        const sz = L.landscape ? [40, 54, 34] : [44, 60, 38];
        const y1 = L.landscape ? b.cy - 40 : 1588;
        const y2 = L.landscape ? b.cy + 22 : 1654;
        const y3 = L.landscape ? b.cy + 68 : 1706;
        ctx.fillStyle = mainTextColor;
        fitText("고척초등학교", sz[0], "bold");
        ctx.fillText("고척초등학교", b.cx, y1);
        fitText("♥기버데이♥", sz[1], "bold");
        ctx.fillText("♥기버데이♥", b.cx, y2);

        ctx.fillStyle = subTextColor;
        fitText("2026.11.19", sz[2], "bold");
        ctx.fillText("2026.11.19", b.cx, y3);

        // 학교 로고 (logo.png 가 있으면 세로 모드에서 문구 위에 삽입)
        if (!L.landscape) drawSchoolLogo(ctx, b.cx);
      });

      ctx.filter = "none";
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 캔버스 → PNG 이미지
    // (로고 이미지 때문에 브라우저가 캔버스를 막는 경우, 로고를 빼고 한 번 더 시도해서 인쇄/저장이 끊기지 않게 함)
    function canvasToPNG(target) {
      try {
        return target.toDataURL('image/png');
      } catch (err) {
        logoLoaded = false;
        drawPhotoStrip();
        return target.toDataURL('image/png');
      }
    }

    btnStart.addEventListener('click', startCaptureSequence);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isRunning && modal.style.display !== 'flex') {
        e.preventDefault();
        startCaptureSequence();
      }
    });

    // 인쇄가 끝나면(또는 인쇄 창을 닫으면) 찍은 사진을 지움
    function clearPhotos() {
      capturedFrames = [];
      printArea.replaceChildren();
      drawPhotoStrip();
    }

    // 인쇄 장수 고르기 (기본 1장. 인쇄하고 나면 다시 1장으로 돌아감)
    let printCopies = 1;
    function syncCopies() {
      document.querySelectorAll('.copies-btn').forEach(b => {
        const on = Number(b.dataset.copies) === printCopies;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', String(on));
      });
    }
    document.querySelector('.copies').addEventListener('click', (e) => {
      const b = e.target.closest('.copies-btn');
      if (!b) return;
      printCopies = Number(b.dataset.copies);
      syncCopies();
    });

    let isPrinting = false;
    document.getElementById('btnPrint').addEventListener('click', async () => {
      if (isPrinting) return;
      isPrinting = true;
      try {
        // 1) 인쇄할 이미지가 완전히 준비될 때까지 기다림 (빈 종이 방지)
        // 프린터에는 용지를 세로로만 넣으므로, 가로 사진은 90도 돌려서 세로 용지(4×6)에 인쇄
        let printSource = canvas;
        if (orientation === 'landscape') {
          printSource = document.createElement('canvas');
          printSource.width = canvas.height;
          printSource.height = canvas.width;
          const pc = printSource.getContext('2d');
          pc.translate(printSource.width, 0);
          pc.rotate(Math.PI / 2);
          pc.drawImage(canvas, 0, 0);
        }
        // 고른 장수만큼 같은 이미지를 한 장씩 한 쪽으로 만듦 (프린터가 장수만큼 인쇄)
        const dataUrl = canvasToPNG(printSource);
        const copies = printCopies;
        printArea.replaceChildren();
        const ready = [];
        for (let i = 0; i < copies; i++) {
          const pg = new Image();
          pg.className = 'print-page';
          pg.src = dataUrl;
          printArea.append(pg);
          ready.push(pg.decode().catch(() => { /* 준비 확인이 안 되는 브라우저는 그냥 진행 */ }));
        }
        await Promise.all(ready);
        // 2) 기다림 화면 없이 바로 처음 화면으로
        modal.style.display = 'none';
        printCopies = 1;
        syncCopies();
        // 3) 인쇄가 끝나면 사진 지움 (혹시 이벤트가 안 오면 30초 뒤에 지움)
        const failSafe = setTimeout(clearPhotos, 30000);
        window.addEventListener('afterprint', () => { clearTimeout(failSafe); clearPhotos(); }, { once: true });
        window.print();
      } finally {
        isPrinting = false;
      }
    });

    document.getElementById('btnClose').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    Promise.all([
      document.fonts.load("40px Cafe24Supermagic"),
      document.fonts.load("bold 40px Cafe24Supermagic")
    ]).catch(() => {}).then(() => document.fonts.ready).then(() => {
      drawPhotoStrip();
    });

    initCamera();
  </script>
</body>
</html>
